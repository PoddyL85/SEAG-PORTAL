<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nicolas's SEAG Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #f0f9ff; color: #0f172a; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1100; backdrop-filter: blur(4px); }
    .notification-bar { position: fixed; top: 20px; right: 20px; z-index: 1001; transition: opacity 0.5s, transform 0.5s; }
    @keyframes flash-green { 0% { background-color: #dcfce7; border-color: #22c55e; } 100% { background-color: white; border-color: #e2e8f0; } }
    @keyframes flash-red { 0% { background-color: #fee2e2; border-color: #ef4444; } 100% { background-color: white; border-color: #e2e8f0; } }
    .flash-correct { animation: flash-green 0.6s ease-out; }
    .flash-incorrect { animation: flash-red 0.6s ease-out; }
    .dyslexia-friendly, .dyslexia-friendly * { font-family: 'Open Sans', Arial, sans-serif !important; line-height: 1.8 !important; letter-spacing: 0.05em !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    function safeSetLocalStorage(key, value) {
      try { localStorage.setItem(key, value); return true; } 
      catch (e) { console.warn('localStorage write failed:', e); return false; }
    }

    // ==========================================
    // THE ENGINE IS NOW EMPTY OF QUESTIONS.
    // ALL CONTENT MUST BE IMPORTED VIA JSON.
    // ==========================================
    const defaultTests = [];

    // --- Achievements Data ---
    const achievementsList = [
        { id: 'firstSteps', title: 'First Steps', description: 'Attempt your first 5 questions.', category: 'Quick Wins' },
        { id: 'quickThinker', title: 'Quick Thinker', description: 'Get 1 correct answer in under 20 seconds.', category: 'Quick Wins' },
        { id: 'firstStreak', title: 'First Streak', description: 'Get a streak of 3 correct in a row.', category: 'Quick Wins', unlocksTitle: 'Streak Starter' },
        { id: 'topicExplorer', title: 'Topic Explorer', description: 'Attempt questions from 2 different topics in one day.', category: 'Quick Wins' },
        { id: 'mistakeFixer', title: 'Mistake Fixer', description: 'Correctly answer 1 previously-wrong question.', category: 'Quick Wins' },
        { id: 'noHintHeroMini', title: 'No-Hint Hero (Mini)', description: 'Answer 5 questions correctly without using hints.', category: 'Quick Wins' },
        { id: 'accurateStart', title: 'Accurate Start', description: 'Achieve 70% accuracy over your first 10 answers.', category: 'Quick Wins' },
        { id: 'comebackKid', title: 'Comeback Kid', description: 'Get 3 correct answers in a row after getting one wrong.', category: 'Quick Wins' },
        { id: 'speedStreak', title: 'Speed Streak', description: 'Get 3 correct in a row, each under 30 seconds.', category: 'Medium-Term' },
        { id: 'consistencyStar', title: 'Consistency Star', description: 'Practice 2 days in a row.', category: 'Medium-Term' },
        { id: 'varietyChamp', title: 'Variety Champ', description: 'Answer correctly in 3 different topics in one session.', category: 'Medium-Term' },
        { id: 'noHintHeroPro', title: 'No-Hint Hero (Pro)', description: '10 correct in a row without hints.', category: 'Medium-Term' },
        { id: 'solidAccuracy', title: 'Solid Accuracy', description: 'Reach 80% accuracy over any 20-question session.', category: 'Medium-Term' },
        { id: 'packFinisher', title: 'Pack Finisher', description: 'Complete any test pack.', category: 'Longer-Term' },
        { id: 'perfectPack', title: 'Perfect Pack', description: 'Get 100% on any test pack.', category: 'Longer-Term', unlocksTitle: 'Perfectionist' },
        { id: 'masteryBadge', title: 'Mastery Badge', description: 'Reach 90% accuracy over 30 questions in one topic.', category: 'Longer-Term' },
        { id: 'reviewPro', title: 'Review Pro', description: 'Correctly fix 10 mistakes in the "Practice Mistakes" mode.', category: 'Longer-Term' },
        { id: 'weeklyWarrior', title: 'Weekly Warrior', description: 'Complete a test on 5 separate days in one calendar week.', category: 'Longer-Term' },
        { id: 'fractionFanatic', title: 'Fraction Fanatic', description: 'Correctly answer 50 fraction questions.', category: 'Longer-Term' },
        { id: 'punctuationPro', title: 'Punctuation Pro', description: 'Correctly answer 25 punctuation questions.', category: 'Medium-Term' },
        { id: 'vocabularyVirtuoso', title: 'Vocabulary Virtuoso', description: 'Correctly answer 100 vocabulary questions.', category: 'Longer-Term' },
        { id: 'centuryClub', title: 'Century Club', description: 'Get 100 total correct answers.', category: 'Medium-Term' },
        { id: 'speedDemon', title: 'Speed Demon', description: 'Finish a test in Test Mode with over half the time remaining.', category: 'Medium-Term', unlocksTitle: 'Speedster' },
        { id: 'clutchPerformer', title: 'Clutch Performer', description: 'Correctly answer the final question of a full practice test.', category: 'Longer-Term' },
        { id: 'geometryGuru', title: 'Geometry Guru', description: 'Score 90%+ on three different tests containing geometry questions.', category: 'Longer-Term', unlocksTitle: 'Geometer' },
        { id: 'dedicatedDabbler', title: 'Dedicated Dabbler', description: 'Complete the Daily Challenge 7 days in a row.', category: 'Longer-Term' },
        { id: 'marathonRunner', title: 'Marathon Runner', description: 'Complete 3 full practice tests.', category: 'Longer-Term', unlocksTitle: 'Endurance Champ' },
    ];

    function xpForAchievementId(id) {
      const ach = achievementsList.find(a => a.id === id);
      if (!ach) return 0;
      switch (ach.category) { case 'Quick Wins': return 3; case 'Medium-Term': return 5; case 'Longer-Term': return 10; default: return 0; }
    }

    function isoWeekString(d) {
      const date = new Date(d);
      const tmp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
      return `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function unlockAchievements(userData, event) {
      userData.achievements = userData.achievements || {};
      userData.correctAnswersByTag = userData.correctAnswersByTag || {};
      userData.badgeProgress = userData.badgeProgress || {};
      userData.badgeProgress.geometryGuruTests = Array.isArray(userData.badgeProgress.geometryGuruTests) ? userData.badgeProgress.geometryGuruTests : [];
      userData.weeklyCompletionWeeks = Array.isArray(userData.weeklyCompletionWeeks) ? userData.weeklyCompletionWeeks : [];
      userData.fullTestsCompleted = Array.isArray(userData.fullTestsCompleted) ? userData.fullTestsCompleted : [];
      
      const unlockedNow = [];
      const has = (id) => !!userData.achievements[id];
      const unlock = (id) => { if (!userData.achievements[id]) { userData.achievements[id] = true; unlockedNow.push(id); } };
      
      const type = event?.type;
      const p = event?.payload || {};
      const mode = p.mode;
      
      if ((type === 'ANSWER_SUBMITTED' || type === 'PACK_COMPLETED') && mode !== 'Test') {
        if (!(type === 'ANSWER_SUBMITTED' && p.wasReviewed)) return { updated: userData, unlockedIds: [] };
      }
      
      if (type === 'ANSWER_SUBMITTED') {
        const tagCounts = userData.correctAnswersByTag || {};
        if (!has('fractionFanatic') && (tagCounts.fractions || 0) >= 50) unlock('fractionFanatic');
        if (!has('punctuationPro') && (tagCounts.punctuation || 0) >= 25) unlock('punctuationPro');
        if (!has('vocabularyVirtuoso') && (tagCounts.vocabulary || 0) >= 100) unlock('vocabularyVirtuoso');
        if (!has('centuryClub') && (userData.totalCorrectAnswers || 0) >= 100) unlock('centuryClub');
        if (!has('comebackKid') && p.correct && (userData.correctRunAfterWrong || 0) >= 3) unlock('comebackKid');
        if (!has('firstSteps') && (userData.totalAttempts || 0) >= 5) unlock('firstSteps');
        if (!has('quickThinker') && p.correct && (p.timeToAnswer || 0) <= 20) unlock('quickThinker');
        if (!has('firstStreak') && (userData.currentStreak || 0) >= 3) unlock('firstStreak');
        if (!has('topicExplorer') && (userData.uniqueTagsToday?.tags?.length || 0) >= 2) unlock('topicExplorer');
        if (!has('mistakeFixer') && p.correct && p.wasReviewed) unlock('mistakeFixer');
        if (!has('noHintHeroMini') && (userData.noHintCorrectCount || 0) >= 5) unlock('noHintHeroMini');
        if (!has('accurateStart') && (userData.totalAttempts || 0) >= 10 && ((userData.totalCorrectAnswers || 0) / userData.totalAttempts) >= 0.7) unlock('accurateStart');
        if (!has('speedStreak') && (userData.currentStreak || 0) >= 3 && (userData.lastCorrectAnswerTimes || []).length === 3 && userData.lastCorrectAnswerTimes.every(t => t <= 30)) unlock('speedStreak');
        if (!has('consistencyStar') && (userData.loginStreak || 0) >= 2) unlock('consistencyStar');
        if (!has('varietyChamp') && p.correct && (userData.uniqueTagsToday?.tags?.length || 0) >= 3) unlock('varietyChamp');
        if (!has('noHintHeroPro') && (userData.noHintStreak || 0) >= 10) unlock('noHintHeroPro');
        if (!has('masteryBadge')) {
            const stats = userData.perTopicStats || {};
            if (Object.values(stats).some(s => s.total >= 30 && (s.correct / s.total) >= 0.9)) unlock('masteryBadge');
        }
        if (!has('reviewPro') && (userData.reviewCorrections || 0) >= 10) unlock('reviewPro');
      }
      
      if (type === 'PACK_COMPLETED') {
        if (!has('speedDemon') && typeof p.timeLeft === 'number' && typeof p.initialTotalTime === 'number' && p.initialTotalTime > 0 && p.timeLeft >= (p.initialTotalTime / 2)) unlock('speedDemon');
        if (!has('clutchPerformer') && p.totalQuestions > 50 && p.lastQuestionCorrect) unlock('clutchPerformer');
        if (p.testHasGeometry && p.totalQuestions > 0 && (p.score / p.totalQuestions) >= 0.9) {
          const list = new Set(userData.badgeProgress.geometryGuruTests);
          list.add(p.finishedTestId);
          userData.badgeProgress.geometryGuruTests = Array.from(list);
          if (!has('geometryGuru') && userData.badgeProgress.geometryGuruTests.length >= 3) unlock('geometryGuru');
        }
        if (p.finishedAt) {
          const finishedDate = new Date(p.finishedAt);
          userData.weeklyDayMap = userData.weeklyDayMap || {};
          const weekKey = isoWeekString(finishedDate);
          const dayKey = finishedDate.toISOString().split('T')[0];
          const days = userData.weeklyDayMap[weekKey] || {};
          days[dayKey] = true;
          userData.weeklyDayMap[weekKey] = days;
          if (!has('weeklyWarrior') && Object.keys(days).length >= 5) unlock('weeklyWarrior');
        }
        if (p.totalQuestions > 50) {
          const ft = new Set(userData.fullTestsCompleted);
          ft.add(p.finishedTestId);
          userData.fullTestsCompleted = Array.from(ft);
          if (!has('marathonRunner') && userData.fullTestsCompleted.length >= 3) unlock('marathonRunner');
        }
        if (!has('solidAccuracy') && (p.totalQuestions || 0) >= 20 && ((p.score || 0) / (p.totalQuestions || 1)) >= 0.8) unlock('solidAccuracy');
        if (!has('packFinisher')) unlock('packFinisher');
        if (!has('perfectPack') && p.score === p.totalQuestions) unlock('perfectPack');
        if (!has('dedicatedDabbler') && p.isDailyChallenge && (userData.dailyChallengeStreak || 0) >= 7) unlock('dedicatedDabbler');
      }
      return { updated: userData, unlockedIds: unlockedNow };
    }

    // --- Format & Parse Helpers ---
    function formatTime(ms) {
      if (ms < 0) ms = 0;
      const sec = Math.floor(ms / 1000);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }

    function extractLabeledOptionsFromPrompt(prompt) {
      if (!prompt) return null;
      const s = String(prompt).replace(/\s+/g, ' ').trim();
      const firstA = /(?:^|[\s(])[Aa][\)\.\:]\s*/.exec(s);
      if (!firstA) return null;
      const stem = s.slice(0, firstA.index).trim();
      const rest = s.slice(firstA.index);
      const labelRe = /(?:^|[\s(])([A-Ea-e])[\)\.\:]\s*/g;
      let match; const spans = [];
      while ((match = labelRe.exec(rest)) !== null) { spans.push({ label: match[1].toLowerCase(), labelStart: match.index, textStart: labelRe.lastIndex }); }
      if (spans.length < 2) return null;
      const options = [];
      for (let i = 0; i < spans.length; i++) {
        const start = spans[i].textStart;
        const end = (i + 1 < spans.length) ? spans[i + 1].labelStart : rest.length;
        options.push(rest.slice(start, end).trim());
      }
      const labels = spans.map(s => s.label);
      if (options.filter(Boolean).length >= 2) return { stem: stem || s, options, labels };
      return null;
    }

    function tryParseTwoOptionsFromOr(prompt) {
      if (!prompt) return null;
      const s = String(prompt).replace(/\s+/g, ' ').trim();
      if (/(?:^|[\s(])[A-Da-d][\)\.\:]\s/.test(s)) return null;
      const parts = s.split(/\s+or\s+/i);
      if (parts.length !== 2) return null;
      const colonIdx = s.lastIndexOf(':');
      const stem = colonIdx >= 0 ? s.slice(0, colonIdx + 1).trim() : s;
      const leftSource = parts[0];
      const left = colonIdx >= 0 ? leftSource.slice(leftSource.lastIndexOf(':') + 1).trim() : leftSource.trim();
      const right = parts[1].trim();
      if (left && left.length >= 2 && right && right.length >= 2) return { stem, options: [left, right] };
      return null;
    }

    const unicodeFractionMap = new Map([['½','1/2'],['⅓','1/3'],['⅔','2/3'],['¼','1/4'],['¾','3/4'],['⅕','1/5'],['⅖','2/5'],['⅗','3/5'],['⅘','4/5'],['⅙','1/6'],['⅚','5/6'],['⅛','1/8'],['⅜','3/8'],['⅝','5/8'],['⅞','7/8']]);
    function replaceUnicodeFractions(s) { let out = s; unicodeFractionMap.forEach((ascii, uni) => { out = out.replaceAll(uni, ascii); }); return out; }
    function normalizeDecimalSyntax(s) { let t = s.trim(); if (/\d/.test(t) && (t.match(/,/g)?.length === 1) && !t.includes('.')) { t = t.replace(',', '.'); } return t.replace(/(^|\s)\.(\d)/g, '$10.$2'); }
    function parseAsciiFraction(frac) { const m = frac.trim().match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/); if (!m) return null; const num = parseFloat(m[1]); const den = parseFloat(m[2]); if (!isFinite(num) || !isFinite(den) || den === 0) return null; return num / den; }
    function parseMixedFraction(s) { const m = s.trim().match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/); if (!m) return null; const w = parseFloat(m[1]); const n = parseFloat(m[2]); const d = parseFloat(m[3]); if (!isFinite(w) || !isFinite(n) || !isFinite(d) || d === 0) return null; return w + (w < 0 ? -1 : 1) * (n / d); }
    function detectPercentUnit(raw) { return /%|\bpercent\b|\bper\s*cent\b/.test(raw.toLowerCase()); }
    function stripPercentText(raw) { return raw.replace(/%|\bpercent\b|\bper\s*cent\b/gi, ''); }
    function unitStripForNumeric(raw) { if (raw == null) return ''; return String(raw).replace(/[£$€]/g, '').replace(/\b(cm2|cm²|m2|m²|cm|mm|m|kg|g|km|miles?|meters?|metres?|meter|metre|deg|degrees|°|hrs?|hours?|mins?|minutes?)\b/gi, '').trim(); }
    
    function normalizeNumericLike(raw) {
      if (raw == null) return { ok: false };
      let s = String(raw).trim();
      s = replaceUnicodeFractions(s);
      const hadPercent = detectPercentUnit(s);
      if (hadPercent) s = stripPercentText(s);
      s = normalizeDecimalSyntax(s);
      let val = parseMixedFraction(s);
      if (val == null) { const fracVal = parseAsciiFraction(s); if (fracVal != null) val = fracVal; }
      if (val == null) { const num = parseFloat(s); if (!Number.isNaN(num) && isFinite(num)) val = num; }
      if (val == null) return { ok: false };
      return { ok: true, value: val, isPercent: hadPercent };
    }

    function compareNumericAnswers(studentRaw, correctRaw, options = {}) {
      const { toleranceAbs = 1e-4, toleranceRel = 1e-3, percentEquivalence = 'both' } = options;
      const s = normalizeNumericLike(studentRaw); const c = normalizeNumericLike(correctRaw);
      if (!s.ok || !c.ok) return { equal: false };
      const candidates = [];
      if (s.isPercent === c.isPercent) candidates.push([s.value, c.value]);
      if (percentEquivalence === 'both' || percentEquivalence === 'studentToPercent') { if (c.isPercent && !s.isPercent) candidates.push([s.value * 100, c.value]); }
      if (percentEquivalence === 'both' || percentEquivalence === 'correctToPercent') { if (s.isPercent && !c.isPercent) candidates.push([s.value, c.value * 100]); }
      for (const [sv, cv] of candidates) {
        const diff = Math.abs(sv - cv);
        const rel = Math.abs(diff / (Math.abs(cv) > 0 ? Math.abs(cv) : 1));
        if (diff <= toleranceAbs || rel <= toleranceRel) return { equal: true };
      }
      return { equal: false };
    }

    function stripOuterQuotesAndEndPunct(s) { return s.replace(/^[“”"']+|[“”"']+$/g, '').replace(/[.?!]+$/g, '').trim(); }
    function stripLeadingArticles(s) { return s.replace(/^(?:an?|the)\s+/i, '').trim(); }
    const normalizeAnswer = (answer, tags = []) => {
      if (answer == null) return '';
      let s = String(answer).toLowerCase().trim().replace(/\s+/g, ' ').replace(/\b(a|an|the)\b/g, '').trim();
      return s;
    };
    
    const isAnswerCorrect = (question, userAnswer) => {
      if (!question) return false;
      const correctAnswer = question.answer;
      const tags = question.tags || [];
      const qText = question.question || '';
      
      const labeled = extractLabeledOptionsFromPrompt(qText);
      if (labeled && labeled.options?.length >= 2) {
        const s = String(userAnswer ?? '').trim().toLowerCase();
        const c = String(correctAnswer ?? '').trim().toLowerCase();
        if (/^[a-z]$/.test(c)) return s === c;
        if (/^[a-z]$/.test(s)) {
          const idx = s.charCodeAt(0) - 97;
          const chosen = labeled.options[idx]?.trim().toLowerCase();
          return chosen && chosen === c;
        }
        return s === c;
      }
      
      if (tags.includes('geometry') || tags.includes('percentages') || tags.includes('fractions')) {
        const sVal = unitStripForNumeric(userAnswer);
        const cVal = unitStripForNumeric(correctAnswer);
        if (compareNumericAnswers(sVal, cVal).equal) return true;
      }
      
      const sNorm = normalizeNumericLike(unitStripForNumeric(userAnswer));
      const cNorm = normalizeNumericLike(unitStripForNumeric(correctAnswer));
      if (sNorm.ok && cNorm.ok) {
        if (compareNumericAnswers(sNorm.value, cNorm.value).equal) return true;
      }
      
      const normalizedCorrect = normalizeAnswer(correctAnswer, tags);
      const normalizedUser = normalizeAnswer(userAnswer, tags);
      if (normalizedCorrect === normalizedUser) return true;
      const looseCorrect = stripLeadingArticles(stripOuterQuotesAndEndPunct(normalizedCorrect));
      const looseUser = stripLeadingArticles(stripOuterQuotesAndEndPunct(normalizedUser));
      return looseCorrect === looseUser;
    };

    // --- Sub-Components ---
    const AIExplanation = ({ question, userAnswer, correctAnswer, onClose }) => {
      const [explanation, setExplanation] = useState('');
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        const generate = async () => {
          setLoading(true);
          try {
            const hasOptions = Array.isArray(question.options) && question.options.length > 0;
            const optionsText = hasOptions ? `Options: ${question.options.map((opt, i) => `${i + 1}) ${opt}`).join(' | ')}` : '';
            const prompt = `You are a kind tutor for a 10-year-old. Explain clearly why the answer is wrong and why the correct answer is right. Question: ${question.question}. ${optionsText} User's answer: ${userAnswer}. Correct answer: ${correctAnswer}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }] };
            const response = await fetch('/.netlify/functions/gemini-proxy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await response.json();
            const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || data?.explanation || '';
            setExplanation(aiText.trim() || `The correct answer is ${correctAnswer}. Think about what makes this answer right.`);
          } catch (err) {
            setExplanation(`Don't worry about getting it wrong - that's how we learn! The correct answer is ${correctAnswer}.`);
          } finally { setLoading(false); }
        };
        generate();
      }, [question, userAnswer, correctAnswer]);

      if (loading) return <div className="mt-3 p-4 bg-sky-50 border border-sky-200 rounded-lg text-sky-800">Generating explanation...</div>;
      return (
        <div className="mt-3 p-4 bg-sky-50 border border-sky-200 rounded-lg">
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1"><p className="text-sky-800 text-sm">{explanation}</p></div>
            <button onClick={onClose} className="text-sky-600 font-bold hover:text-sky-800">✕</button>
          </div>
        </div>
      );
    };

    const LoadingSpinner = ({ message }) => (
      <div className="flex flex-col justify-center items-center h-screen bg-sky-50">
        <div className="animate-spin rounded-full h-24 w-24 border-t-4 border-b-4 border-sky-500 mb-4"></div>
        <p className="text-xl text-sky-800 font-orbitron font-bold">{message}</p>
      </div>
    );

    const Notification = ({ message, type, onDismiss }) => {
      useEffect(() => { const timer = setTimeout(() => onDismiss(), 3000); return () => clearTimeout(timer); }, [onDismiss]);
      return <div className={`notification-bar p-4 rounded-xl text-white font-bold shadow-lg ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`}>{message}</div>;
    };

    const Modal = ({ title, message, onConfirm, onCancel, confirmText, children }) => {
      return (
        <div className="modal-backdrop">
          <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center border-4 border-sky-100">
            <h2 className="text-3xl font-bold text-sky-900 mb-4 font-orbitron">{title}</h2>
            {message && <p className="text-slate-600 font-semibold mb-8">{message}</p>}
            {children}
            <div className="flex justify-center gap-4 mt-8">
              {onCancel && <button onClick={onCancel} className="bg-slate-200 text-slate-800 font-bold py-3 px-6 rounded-xl hover:bg-slate-300">Cancel</button>}
              {onConfirm && confirmText && <button onClick={onConfirm} className={`font-bold py-3 px-6 rounded-xl text-white ${confirmText === 'Delete' || confirmText.includes('Reset') ? 'bg-red-500 hover:bg-red-400' : 'bg-sky-600 hover:bg-sky-500'}`}>{confirmText}</button>}
            </div>
          </div>
        </div>
      );
    };

    const CustomModeSelector = ({ onStart }) => {
        const [useTimer, setUseTimer] = useState(true);
        const [useHints, setUseHints] = useState(false);
        const [shuffle, setShuffle] = useState(false);
        return (
            <div className="text-left p-4 bg-slate-50 rounded-xl mt-4 border border-slate-200">
                <h4 className="font-bold text-lg text-center mb-4 text-sky-900">Custom Settings</h4>
                <div className="space-y-4">
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Enable Timer</label><input type="checkbox" checked={useTimer} onChange={() => setUseTimer(!useTimer)} className="w-6 h-6 rounded text-sky-500" /></div>
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Enable Hints & Feedback</label><input type="checkbox" checked={useHints} onChange={() => setUseHints(!useHints)} className="w-6 h-6 rounded text-sky-500" /></div>
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Shuffle Questions</label><input type="checkbox" checked={shuffle} onChange={() => setShuffle(!shuffle)} className="w-6 h-6 rounded text-sky-500" /></div>
                </div>
                <button onClick={() => onStart({ mode: 'Custom', timer: useTimer, hints: useHints, shuffle })} className="w-full text-center p-3 mt-6 bg-purple-600 text-white hover:bg-purple-500 rounded-xl font-bold">Start Custom Test</button>
            </div>
        );
    }

    const QuestionNavigator = ({ total, current, answeredIndices, onNavigate }) => {
        return (
            <div className="flex flex-wrap gap-2 my-4">
                {Array.from({ length: total }, (_, i) => {
                    const isAnswered = answeredIndices.has(i);
                    const isCurrent = i === current;
                    let btnClass = 'bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50';
                    if (isCurrent) btnClass = 'bg-sky-500 text-white border-sky-600 shadow-md transform scale-110';
                    else if (isAnswered) btnClass = 'bg-sky-100 border-sky-300 text-sky-800';
                    return <button key={i} onClick={() => onNavigate(i)} className={`w-10 h-10 rounded-xl font-bold transition-all ${btnClass}`}>{i + 1}</button>;
                })}
            </div>
        );
    }

    // --- MAIN DASHBOARD: UPDATED FOR LEARNING JOURNEY UI ---
    const Dashboard = ({ userData, setView, setSelectedTest, allTests, showModal, hideModal, updateAllData, appData, showNotification }) => {
      const xpForNextLevel = (userData.level || 1) * 100;
      const xpPercent = ((userData.xp || 0) / xpForNextLevel) * 100;

      const handleSelectTest = (testId) => {
        const test = allTests.find(t => t.id === testId);
        const progress = userData.progress?.[testId];
        const answered = progress ? Object.keys(progress.answers || {}).length : 0;
        if (progress && answered > 0 && answered < test.questions.length) {
          setSelectedTest({ id: testId, settings: progress.settings || { mode: 'Practice', shuffle: false } });
          setView('quiz'); return;
        }
        showModal({
          title: "Choose Your Mode",
          children: (
            <div className="space-y-4">
              <button onClick={() => { setSelectedTest({ id: testId, settings: { mode: 'Practice', shuffle: false } }); setView('quiz'); hideModal(); }} className="w-full text-left p-6 bg-sky-100 hover:bg-sky-200 rounded-2xl border-2 border-sky-300"><h3 className="font-bold text-sky-900 text-xl">Practice Mode</h3><p className="text-sky-700 mt-2">No timer, hints enabled, live feedback.</p></button>
              <button onClick={() => { setSelectedTest({ id: testId, settings: { mode: 'Test', shuffle: false } }); setView('quiz'); hideModal(); }} className="w-full text-left p-6 bg-amber-100 hover:bg-amber-200 rounded-2xl border-2 border-amber-300"><h3 className="font-bold text-amber-900 text-xl">Test Mode</h3><p className="text-amber-700 mt-2">Timer countdown runs, no hints, results at the end.</p></button>
              <CustomModeSelector onStart={(settings) => { setSelectedTest({ id: testId, settings }); setView('quiz'); hideModal(); }} />
            </div>
          ), onCancel: hideModal
        });
      };

      const handleAdminAccess = () => {
          const pin = prompt("Please enter Parent PIN to access Admin Panel:");
          if (pin === "1234") setView('admin');
          else if (pin !== null) alert("Incorrect PIN.");
      };

      const handleDailyChallenge = () => {
        let allQuestions = allTests.flatMap(t => t.questions);
        if(allQuestions.length < 5) return showNotification({message: "Not enough questions for a challenge yet!", type: "error"});
        const dailyQs = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 5);
        const challenge = { id: 'daily-challenge', title: 'Daily Challenge', subject: 'Mixed', questions: dailyQs };
        updateAllData({ ...appData, allTests: [...allTests.filter(t => t.id !== 'daily-challenge'), challenge] });
        setSelectedTest({ id: 'daily-challenge', settings: { mode: 'Practice', shuffle: true } });
        setView('quiz');
      };

      const handlePracticeMistakes = () => {
        const mistakes = []; const seen = new Set();
        Object.entries(userData.progress || {}).forEach(([tid, pData]) => {
          if (tid === 'mistakes-test') return;
          const test = allTests.find(t => t.id === tid);
          if (!test) return;
          Object.entries(pData.answers || {}).forEach(([qIdxStr, ua]) => {
            const qIdx = Number(qIdxStr); const q = test.questions[qIdx];
            if (q && !isAnswerCorrect(q, ua) && !seen.has(q.question)) { mistakes.push({ ...q, originalTestId: tid, originalQIndex: qIdx }); seen.add(q.question); }
          });
        });
        if (mistakes.length === 0) { showNotification({message: "No mistakes to practice. Great job!", type: "success"}); return; }
        const mistakesTest = { id: 'mistakes-test', title: 'Practice Your Mistakes', subject: 'Mixed', questions: mistakes };
        updateAllData({ ...appData, allTests: [...allTests.filter(t => t.id !== 'mistakes-test'), mistakesTest] });
        setSelectedTest({ id: 'mistakes-test', settings: { mode: 'Practice', shuffle: true } });
        setView('quiz');
      };
      
      const hasMistakes = Object.values(userData.progress || {}).some(p => (p.score || 0) < Object.keys(p.answers || {}).length);

      // --- Grouping Logic for "Journey" View ---
      const level1Tests = allTests.filter(t => t.level === 1 && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const level2Tests = allTests.filter(t => t.level === 2 && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const level3Tests = allTests.filter(t => (t.level === 3 || t.id.includes('full')) && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const uncategorizedTests = allTests.filter(t => !t.level && !t.id.includes('full') && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');

      const renderTestCard = (test) => {
          const progress = userData.progress?.[test.id];
          const answered = progress ? Object.keys(progress.answers || {}).length : 0;
          const total = test.questions.length;
          const pct = total > 0 ? (answered / total) * 100 : 0;
          return (
            <div key={test.id} className="bg-white border-2 border-slate-100 rounded-3xl p-6 shadow-md hover:shadow-xl hover:border-sky-300 transition flex flex-col justify-between">
              <div>
                <h3 className="text-xl font-bold text-sky-900 mb-2 font-orbitron">{test.title}</h3>
                <p className="text-slate-500 font-bold mb-4">{test.subject} • {total} Qs</p>
                <div className="w-full bg-slate-100 rounded-full h-3 mb-2"><div className="bg-emerald-400 h-3 rounded-full" style={{ width: `${pct}%` }}></div></div>
                <p className="text-sm font-bold text-slate-400 mb-6">{answered} / {total} answered</p>
              </div>
              <button onClick={() => handleSelectTest(test.id)} className="w-full bg-sky-600 text-white font-bold py-3 rounded-xl hover:bg-sky-500 shadow-md text-lg">{answered > 0 && answered < total ? 'Continue Test' : 'Start Test'}</button>
            </div>
          );
      };

      return (
        <div className="p-4 sm:p-10 max-w-7xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
            <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 flex items-center font-orbitron">
              <span className="text-6xl mr-4">{userData.avatar || '👨‍🚀'}</span> Welcome, {userData.name}!
            </h1>
            <div className="flex gap-3">
              <button onClick={() => setView('settings')} className="bg-white border-2 border-slate-200 text-slate-600 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-slate-50 transition">Profile</button>
              <button onClick={() => setView('achievements')} className="bg-yellow-400 text-yellow-900 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-yellow-300 transition">Achievements</button>
              <button onClick={handleAdminAccess} className="bg-slate-200 text-slate-700 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-slate-300 transition">⚙️ Parents</button>
            </div>
          </div>
          
          <div className="bg-white border-2 border-sky-100 rounded-3xl p-6 mb-10 shadow-lg">
            <div className="flex justify-between items-center mb-3 font-orbitron">
              <span className="font-bold text-sky-700 text-2xl">Level {userData.level || 1} {userData.title && <span className="ml-3 text-lg bg-amber-100 text-amber-800 px-4 py-1 rounded-full font-sans">{userData.title}</span>}</span>
              <span className="text-lg text-slate-500 font-bold">{userData.xp || 0} / {xpForNextLevel} XP</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-6 border border-slate-200">
              <div className="bg-gradient-to-r from-sky-400 to-indigo-500 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(100, Math.max(0, xpPercent))}%` }}></div>
            </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
            <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
              <h2 className="text-3xl font-bold mb-2 font-orbitron">Daily Challenge</h2>
              <p className="opacity-90 text-lg mb-6">A quick 5-question warmup!</p>
              {userData.dailyChallenge?.completedToday ? (
                <div className="bg-white/20 p-3 rounded-xl font-bold text-center">Complete! See you tomorrow.</div>
              ) : (
                <button onClick={handleDailyChallenge} className="w-full bg-white text-purple-700 font-bold py-3 rounded-xl hover:bg-slate-100 shadow-lg text-lg">Start Challenge</button>
              )}
            </div>
            <div className="bg-gradient-to-br from-amber-400 to-orange-500 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
              <h2 className="text-3xl font-bold mb-2 font-orbitron">Review Mistakes</h2>
              <p className="opacity-90 text-lg mb-6">Turn past errors into strengths.</p>
              <div className="relative group">
                  <button onClick={handlePracticeMistakes} disabled={!hasMistakes} className="w-full bg-white text-orange-600 font-bold py-3 rounded-xl hover:bg-slate-100 disabled:opacity-50 shadow-lg text-lg">Practice Mistakes</button>
                  {!hasMistakes && <p className="absolute text-center w-full mt-2 text-sm font-bold opacity-80">You don't have any mistakes yet!</p>}
              </div>
            </div>
          </div>
          
          {/* THE LEARNING JOURNEY MAP */}
          <div className="space-y-16 pl-4 md:pl-8 border-l-8 border-sky-200">
              
              {/* LEVEL 1 */}
              <div className="relative">
                  <div className="absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 bg-emerald-500 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md">1</div>
                  <div className="ml-8 md:ml-12">
                      <h2 className="text-3xl font-bold text-emerald-700 mb-2 font-orbitron">Level 1: Confidence Builder</h2>
                      <p className="text-lg text-slate-500 font-semibold mb-6">Early P6 • Shorter, topic-focused questions to build foundational skills.</p>
                      
                      {level1Tests.length > 0 ? (
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                              {level1Tests.map(renderTestCard)}
                          </div>
                      ) : (
                          <div className="bg-slate-50 border-2 border-dashed border-slate-200 p-8 rounded-3xl text-center">
                              <p className="text-slate-500 font-bold text-lg">No Level 1 tests loaded yet. Import a test pack in the Parents Area!</p>
                          </div>
                      )}
                  </div>
              </div>

              {/* LEVEL 2 */}
              <div className="relative">
                  <div className="absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 bg-amber-500 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md">2</div>
                  <div className="ml-8 md:ml-12">
                      <h2 className="text-3xl font-bold text-amber-700 mb-2 font-orbitron">Level 2: Skill Development</h2>
                      <p className="text-lg text-slate-500 font-semibold mb-6">Mid P6 • Mixed curriculum, introducing trickier SEAG formats.</p>
                      
                      {level2Tests.length > 0 ? (
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                              {level2Tests.map(renderTestCard)}
                          </div>
                      ) : (
                          <div className="bg-slate-50 border-2 border-dashed border-slate-200 p-8 rounded-3xl text-center">
                              <p className="text-slate-500 font-bold text-lg">No Level 2 tests loaded yet.</p>
                          </div>
                      )}
                  </div>
              </div>

              {/* LEVEL 3 */}
              <div className="relative">
                  <div className="absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 bg-red-500 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md">3</div>
                  <div className="ml-8 md:ml-12">
                      <h2 className="text-3xl font-bold text-red-700 mb-2 font-orbitron">Level 3: Exam Standard</h2>
                      <p className="text-lg text-slate-500 font-semibold mb-6">End P6 / P7 • Full SEAG-style timing, 5-option MCQs, and complete mock papers.</p>
                      
                      {level3Tests.length > 0 ? (
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                              {level3Tests.map(renderTestCard)}
                          </div>
                      ) : (
                          <div className="bg-slate-50 border-2 border-dashed border-slate-200 p-8 rounded-3xl text-center">
                              <p className="text-slate-500 font-bold text-lg">No Level 3 tests loaded yet.</p>
                          </div>
                      )}
                  </div>
              </div>

              {/* UNCATEGORIZED (Legacy or manually created tests) */}
              {uncategorizedTests.length > 0 && (
                  <div className="relative">
                      <div className="absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 bg-slate-400 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md">?</div>
                      <div className="ml-8 md:ml-12">
                          <h2 className="text-3xl font-bold text-slate-600 mb-2 font-orbitron">Extra Practice</h2>
                          <p className="text-lg text-slate-500 font-semibold mb-6">Custom tests and other uncategorized material.</p>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                              {uncategorizedTests.map(renderTestCard)}
                          </div>
                      </div>
                  </div>
              )}
          </div>
        </div>
      );
    };

    const QuizView = ({ userData, testDetails, setView, allTests, updateUserData, showNotification, showModal }) => {
      const { id: testId, settings } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const existingProgress = userData?.progress?.[testId] || {};
      
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(existingProgress?.lastQuestionIndex || 0);
      const [userAnswers, setUserAnswers] = useState(existingProgress?.answers || {});
      const [submittedAnswers, setSubmittedAnswers] = useState(existingProgress?.submittedAnswers || {});
      const [streak, setStreak] = useState(existingProgress?.streak || 0);
      const [hint, setHint] = useState(null);
      const [isHintLoading, setIsHintLoading] = useState(false);
      const [showExplanation, setShowExplanation] = useState(false);
      const [lastAnswerResult, setLastAnswerResult] = useState(null);
      const [shuffledOrder, setShuffledOrder] = useState(null);

      const timerEnabled = settings.mode === 'Test' || (settings.mode === 'Custom' && settings.timer);
      const timeLimitMs = settings.mode === 'Test' ? 45 * 60 * 1000 : 0; 
      
      const [questionStartTime, setQuestionStartTime] = useState(Date.now());
      const [accumulatedElapsedMs, setAccumulatedElapsedMs] = useState(existingProgress?.accumulatedElapsedMs || 0);
      const [displayTime, setDisplayTime] = useState(timeLimitMs > 0 ? timeLimitMs : 0);

      const [flash, setFlash] = useState(null);
      const [feedback, setFeedback] = useState(null);

      useEffect(() => {
        if (settings.shuffle && !existingProgress.shuffledOrder) {
            const indices = Array.from(test.questions.keys());
            for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
            setShuffledOrder(indices);
            updateUserData({ ...userData, progress: { ...userData.progress, [testId]: { ...existingProgress, shuffledOrder: indices, settings } } }, { event: { type: 'NO_OP' } });
        } else if (existingProgress.shuffledOrder) { setShuffledOrder(existingProgress.shuffledOrder); }
      }, []);

      useEffect(() => {
        if (!timerEnabled) return;
        const interval = setInterval(() => {
            const now = Date.now();
            const elapsed = accumulatedElapsedMs + (now - questionStartTime);
            setDisplayTime(timeLimitMs > 0 ? Math.max(0, timeLimitMs - elapsed) : elapsed);
        }, 1000);
        return () => clearInterval(interval);
      }, [timerEnabled, accumulatedElapsedMs, questionStartTime, timeLimitMs]);

      const commitElapsed = () => { const now = Date.now(); const delta = now - questionStartTime; setAccumulatedElapsedMs(prev => prev + delta); setQuestionStartTime(now); return delta; };
      const calculateScore = useCallback(() => { return Object.entries(userAnswers).reduce((acc, [idx, ua]) => acc + (isAnswerCorrect(test.questions[idx], ua) ? 1 : 0), 0); }, [userAnswers, test.questions]);

      const saveProgress = useCallback((isFinished = false, overrideIndex) => {
        const score = calculateScore();
        const pEntry = { answers: userAnswers, lastQuestionIndex: typeof overrideIndex === 'number' ? overrideIndex : currentQuestionIndex, score, accumulatedElapsedMs, questionStartTime, streak, settings, submittedAnswers, ...(shuffledOrder && { shuffledOrder }), ...(isFinished ? { completedAt: Date.now() } : {}) };
        const newProg = { ...userData.progress, [testId]: pEntry };
        const lastOrigIdx = shuffledOrder ? shuffledOrder[test.questions.length - 1] : (test.questions.length - 1);
        
        updateUserData({ ...userData, progress: newProg }, {
            event: isFinished ? { type: 'PACK_COMPLETED', payload: { finishedTestId: testId, totalQuestions: test.questions.length, score, mode: settings.mode, initialTotalTime: timeLimitMs, timeLeft: displayTime, testHasGeometry: test.questions.some(q => (q.tags || []).includes('geometry')), lastQuestionCorrect: isAnswerCorrect(test.questions[lastOrigIdx], userAnswers[lastOrigIdx]), isFullPractice: testId.startsWith('full-test') || testId.startsWith('seag'), isDailyChallenge: testId === 'daily-challenge', finishedAt: Date.now() } } : undefined
        });
      }, [userData, testId, userAnswers, currentQuestionIndex, calculateScore, accumulatedElapsedMs, questionStartTime, streak, settings, submittedAnswers, shuffledOrder, test, updateUserData, timeLimitMs, displayTime]);

      const originalIndex = shuffledOrder ? shuffledOrder[currentQuestionIndex] : currentQuestionIndex;
      const showInstantFeedback = settings.mode === 'Practice' || (settings.mode === 'Custom' && settings.hints);

      const handleAnswerSelect = (answer) => {
        if (submittedAnswers[currentQuestionIndex]) return;
        setUserAnswers(prev => ({ ...prev, [originalIndex]: answer }));
        if (showInstantFeedback && !submittedAnswers[currentQuestionIndex]) setTimeout(() => handleSubmitAnswer(answer), 0);
      };

      const handleSubmitAnswer = (ansOverride) => {
        const answer = ansOverride || userAnswers[originalIndex];
        if (!answer) return;
        setSubmittedAnswers(prev => ({ ...prev, [currentQuestionIndex]: true }));
        const deltaMs = commitElapsed();
        const question = test.questions[originalIndex];
        const isCorrect = isAnswerCorrect(question, answer);
        
        setLastAnswerResult({ isCorrect, userAnswer: answer, question });
        updateUserData(userData, { event: { type: 'ANSWER_SUBMITTED', payload: { correct: isCorrect, timeToAnswer: deltaMs/1000, usedHint: !!hint, tags: question.tags || [], wasReviewed: testId === 'mistakes-test', mode: settings.mode, testId } }});
        
        setStreak(isCorrect ? streak + 1 : 0);
        if (showInstantFeedback) {
            setFlash(isCorrect ? 'correct' : 'incorrect');
            setFeedback(isCorrect ? "Correct! Great job!" : `Not quite. The correct answer is: ${question.answer}`);
            setTimeout(() => setFlash(null), 800);
        } else {
            if (currentQuestionIndex < test.questions.length - 1) setTimeout(goToNext, 300);
        }
        saveProgress(false);
      };

      const navigateToQuestion = (idx) => { if (idx >= 0 && idx < test.questions.length) { commitElapsed(); setFeedback(null); setHint(null); setShowExplanation(false); setLastAnswerResult(null); setCurrentQuestionIndex(idx); saveProgress(false, idx); } };
      const goToNext = () => navigateToQuestion(currentQuestionIndex + 1);
      
      const handleFinish = () => {
        commitElapsed();
        if (testId === 'mistakes-test') {
          saveProgress(true);
          showNotification({ message: `Mistakes reviewed! Great work.`, type: "success" });
          setView('dashboard');
        } else {
          saveProgress(true);
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          setView('results');
        }
      };

      const fetchHint = async () => { setHint("Try re-reading the question carefully and break it into steps."); };

      if (!test || (settings.shuffle && !shuffledOrder)) return <LoadingSpinner message="Loading Test..." />;
      const currentQ = test.questions[originalIndex];
      const isSubmitted = !!submittedAnswers[currentQuestionIndex];
      
      const labeled = extractLabeledOptionsFromPrompt(currentQ.question || '');
      const optionsFromData = Array.isArray(currentQ.options) ? currentQ.options.map(o => String(o ?? '').trim()).filter(Boolean) : null;
      const isLabeled = !optionsFromData && labeled && labeled.options.length >= 2;
      const implicitOr = !optionsFromData && !isLabeled ? tryParseTwoOptionsFromOr(currentQ.question || '') : null;
      const displayStem = isLabeled ? labeled.stem : (implicitOr ? implicitOr.stem : (currentQ.question || ''));
      const renderAsButtonsOptions = optionsFromData && optionsFromData.length >= 2 ? optionsFromData : (implicitOr ? implicitOr.options : null);
      const renderAsLabeled = isLabeled && labeled.options.map(o => String(o ?? '').trim()).filter(Boolean).length >= 2;

      const answeredSet = new Set(Object.keys(submittedAnswers).map(Number));

      return (
        <div className={`min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center transition-colors duration-300 ${flash ? `flash-${flash}` : ''}`}>
          <div className="bg-white border-2 border-slate-100 rounded-3xl shadow-xl p-6 sm:p-10 w-full max-w-4xl relative">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl sm:text-3xl font-bold text-sky-900 font-orbitron">{test.title}</h2>
              {streak > 2 && <span className="text-xl font-bold text-orange-500 animate-pulse">🔥 {streak} Streak!</span>}
              {timerEnabled && <div className={`text-xl font-orbitron px-4 py-2 rounded-xl font-bold border-2 ${timeLimitMs > 0 && displayTime < 300000 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>{timeLimitMs > 0 ? '⏱️ ' : ''}{formatTime(displayTime)}</div>}
            </div>
            
            <QuestionNavigator total={test.questions.length} current={currentQuestionIndex} answeredIndices={answeredSet} onNavigate={navigateToQuestion} />
            
            <div className="mb-6 bg-sky-50 rounded-2xl p-6 border border-sky-100 shadow-sm min-h-[8rem]">
              <p className="text-slate-500 font-bold mb-2 uppercase tracking-wide text-sm">Question {currentQuestionIndex + 1} of {test.questions.length}</p>
              <p className="text-2xl text-slate-800 whitespace-pre-wrap font-semibold leading-relaxed">{displayStem}</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

                <button key={i} onClick={() => handleAnswerSelect(opt)} disabled={isSubmitted} className={`p-5 rounded-2xl border-2 text-left text-xl font-bold transition-all min-h-[70px] ${userAnswers[originalIndex] === opt ? 'bg-sky-100 border-sky-500 text-sky-900 shadow-md transform scale-[1.02]' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300'} ${isSubmitted ? 'opacity-60 cursor-not-allowed' : ''}`}>
                  {opt}
                </button>
              )) : renderAsLabeled ? labeled.options.map((o, idx) => {
                if (!o) return null; const letter = String.fromCharCode(97 + idx); const checked = userAnswers[originalIndex] === letter;
                return (
                  <label key={letter} className={`p-5 rounded-2xl border-2 flex items-center gap-4 text-xl font-bold transition-all cursor-pointer min-h-[70px] ${checked ? 'bg-sky-100 border-sky-500 text-sky-900 shadow-md' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'} ${isSubmitted ? 'opacity-60 cursor-not-allowed' : ''}`}>
                    <input type="radio" name={`q-${originalIndex}`} disabled={isSubmitted} checked={checked} onChange={() => handleAnswerSelect(letter)} className="w-6 h-6 text-sky-600 focus:ring-sky-500 border-slate-300" />
                    <span className="uppercase text-sky-700">{letter})</span><span>{o}</span>
                  </label>
                );
              }) : (
                <textarea value={userAnswers[originalIndex] || ''} onChange={(e) => handleAnswerSelect(e.target.value)} disabled={isSubmitted} className="w-full col-span-2 p-5 text-xl font-bold border-2 border-slate-200 rounded-2xl focus:border-sky-500 outline-none resize-none bg-white" placeholder="Type your answer here..." rows="4" />
              )}
            </div>

            {!isSubmitted && !showInstantFeedback && (
              <div className="text-center my-6">
                <button onClick={() => handleSubmitAnswer()} disabled={!userAnswers[originalIndex]} className="bg-emerald-500 text-white font-bold py-3 px-10 rounded-xl hover:bg-emerald-400 disabled:opacity-50 text-xl shadow-lg">Submit Answer</button>
              </div>
            )}

            {showInstantFeedback && (
              <div className="my-4 text-center">
                {hint ? <div className="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-lg font-semibold">{hint}</div> : <button onClick={fetchHint} className="text-sky-600 font-bold hover:text-sky-800 text-lg">💡 Need a hint?</button>}
              </div>
            )}

            {feedback && <div className={`p-5 rounded-xl text-xl font-bold mb-6 text-center shadow-sm border ${feedback.includes('Correct') ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>{feedback}</div>}
            
            {lastAnswerResult && !lastAnswerResult.isCorrect && showInstantFeedback && !showExplanation && (
              <div className="text-center">
                <button onClick={() => setShowExplanation(true)} className="mt-2 px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-200 border border-slate-300">🤖 Explain my mistake</button>
              </div>
            )}
            {showExplanation && <AIExplanation question={lastAnswerResult.question} userAnswer={lastAnswerResult.userAnswer} correctAnswer={lastAnswerResult.question.answer} onClose={() => setShowExplanation(false)} />}

            <div className="flex justify-between items-center mt-10 pt-6 border-t-2 border-slate-100">
              <button onClick={() => { commitElapsed(); saveProgress(false); setView('dashboard'); }} className="text-slate-500 font-bold hover:text-slate-800 text-lg px-4 py-2 bg-slate-100 rounded-xl">Exit & Save</button>
              {currentQuestionIndex < test.questions.length - 1 ? (
                <button onClick={goToNext} disabled={!isSubmitted && showInstantFeedback} className="bg-sky-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-sky-500 disabled:opacity-50 text-xl shadow-md">Next Question &rarr;</button>
              ) : (
                <button onClick={handleFinish} disabled={!isSubmitted && showInstantFeedback} className="bg-purple-600 text-white font-bold py-3 px-10 rounded-xl hover:bg-purple-500 disabled:opacity-50 text-xl shadow-md">Finish Test 🏆</button>
              )}
            </div>
          </div>
        </div>
      );

            confirmText: "Reset", 
            onConfirm: () => {

                updateAllData({ allTests, userData: clean });
                showNotification({message: "Reset complete.", type: 'success'}); 
                setTimeout(() => window.location.reload(), 1000);
            }
        });
      };

      const handleDeleteTest = (testId) => {
        showModal({
            title: "Delete Test?",
            message: "Are you sure you want to permanently delete this test?",
            confirmText: "Delete",
            onConfirm: () => {
                const tests = allTests.filter(x => x.id !== testId);
                const newProgress = { ...userData.progress };
                delete newProgress[testId];
                updateAllData({ userData: { ...userData, progress: newProgress }, allTests: tests });
                showNotification({message:'Test Deleted', type:'success'});
            }
        });
      }

      // --- JSON IMPORT LOGIC ---
      const handleImportTestPacks = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const importedData = JSON.parse(e.target.result);
                const testsToImport = Array.isArray(importedData) ? importedData : [importedData];
                
                if (!testsToImport[0].id || !testsToImport[0].questions) {
                    throw new Error("Invalid test format.");
                }

                const newAllTests = [...allTests];
                let added = 0; let updated = 0;

                testsToImport.forEach(newTest => {
                    const existingIndex = newAllTests.findIndex(t => t.id === newTest.id);
                    if (existingIndex >= 0) {
                        newAllTests[existingIndex] = newTest;
                        updated++;
                    } else {
                        newAllTests.push(newTest);
                        added++;
                    }
                });

                updateAllData({ userData, allTests: newAllTests });
                showNotification({ message: `Success! Added ${added} new tests, updated ${updated}.`, type: 'success' });
            } catch (error) {
                showNotification({ message: `Import failed: ${error.message}`, type: 'error' });
            } finally {
                event.target.value = "";
            }
        };
        reader.readAsText(file);
      };

      return (
        <div className="p-8 min-h-screen max-w-5xl mx-auto">

              <div className="flex flex-wrap gap-4">
                  <input type="file" accept=".json" id="import-test-pack" className="hidden" onChange={handleImportTestPacks} />
                  <label htmlFor="import-test-pack" className="bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-indigo-500 cursor-pointer shadow-md transition text-lg inline-block">
                      📥 Import Test Packs (.json)
                  </label>
                  
                  <button onClick={handleResetAllData} className="bg-red-500 text-white font-bold py-3 px-6 rounded-xl hover:bg-red-400 text-lg">Reset All Player Data</button>
              </div>
          </div>
          
          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 shadow-md">
            <h2 className="text-2xl font-bold mb-4 text-sky-900">Manage Tests</h2>
            <div className="space-y-4">
              {allTests.map(t => (
                <div key={t.id} className="bg-slate-50 p-4 rounded-xl flex justify-between items-center border border-slate-200">
                  <div>
                      <h3 className="font-bold text-lg text-slate-800">{t.title}</h3>
                      <p className="text-slate-500">{t.subject} {t.level ? `• Level ${t.level}` : ''} • {t.questions.length} questions</p>
                  </div>
                  <button onClick={() => handleDeleteTest(t.id)} className="text-red-500 font-bold hover:text-red-700">Delete</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const PerformanceDashboardView = ({ setView, userData, allTests }) => {
      const chartRef = useRef(null); const chartInstanceRef = useRef(null);
      useEffect(() => {
        if (!chartRef.current || !window.Chart) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        
        const completed = Object.entries(userData.progress||{}).map(([id, p]) => { const t = allTests.find(x=>x.id===id); return (t && Object.keys(p.answers||{}).length === t.questions.length) ? {...t, score: p.score} : null; }).filter(Boolean);
        const maths = completed.filter(t=>t.subject==='Maths').map(t=>(t.score/t.questions.length)*100);

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line', data: { labels: Array.from({length: Math.max(maths.length, english.length)}, (_,i)=>`Test ${i+1}`), datasets: [ {label: 'Maths (%)', data: maths, borderColor: '#3b82f6'}, {label: 'English (%)', data: english, borderColor: '#ec4899'} ]}, options: { scales: { y: { beginAtZero: true, max: 100 } } }

          <div className="flex gap-4 mb-8">

    function App() {
      const [appData, setAppData] = useState(null);
      const [view, setView] = useState('loading');
      const [selectedTest, setSelectedTest] = useState(null);
      const [notification, setNotification] = useState({ show: false, message: '' });
      const [modal, setModal] = useState({ show: false });
      
      const isInitialized = useRef(false);

      const hideModal = () => setModal({ show: false });
      
      const showModalWrapper = ({ title, message, onConfirm, onCancel, confirmText, children }) => {
        setModal({ 
          show: true, 
          title, 
          message, 
          onConfirm: onConfirm ? () => { onConfirm(); hideModal(); } : null,
          onCancel: onCancel ? () => { onCancel(); hideModal(); } : hideModal,
          confirmText,
          children
        });
      };

      useEffect(() => {
        if (isInitialized.current) return;
        isInitialized.current = true;
        
        const savedData = localStorage.getItem('seagPortalData');
        let loadedData = savedData ? JSON.parse(savedData) : null;
        
        if (!loadedData) {
          loadedData = { 
            userData: { name: "Nicolas", avatar: '👨‍🚀', progress: {}, level: 1, xp: 0, totalAttempts: 0, achievements: {} }, 
            allTests: defaultTests 
          };
          safeSetLocalStorage('seagPortalData', JSON.stringify(loadedData));
        } else {
            const existingIds = loadedData.allTests.map(t => t.id);
            defaultTests.forEach(dt => { 
                if (!existingIds.includes(dt.id)) loadedData.allTests.push(dt); 
            });
            safeSetLocalStorage('seagPortalData', JSON.stringify(loadedData));
        }
        setAppData(loadedData);
        setView('dashboard');
      }, []);

      useEffect(() => {
        if (appData?.userData?.dyslexiaFriendly) {
            document.body.classList.add('dyslexia-friendly');
        } else {
            document.body.classList.remove('dyslexia-friendly');
        }
      }, [appData?.userData?.dyslexiaFriendly]);

      const updateUserData = useCallback((newUserData, options = {}) => {
        setAppData(prev => {
            const { event } = options || {};
            let mutable = { ...prev.userData, ...newUserData };
            
            if (event?.type === 'ANSWER_SUBMITTED') {
                mutable.totalAttempts = (mutable.totalAttempts || 0) + 1;
                const isCorrect = !!event.payload.correct;
                const prevWasIncorrect = !!mutable.lastAnswerWasIncorrect;
                mutable.lastAnswerWasIncorrect = !isCorrect;
                
                if (isCorrect) {
                    mutable.totalCorrectAnswers = (mutable.totalCorrectAnswers || 0) + 1;
                    mutable.currentStreak = (mutable.currentStreak || 0) + 1;
                    mutable.correctRunAfterWrong = prevWasIncorrect ? 1 : (mutable.correctRunAfterWrong || 0) + 1;
                    if (!event.payload.usedHint) mutable.noHintCorrectCount = (mutable.noHintCorrectCount || 0) + 1;
                    
                    const tags = Array.isArray(event.payload.tags) ? event.payload.tags : [];
                    mutable.correctAnswersByTag = mutable.correctAnswersByTag || {};
                    tags.forEach(t => mutable.correctAnswersByTag[t] = (mutable.correctAnswersByTag[t] || 0) + 1);
                } else {
                    mutable.currentStreak = 0; 
                    mutable.correctRunAfterWrong = 0;
                }
            }
            
            if (event?.type === 'PACK_COMPLETED' && event.payload?.mode === 'Test') {
                let xpToAdd = event.payload.score;
                mutable.xp = (mutable.xp || 0) + xpToAdd;
                let thresh = (mutable.level || 1) * 100;
                while (mutable.xp >= thresh) { 
                    mutable.xp -= thresh; 
                    mutable.level = (mutable.level || 1) + 1; 
                    thresh = mutable.level * 100; 
                }
            }
            
            const { updated } = unlockAchievements(mutable, event);
            const newData = { ...prev, userData: updated };
            safeSetLocalStorage('seagPortalData', JSON.stringify(newData));
            return newData;
        });
      }, []);

      const updateAllData = useCallback((newData) => {
          setAppData(newData); 
          safeSetLocalStorage('seagPortalData', JSON.stringify(newData));
      }, []);

      if (!appData) return <LoadingSpinner message="Loading Portal System..." />;

      return (
        <div>
          {view === 'loading' && <LoadingSpinner message="Loading Portal System..." />}
          {view === 'dashboard' && <Dashboard userData={appData.userData} setView={setView} setSelectedTest={setSelectedTest} allTests={appData.allTests} showModal={showModalWrapper} hideModal={hideModal} updateAllData={updateAllData} appData={appData} showNotification={setNotification} />}
          {view === 'quiz' && <QuizView userData={appData.userData} testDetails={selectedTest} setView={setView} allTests={appData.allTests} updateUserData={updateUserData} showNotification={setNotification} showModal={showModalWrapper} />}
          {view === 'results' && <ResultsView userData={appData.userData} setView={setView} testDetails={selectedTest} allTests={appData.allTests} />}
          {view === 'admin' && <AdminView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} showModal={showModalWrapper} showNotification={setNotification} />}
          {view === 'createTest' && <CreateTestView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} showNotification={setNotification} />}
          {view === 'performance' && <PerformanceDashboardView userData={appData.userData} setView={setView} allTests={appData.allTests} />}
          {view === 'settings' && <SettingsView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={setNotification} />}
          {view === 'achievements' && <AchievementsView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={setNotification} />}
          
          {notification.show && <Notification message={notification.message} type={notification.type} onDismiss={() => setNotification({ show: false })} />}
          {modal.show && <Modal title={modal.title} message={modal.message} onConfirm={modal.onConfirm} onCancel={modal.onCancel} confirmText={modal.confirmText}>{modal.children}</Modal>}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
