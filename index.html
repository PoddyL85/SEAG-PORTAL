    // --- Time formatting ---
    // BUG FIX: Time formatting supports countdown display perfectly
    function formatTime(ms) {
      if (ms < 0) ms = 0;
      const sec = Math.floor(ms / 1000);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }

    // --- Question Parsing Helpers ---
    function extractLabeledOptionsFromPrompt(prompt) {
      if (!prompt) return null;
      const s = String(prompt).replace(/\s+/g, ' ').trim();
      const firstA = /(?:^|[\s(])[Aa][\)\.\:]\s*/.exec(s);
      if (!firstA) return null;
      const stem = s.slice(0, firstA.index).trim();
      const rest = s.slice(firstA.index);
      const labelRe = /(?:^|[\s(])([A-Ea-e])[\)\.\:]\s*/g;
      let match;
      const spans = [];
      while ((match = labelRe.exec(rest)) !== null) {
        spans.push({
          label: match[1].toLowerCase(),
          labelStart: match.index,
          textStart: labelRe.lastIndex
        });
      }
      if (spans.length < 2) return null;
      const options = [];
      for (let i = 0; i < spans.length; i++) {
        const start = spans[i].textStart;
        const end = (i + 1 < spans.length) ? spans[i + 1].labelStart : rest.length;
        options.push(rest.slice(start, end).trim());
      }
      const labels = spans.map(s => s.label);
      if (options.filter(Boolean).length >= 2) {
        return { stem: stem || s, options, labels };
      }
      return null;
    }

    function tryParseTwoOptionsFromOr(prompt) {
      if (!prompt) return null;
      const s = String(prompt).replace(/\s+/g, ' ').trim();
      if (/(?:^|[\s(])[A-Da-d][\)\.\:]\s/.test(s)) return null;
      const parts = s.split(/\s+or\s+/i);
      if (parts.length !== 2) return null;
      const colonIdx = s.lastIndexOf(':');
      const stem = colonIdx >= 0 ? s.slice(0, colonIdx + 1).trim() : s;
      const leftSource = parts[0];
      const left = colonIdx >= 0 ? leftSource.slice(leftSource.lastIndexOf(':') + 1).trim() : leftSource.trim();
      const right = parts[1].trim();
      if (left && left.length >= 2 && right && right.length >= 2) {
        return { stem, options: [left, right] };
      }
      return null;
    }

    const unicodeFractionMap = new Map([
      ['½', '1/2'], ['⅓', '1/3'], ['⅔', '2/3'],
      ['¼', '1/4'], ['¾', '3/4'], ['⅕', '1/5'],
      ['⅖', '2/5'], ['⅗', '3/5'], ['⅘', '4/5'],
      ['⅙', '1/6'], ['⅚', '5/6'], ['⅛', '1/8'],
      ['⅜', '3/8'], ['⅝', '5/8'], ['⅞', '7/8']
    ]);
    function replaceUnicodeFractions(s) {
      let out = s;
      unicodeFractionMap.forEach((ascii, uni) => { out = out.replaceAll(uni, ascii); });
      return out;
    }
    function normalizeDecimalSyntax(s) {
      let t = s.trim();
      if (/\d/.test(t) && (t.match(/,/g)?.length === 1) && !t.includes('.')) {
        t = t.replace(',', '.');
      }
      t = t.replace(/(^|\s)\.(\d)/g, '$10.$2');
      return t;
    }
    function parseAsciiFraction(frac) {
      const m = frac.trim().match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);
      if (!m) return null;
      const num = parseFloat(m[1]);
      const den = parseFloat(m[2]);
      if (!isFinite(num) || !isFinite(den) || den === 0) return null;
      return num / den;
    }
    function parseMixedFraction(s) {
      const m = s.trim().match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
      if (!m) return null;
      const w = parseFloat(m[1]);
      const n = parseFloat(m[2]);
      const d = parseFloat(m[3]);
      if (!isFinite(w) || !isFinite(n) || !isFinite(d) || d === 0) return null;
      const sign = w < 0 ? -1 : 1;
      return w + sign * (n / d);
    }
    function detectPercentUnit(raw) {
      const s = raw.toLowerCase();
      return /%|\bpercent\b|\bper\s*cent\b/.test(s);
    }
    function stripPercentText(raw) {
      return raw.replace(/%|\bpercent\b|\bper\s*cent\b/gi, '');
    }
    function unitStripForNumeric(raw) {
      if (raw == null) return '';
      return String(raw)
        .replace(/[£$€]/g, '')
        .replace(/\b(cm2|cm²|m2|m²|cm|mm|m|kg|g|km|miles?|meters?|metres?|meter|metre|deg|degrees|°|hrs?|hours?|mins?|minutes?)\b/gi, '')
        .trim();
    }
    function normalizeNumericLike(raw) {
      if (raw == null) return { ok: false };
      let s = String(raw).trim();
      s = replaceUnicodeFractions(s);
      const hadPercent = detectPercentUnit(s);
      if (hadPercent) s = stripPercentText(s);
      s = normalizeDecimalSyntax(s);
      let val = parseMixedFraction(s);
      if (val == null) {
        const fracVal = parseAsciiFraction(s);
        if (fracVal != null) val = fracVal;
      }
      if (val == null) {
        const num = parseFloat(s);
        if (!Number.isNaN(num) && isFinite(num)) val = num;
      }
      if (val == null) return { ok: false };
      return { ok: true, value: val, isPercent: hadPercent };
    }
    function compareNumericAnswers(studentRaw, correctRaw, options = {}) {
      const {
        toleranceAbs = 1e-4,
        toleranceRel = 1e-3,
        percentEquivalence = 'both'
      } = options;
      const s = normalizeNumericLike(studentRaw);
      const c = normalizeNumericLike(correctRaw);
      if (!s.ok || !c.ok) return { equal: false, reason: 'non-numeric' };
      const candidates = [];
      if (s.isPercent === c.isPercent) {
        candidates.push([s.value, c.value]);
      }
      const allowStudentToPercent = percentEquivalence === 'both' || percentEquivalence === 'studentToPercent';
      const allowCorrectToPercent = percentEquivalence === 'both' || percentEquivalence === 'correctToPercent';
      if (allowStudentToPercent && c.isPercent && !s.isPercent) {
        candidates.push([s.value * 100, c.value]);
      }
      if (allowCorrectToPercent && s.isPercent && !c.isPercent) {
        candidates.push([s.value, c.value * 100]);
      }
      for (const [sv, cv] of candidates) {
        const diff = Math.abs(sv - cv);
        const rel = Math.abs(diff / (Math.abs(cv) > 0 ? Math.abs(cv) : 1));
        if (diff <= toleranceAbs || rel <= toleranceRel) {
          return { equal: true };
        }
      }
      return { equal: false };
    }
    function stripOuterQuotesAndEndPunct(s) {
      return s
        .replace(/^[“”"']+|[“”"']+$/g, '') 
        .replace(/[.?!]+$/g, '')           
        .trim();
    }
    function stripLeadingArticles(s) {
      return s.replace(/^(?:an?|the)\s+/i, '').trim();
    }
    const normalizeAnswer = (answer, tags = []) => {
      if (answer == null) return '';
      if (typeof answer !== 'string') answer = String(answer);
      let s = answer.toLowerCase().trim();
      s = s.replace(/\s+/g, ' ');
      s = s.replace(/\b(a|an|the)\b/g, '').trim();
      return s;
    };
    
    const isAnswerCorrect = (question, userAnswer) => {
      if (!question) return false;
      const correctAnswer = question.answer;
      const tags = question.tags || [];
      const qText = question.question || '';
      
      const labeled = extractLabeledOptionsFromPrompt(qText);
      if (labeled && labeled.options?.length >= 2) {
        const s = String(userAnswer ?? '').trim().toLowerCase();
        const c = String(correctAnswer ?? '').trim().toLowerCase();
        if (/^[a-z]$/.test(c)) return s === c;
        if (/^[a-z]$/.test(s)) {
          const idx = s.charCodeAt(0) - 97;
          const chosen = labeled.options[idx]?.trim().toLowerCase();
          return chosen && chosen === c;
        }
        return s === c;
      }
      
      const numericish = tags.includes('geometry') || tags.includes('percentages') || tags.includes('fractions');
      if (numericish) {
        const sVal = unitStripForNumeric(userAnswer);
        const cVal = unitStripForNumeric(correctAnswer);
        const res = compareNumericAnswers(sVal, cVal, {
          toleranceAbs: 1e-4,
          toleranceRel: 1e-3,
          percentEquivalence: 'both'
        });
        if (res.equal) return true;
      }
      
      {
        const sNorm = normalizeNumericLike(unitStripForNumeric(userAnswer));
        const cNorm = normalizeNumericLike(unitStripForNumeric(correctAnswer));
        if (sNorm.ok && cNorm.ok) {
          const res2 = compareNumericAnswers(sNorm.value, cNorm.value, {
            toleranceAbs: 1e-4,
            toleranceRel: 1e-3,
            percentEquivalence: 'both'
          });
          if (res2.equal) return true;
        }
      }
      
      const normalizedCorrect = normalizeAnswer(correctAnswer, tags);
      const normalizedUser = normalizeAnswer(userAnswer, tags);
      if (normalizedCorrect === normalizedUser) return true;
      const looseCorrect = stripLeadingArticles(stripOuterQuotesAndEndPunct(normalizedCorrect));
      const looseUser = stripLeadingArticles(stripOuterQuotesAndEndPunct(normalizedUser));
      if (looseCorrect === looseUser) return true;
      return false;
    };

    // --- Sub-Components ---
    const AIExplanation = ({ question, userAnswer, correctAnswer, onClose }) => {
      const [explanation, setExplanation] = useState('');
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        const generateExplanation = async () => {
          setLoading(true);
          try {
            const hasOptions = Array.isArray(question.options) && question.options.length > 0;
            const optionsText = hasOptions ? `Options: ${question.options.map((opt, i) => `${i + 1}) ${opt}`).join(' | ')}` : '';
            const prompt = `You are a kind, concise tutor for a 10-year-old student. Explain clearly why the user's answer is not correct and why the correct answer is right. Keep it short and encouraging.\nQuestion: ${question.question}\n${optionsText ? optionsText + '\n' : ''}User's answer: ${String(userAnswer)}\nCorrect answer: ${String(correctAnswer)}`;
            
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }] };
            const response = await fetch('/.netlify/functions/gemini-proxy', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error("API Error");
            const data = await response.json();
            const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            setExplanation(aiText.trim() || `Don't worry about getting it wrong! The correct answer is ${correctAnswer}. Think about what makes this answer right.`);
          } catch (err) {
            setExplanation(`Don't worry about getting it wrong - that's how we learn! The correct answer is ${correctAnswer}.`);
          } finally {
            setLoading(false);
          }
        };
        generateExplanation();
      }, [question, userAnswer, correctAnswer]);

      if (loading) {
        return (
          <div className="mt-3 p-4 bg-sky-50 border border-sky-200 rounded-xl">
            <div className="flex items-center gap-2">
              <div className="animate-spin w-4 h-4 border-2 border-sky-600 border-t-transparent rounded-full"></div>
              <span className="text-sky-800 font-bold">Getting explanation...</span>
            </div>
          </div>
        );
      }
      return (
        <div className="mt-4 p-5 bg-sky-50 border border-sky-200 rounded-xl shadow-sm">
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1">
              <div className="flex items-center gap-2 mb-2">
                <span className="text-xl">🤖</span>
                <span className="font-bold text-sky-900">Why was this wrong?</span>
              </div>
              <p className="text-sky-800 text-lg leading-relaxed font-semibold">{explanation}</p>
            </div>
            <button onClick={onClose} className="text-sky-600 font-bold hover:text-sky-800 text-xl">✕</button>
          </div>
        </div>
      );
    };

    const LoadingSpinner = ({ message }) => (
      <div className="flex flex-col justify-center items-center h-screen bg-sky-50">
        <div className="animate-spin rounded-full h-24 w-24 border-t-4 border-b-4 border-sky-500 mb-4"></div>
        <p className="text-2xl text-sky-800 font-orbitron font-bold">{message}</p>
      </div>
    );

    const Notification = ({ message, type, onDismiss }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          if (typeof onDismiss === 'function') onDismiss();
        }, 3000);
        return () => clearTimeout(timer);
      }, [onDismiss]);
      const bgColor = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
      return (
        <div className={`notification-bar p-5 rounded-xl text-white font-bold shadow-xl text-lg ${bgColor}`}>
          {message}
        </div>
      );
    };

    const Modal = ({ title, message, onConfirm, onCancel, confirmText, children }) => {
      const dialogRef = useRef(null);
      useEffect(() => {
        const dialog = dialogRef.current;
        const focusable = dialog?.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!focusable?.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        first.focus();
        function onKeyDown(e) {
          if (e.key === 'Escape') {
            e.stopPropagation();
            if (onCancel) onCancel();
          }
          if (e.key !== 'Tab') return;
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      }, [onCancel]);
      return (
        <div className="modal-backdrop">
          <div ref={dialogRef} className="bg-white border-4 border-sky-100 rounded-3xl shadow-2xl p-10 w-full max-w-lg text-center">
            <h2 className="text-3xl font-bold font-orbitron text-sky-900 mb-4">{title}</h2>
            {message && <p className="text-slate-600 mb-8 font-semibold text-lg">{message}</p>}
            {children}
            <div className="flex justify-center gap-4 mt-8">
              {onCancel && <button onClick={onCancel} className="bg-slate-200 text-slate-800 font-bold py-3 px-8 rounded-xl hover:bg-slate-300 transition">Cancel</button>}
              {onConfirm && !!confirmText && (
                <button onClick={onConfirm} className={`font-bold py-3 px-8 rounded-xl shadow-md transition ${confirmText === 'Delete' || confirmText === 'Reset Everything' ? 'bg-red-500 hover:bg-red-400 text-white' : 'bg-emerald-500 hover:bg-emerald-400 text-white'}`}>
                  {confirmText}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    const CustomModeSelector = ({ onStart }) => {
        const [useTimer, setUseTimer] = useState(true);
        const [useHints, setUseHints] = useState(false);
        const [shuffle, setShuffle] = useState(false);
        return (
            <div className="text-left p-6 bg-slate-50 rounded-2xl mt-4 border border-slate-200 shadow-inner">
                <h4 className="font-bold text-xl text-center mb-6 text-sky-900">Custom Settings</h4>
                <div className="space-y-5">
                    <div className="flex items-center justify-between">
                        <label className="font-bold text-lg text-slate-700">Enable Timer</label>
                        <input type="checkbox" checked={useTimer} onChange={() => setUseTimer(!useTimer)} className="w-7 h-7 rounded text-sky-500 bg-white border-slate-300" />
                    </div>
                    <div className="flex items-center justify-between">
                        <label className="font-bold text-lg text-slate-700">Enable Hints & Feedback</label>
                        <input type="checkbox" checked={useHints} onChange={() => setUseHints(!useHints)} className="w-7 h-7 rounded text-sky-500 bg-white border-slate-300" />
                    </div>
                    <div className="flex items-center justify-between">
                        <label className="font-bold text-lg text-slate-700">Shuffle Questions</label>
                        <input type="checkbox" checked={shuffle} onChange={() => setShuffle(!shuffle)} className="w-7 h-7 rounded text-sky-500 bg-white border-slate-300" />
                    </div>
                </div>
                <button onClick={() => onStart({ mode: 'Custom', timer: useTimer, hints: useHints, shuffle: shuffle })} className="w-full text-center py-4 mt-8 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold text-white text-xl shadow-lg transition">
                    Start Custom Test
                </button>
            </div>
        );
    }

    const QuestionNavigator = ({ total, current, answeredIndices, onNavigate }) => {
        return (
            <div className="flex flex-wrap gap-2 my-6">
                {Array.from({ length: total }, (_, i) => {
                    const isAnswered = answeredIndices.has(i);
                    const isCurrent = i === current;
                    let buttonClass = 'bg-white text-slate-600 border-2 border-slate-200 hover:bg-slate-50';
                    if (isCurrent) {
                        buttonClass = 'bg-sky-500 text-white shadow-md transform scale-110 border-sky-600';
                    } else if (isAnswered) {
                        buttonClass = 'bg-sky-100 text-sky-800 border-sky-300';
                    }
                    return (
                        <button key={i} onClick={() => onNavigate(i)}
                          aria-label={`Go to question ${i + 1}${isAnswered ? ' (answered)' : ''}`}
                          className={`w-12 h-12 rounded-xl font-bold text-lg transition-all ${buttonClass}`}>
                          {i + 1}
                        </button>
                    );
                })}
            </div>
        );
    }

    // --- Main Views ---
    const Dashboard = ({ userData, setView, setSelectedTest, allTests, showModal, hideModal, updateAllData, appData, showNotification }) => {
      const xpForNextLevel = (userData.level || 1) * 100;
      const xpPercent = ((userData.xp || 0) / xpForNextLevel) * 100;

      const handleSelectTest = (testId) => {
        const test = allTests.find(t => t.id === testId);
        const progress = userData.progress?.[testId];
        const answered = progress ? Object.keys(progress.answers || {}).length : 0;
        if (progress && answered > 0 && answered < test.questions.length) {
          setSelectedTest({ id: testId, settings: progress.settings || { mode: 'Practice', shuffle: false } });
          setView('quiz');
          return;
        }
        showModal({
          title: "Choose Your Mode",
          children: (
            <div className="space-y-4">
              <button onClick={() => { setSelectedTest({ id: testId, settings: { mode: 'Practice', shuffle: false } }); setView('quiz'); hideModal(); }} className="w-full text-left p-6 bg-sky-100 hover:bg-sky-200 rounded-2xl border-2 border-sky-300 transition">
                <h3 className="font-bold text-sky-900 text-xl">Practice Mode</h3>
                <p className="font-semibold text-sky-700 mt-2 text-lg">No timer, hints enabled, and live feedback on your answers.</p>
              </button>
              <button onClick={() => { setSelectedTest({ id: testId, settings: { mode: 'Test', shuffle: false } }); setView('quiz'); hideModal(); }} className="w-full text-left p-6 bg-amber-100 hover:bg-amber-200 rounded-2xl border-2 border-amber-300 transition">
                <h3 className="font-bold text-amber-900 text-xl">Test Mode</h3>
                <p className="font-semibold text-amber-700 mt-2 text-lg">A 45-minute countdown runs, hints are disabled, and results are shown only at the end.</p>
              </button>
              <CustomModeSelector onStart={(settings) => {
                  setSelectedTest({ id: testId, settings });
                  setView('quiz');
                  hideModal();
              }} />
            </div>
          ),
          onCancel: hideModal,
          confirmText: null
        });
      };

      const handleAdminAccess = () => {
          const pin = prompt("Please enter Parent PIN to access the Admin Panel:");
          if (pin === "1234") {
              setView('admin');
          } else if (pin !== null) {
              alert("Incorrect PIN.");
          }
      };

      const handleDailyChallenge = () => {
        let allQuestions = allTests.flatMap(test => test.questions);
        const dailyQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 5);
        const challengeTest = {
          id: 'daily-challenge',
          title: 'Daily Challenge',
          subject: 'Mixed',
          questions: dailyQuestions
        };
        updateAllData({ ...appData, allTests: [...allTests.filter(t => t.id !== 'daily-challenge'), challengeTest] });
        setSelectedTest({ id: 'daily-challenge', settings: { mode: 'Practice', shuffle: true } });
        setView('quiz');
      };

      const handlePracticeMistakes = () => {
        const incorrectQuestions = [];
        const seenQuestions = new Set();
        Object.entries(userData.progress || {}).forEach(([testId, progressData]) => {
          if (testId === 'mistakes-test') return;
          const test = allTests.find(t => t.id === testId);
          if (!test) return;
          Object.entries(progressData.answers || {}).forEach(([qIndexStr, userAnswer]) => {
            const qIndex = Number(qIndexStr);
            if (Number.isNaN(qIndex) || qIndex < 0 || qIndex >= test.questions.length) return;
            const question = test.questions[qIndex];
            if (!question) return;
            if (!isAnswerCorrect(question, userAnswer) && !seenQuestions.has(question.question)) {
              incorrectQuestions.push({ 
                ...question, 
                originalTestId: testId, 
                originalQIndex: qIndex 
              });
              seenQuestions.add(question.question);
            }
          });
        });
        if (incorrectQuestions.length === 0) {
          showNotification({message: "No mistakes to practice. Great job!", type: "success"});
          return;
        }
        const mistakesTest = {
          id: 'mistakes-test',
          title: 'Practice Your Mistakes',
          subject: 'Mixed',
          questions: incorrectQuestions
        };
        updateAllData({ ...appData, allTests: [...allTests.filter(t => t.id !== 'mistakes-test'), mistakesTest] });
        setSelectedTest({ id: 'mistakes-test', settings: { mode: 'Practice', shuffle: true } });
        setView('quiz');
      };

      const hasMistakes = Object.values(userData.progress || {}).some(p => (p.score || 0) < Object.keys(p.answers || {}).length);

      return (
        <div className="p-4 sm:p-10 min-h-screen max-w-7xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
            <h1 className="text-4xl sm:text-5xl font-bold font-orbitron text-sky-900 flex items-center">
              <span className="text-6xl mr-4">{userData.avatar || '👨‍🚀'}</span>
              Welcome, {userData.name}! 
            </h1>
            <div className="flex gap-4">
              <button onClick={() => setView('settings')} className="bg-white border-2 border-slate-200 text-slate-600 font-bold py-3 px-6 rounded-xl shadow-sm hover:bg-slate-50 transition text-lg">Profile</button>
              <button onClick={() => setView('achievements')} className="bg-yellow-400 text-yellow-900 font-bold py-3 px-6 rounded-xl shadow-sm hover:bg-yellow-300 transition text-lg">Achievements</button>
              <button onClick={handleAdminAccess} className="bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl shadow-sm hover:bg-slate-300 transition text-lg">⚙️ Parents</button>
            </div>
          </div>
          
          <div className="bg-white border-2 border-sky-100 rounded-3xl p-8 mb-12 shadow-lg relative overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-sky-100 rounded-full opacity-50 transform translate-x-1/2 -translate-y-1/2"></div>
            <div className="relative z-10">
              <div className="flex justify-between items-center mb-4 font-orbitron">
                <span className="font-bold text-sky-800 text-3xl">Level {userData.level || 1} {userData.title && <span className="ml-4 text-xl bg-amber-100 text-amber-800 px-5 py-2 rounded-full font-sans">{userData.title}</span>}</span>
                <span className="text-xl text-slate-500 font-bold">{userData.xp || 0} / {xpForNextLevel} XP</span>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-8 border-2 border-slate-200 overflow-hidden">
                <div className="bg-gradient-to-r from-sky-400 to-indigo-500 h-full transition-all duration-1000 ease-out" style={{ width: `${Math.min(100, Math.max(0, xpPercent))}%` }}></div>
              </div>
            </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-10 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition">
              <div className="flex justify-between items-start mb-4">
                <h2 className="text-4xl font-bold font-orbitron">Daily Challenge</h2>
                <div className="text-center bg-white/20 px-4 py-2 rounded-xl">
                  <div className="text-3xl mb-1">🔥</div>
                  <div className="font-bold">{userData.dailyChallengeStreak || 0} Day Streak</div>
                </div>
              </div>
              <p className="text-xl opacity-90 mb-8 font-semibold">A quick 5-question warmup to get your brain ready!</p>
              {userData.dailyChallenge?.completedToday ? (
                <div className="w-full bg-white/20 text-center font-bold py-4 rounded-xl text-xl">Challenge Complete! See you tomorrow.</div>
              ) : (
                <button onClick={handleDailyChallenge} className="w-full bg-white text-purple-700 font-bold py-4 px-6 rounded-xl hover:bg-slate-100 shadow-lg text-xl transition">Start Daily Challenge</button>
              )}
            </div>
            
            <div className="bg-gradient-to-br from-amber-400 to-orange-500 rounded-3xl p-10 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition">
              <h2 className="text-4xl font-bold font-orbitron mb-4">Review Mistakes</h2>
              <p className="text-xl opacity-90 mb-8 font-semibold">Tackle the questions you've gotten wrong before.</p>
              <button onClick={handlePracticeMistakes} disabled={!hasMistakes} className="w-full bg-white text-orange-600 font-bold py-4 px-6 rounded-xl hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg text-xl transition">
                {hasMistakes ? 'Practice Your Mistakes' : 'No Mistakes Found! 🎉'}
              </button>
            </div>
          </div>
          
          <h2 className="text-3xl font-bold font-orbitron text-sky-900 mb-8">Available Practice Papers</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {allTests.filter(t => !t.isBoss).map(test => {
              const progress = userData.progress?.[test.id];
              const answeredCount = progress ? Object.keys(progress.answers || {}).length : 0;
              const totalQs = test.questions.length;
              const progressPercent = totalQs > 0 ? (answeredCount / totalQs) * 100 : 0;
              
              return (
                <div key={test.id} className="bg-white border-2 border-slate-100 rounded-3xl p-8 shadow-md hover:shadow-xl hover:border-sky-300 transition flex flex-col justify-between">
                  <div>
                    <h3 className="text-2xl font-bold font-orbitron text-sky-900 mb-3">{test.title}</h3>
                    <p className="text-lg text-slate-500 font-bold mb-6">{test.subject} • {totalQs} Questions</p>
                    <div className="w-full bg-slate-100 rounded-full h-4 mb-3 overflow-hidden border border-slate-200">
                      <div className="bg-emerald-400 h-full transition-all" style={{ width: `${progressPercent}%` }}></div>
                    </div>
                    <p className="text-sm font-bold text-slate-400 mb-8">{answeredCount} / {totalQs} answered</p>
                  </div>
                  <button onClick={() => handleSelectTest(test.id)} className="w-full bg-sky-600 text-white font-bold py-4 px-6 rounded-xl hover:bg-sky-500 shadow-md text-xl transition">
                    {answeredCount > 0 && answeredCount < totalQs ? 'Continue Test' : 'Start Test'}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const QuizView = ({ userData, testDetails, setView, allTests, updateUserData, showNotification, showModal }) => {
      const { id: testId, settings } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const existingProgress = userData?.progress?.[testId] || {};
      
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(existingProgress?.lastQuestionIndex || 0);
      const [userAnswers, setUserAnswers] = useState(existingProgress?.answers || {});
      const [submittedAnswers, setSubmittedAnswers] = useState(existingProgress?.submittedAnswers || {});
      const [streak, setStreak] = useState(existingProgress?.streak || 0);
      const [hint, setHint] = useState(null);
      const [isHintLoading, setIsHintLoading] = useState(false);
      const [showExplanation, setShowExplanation] = useState(false);
      const [lastAnswerResult, setLastAnswerResult] = useState(null);
      const [shuffledOrder, setShuffledOrder] = useState(null);

      // BUG FIX: Timer logic hoisted and updated
      const timerEnabled = settings.mode === 'Test' || (settings.mode === 'Custom' && settings.timer);
      const timeLimitMs = settings.mode === 'Test' ? 45 * 60 * 1000 : 0; 
      
      const [questionStartTime, setQuestionStartTime] = useState(Date.now());
      const [accumulatedElapsedMs, setAccumulatedElapsedMs] = useState(existingProgress?.accumulatedElapsedMs || 0);
      const [displayTime, setDisplayTime] = useState(timeLimitMs > 0 ? timeLimitMs : 0);

      const [flash, setFlash] = useState(null);
      const [feedback, setFeedback] = useState(null);

      useEffect(() => {
        if (settings.shuffle && !existingProgress.shuffledOrder) {
            const indices = Array.from(test.questions.keys());
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            setShuffledOrder(indices);
            const newProgress = { ...userData.progress, [testId]: { ...existingProgress, shuffledOrder: indices, settings } };
            updateUserData({ ...userData, progress: newProgress }, { event: { type: 'NO_OP' } });
        } else if (existingProgress.shuffledOrder) {
            setShuffledOrder(existingProgress.shuffledOrder);
        }
      }, []);

      useEffect(() => {
        if (!timerEnabled) return;
        const interval = setInterval(() => {
            const now = Date.now();
            const elapsedThisSession = now - questionStartTime;
            const totalElapsed = accumulatedElapsedMs + elapsedThisSession;
            
            if (timeLimitMs > 0) {
                setDisplayTime(Math.max(0, timeLimitMs - totalElapsed));
            } else {
                setDisplayTime(totalElapsed);
            }
        }, 1000);
        return () => clearInterval(interval);
      }, [timerEnabled, accumulatedElapsedMs, questionStartTime, timeLimitMs]);

      const commitElapsed = () => {
        const now = Date.now();
        const delta = now - questionStartTime;
        setAccumulatedElapsedMs(prev => prev + delta);
        setQuestionStartTime(now);
        return delta;
      };

      const calculateScore = useCallback(() => {
        return Object.entries(userAnswers).reduce((acc, [index, userAnswer]) => {
          if (isAnswerCorrect(test.questions[index], userAnswer)) return acc + 1;
          return acc;
        }, 0);
      }, [userAnswers, test.questions]);

      const saveProgress = useCallback((isFinished = false, overrideIndex) => {
        const score = calculateScore();
        const lastOriginalIndex = shuffledOrder ? shuffledOrder[test.questions.length - 1] : (test.questions.length - 1);
        
        const newProgressEntry = { 
          answers: userAnswers, 
          lastQuestionIndex: (typeof overrideIndex === 'number') ? overrideIndex : currentQuestionIndex, 
          score: score, 
          accumulatedElapsedMs,
          questionStartTime,
          streak: streak, 
          settings: settings,
          submittedAnswers,
          ...(shuffledOrder && { shuffledOrder }),
          ...(isFinished ? { completedAt: Date.now() } : {})
        };

        const newUserData = { ...userData, progress: { ...userData.progress, [testId]: newProgressEntry } };
        
        if (isFinished) {
            const postTestContext = {
                finishedTestId: testId,
                totalQuestions: test.questions.length,
                score,
                mode: settings.mode,
                initialTotalTime: timeLimitMs,
                timeLeft: displayTime,
                testHasGeometry: test.questions.some(q => (q.tags || []).includes('geometry')),
                lastQuestionCorrect: isAnswerCorrect(test.questions[lastOriginalIndex], userAnswers[lastOriginalIndex]),
                isFullPractice: testId.startsWith('full-test') || testId.startsWith('seag'),
                isDailyChallenge: testId === 'daily-challenge',
                finishedAt: Date.now()
            };
            updateUserData(newUserData, { event: { type: 'PACK_COMPLETED', payload: postTestContext } });
        } else {
            updateUserData(newUserData, { event: { type: 'NO_OP' } });
        }
      }, [userData, testId, userAnswers, currentQuestionIndex, calculateScore, accumulatedElapsedMs, questionStartTime, streak, settings, submittedAnswers, shuffledOrder, test, updateUserData, timeLimitMs, displayTime]);

      const originalIndex = shuffledOrder ? shuffledOrder[currentQuestionIndex] : currentQuestionIndex;
      const showInstantFeedback = settings.mode === 'Practice' || (settings.mode === 'Custom' && settings.hints);

      const handleAnswerSelect = (answer) => {
        if (submittedAnswers[currentQuestionIndex]) return;
        const newAnswers = { ...userAnswers, [originalIndex]: answer };
        setUserAnswers(newAnswers);
        if (showInstantFeedback && !submittedAnswers[currentQuestionIndex]) {
          setTimeout(() => handleSubmitAnswer(answer), 0);
        }
      };

      const handleSubmitAnswer = (ansOverride) => {
        const answer = ansOverride || userAnswers[originalIndex];
        if (!answer) return;
        
        setSubmittedAnswers(prev => ({ ...prev, [currentQuestionIndex]: true }));
        const deltaMs = commitElapsed();
        
        const question = test.questions[originalIndex];
        const isCorrect = isAnswerCorrect(question, answer);
        
        setLastAnswerResult({ isCorrect, userAnswer: answer, question });
        
        const event = {
            type: 'ANSWER_SUBMITTED',
            payload: {
                correct: isCorrect,
                timeToAnswer: deltaMs / 1000,
                usedHint: !!hint,
                tags: question.tags || [],
                wasReviewed: testId === 'mistakes-test',
                mode: settings.mode,
                testId
            }
        };
        
        updateUserData(userData, { event });
        
        const newStreak = isCorrect ? streak + 1 : 0;
        setStreak(newStreak);
        
        if (showInstantFeedback) {
            setFlash(isCorrect ? 'correct' : 'incorrect');
            setFeedback(isCorrect ? "Correct! Great job!" : `Not quite. The correct answer is: ${question.answer}`);
            setTimeout(() => setFlash(null), 800);
        } else {
            if (currentQuestionIndex < test.questions.length - 1) {
                setTimeout(goToNext, 300);
            }
        }
        saveProgress(false);
      };

      const navigateToQuestion = (index) => {
        if (index >= 0 && index < test.questions.length) {
            commitElapsed();
            setFeedback(null);
            setHint(null);
            setShowExplanation(false);
            setLastAnswerResult(null);
            setCurrentQuestionIndex(index);
            saveProgress(false, index);
        }
      };

      const goToNext = () => {
        if (currentQuestionIndex < test.questions.length - 1) navigateToQuestion(currentQuestionIndex + 1);
      };

      const handleFinish = () => {
        commitElapsed();
        if (testId === 'mistakes-test') {
          saveProgress(true);
          showNotification({ message: "Mistakes Practice Complete!", type: "success" });
          setView('dashboard');
        } else {
          saveProgress(true);
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          setView('results');
        }
      };

      const fetchHint = async () => {
        setIsHintLoading(true);
        setHint(null);
        try {
          const question = test.questions[originalIndex];
          const prompt = `You are a helpful teaching assistant for a 10-year-old student. Provide a short, simple hint for the following question. Do NOT give the answer. Question: "${question.question}"`;
          const response = await fetch('/.netlify/functions/gemini-proxy', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
          });
          if (!response.ok) throw new Error("API Error");
          const result = await response.json();
          const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) setHint(text); else throw new Error("Invalid structure");
        } catch (error) {
          setHint("Try reading the question carefully and breaking it down into smaller steps.");
        } finally {
          setIsHintLoading(false);
        }
      };

      if (!test || (settings.shuffle && !shuffledOrder)) return <LoadingSpinner message="Loading Test..." />;
      
      const currentQ = test.questions[originalIndex];
      if (!currentQ) return <div className="text-center mt-20 text-2xl">Question missing</div>;
      
      const isSubmitted = !!submittedAnswers[currentQuestionIndex];
      const answeredSet = new Set(Object.keys(submittedAnswers).map(Number));

      const labeled = extractLabeledOptionsFromPrompt(currentQ.question || '');
      const optionsFromData = Array.isArray(currentQ.options) ? currentQ.options.map(o => String(o ?? '').trim()).filter(Boolean) : null;
      const isLabeled = !optionsFromData && labeled && labeled.options.length >= 2;
      const implicitOr = !optionsFromData && !isLabeled ? tryParseTwoOptionsFromOr(currentQ.question || '') : null;
      const displayStem = isLabeled ? labeled.stem : (implicitOr ? implicitOr.stem : (currentQ.question || ''));
      const renderAsButtonsOptions = optionsFromData && optionsFromData.length >= 2 ? optionsFromData : (implicitOr ? implicitOr.options : null);
      const renderAsLabeled = isLabeled && labeled.options.map(o => String(o ?? '').trim()).filter(Boolean).length >= 2;

      return (
        <div className={`min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center transition-colors duration-300 ${flash ? `flash-${flash}` : ''}`}>
          <div className="bg-white border-4 border-slate-100 rounded-3xl shadow-2xl p-6 sm:p-12 w-full max-w-4xl relative">
            <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
              <h2 className="text-2xl sm:text-4xl font-bold text-sky-900 font-orbitron">{test.title}</h2>
              {streak > 2 && <span className="text-2xl font-bold text-orange-500 animate-pulse">🔥 {streak} Streak!</span>}
              {timerEnabled && (
                  <div className={`text-2xl font-orbitron px-5 py-3 rounded-2xl font-bold border-2 shadow-sm ${timeLimitMs > 0 && displayTime < 300000 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                      {timeLimitMs > 0 ? '⏱️ ' : ''}{formatTime(displayTime)}
                  </div>
              )}
            </div>
            
            <QuestionNavigator total={test.questions.length} current={currentQuestionIndex} answeredIndices={answeredSet} onNavigate={navigateToQuestion} />
            
            <div className="mb-8 bg-sky-50 rounded-3xl p-8 border-2 border-sky-100 shadow-sm min-h-[10rem] flex flex-col justify-center">
              <p className="text-slate-400 font-bold mb-3 uppercase tracking-wider text-sm">Question {currentQuestionIndex + 1} of {test.questions.length}</p>
              <p className="text-2xl text-slate-800 whitespace-pre-wrap font-bold leading-relaxed">{displayStem}</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
              {renderAsButtonsOptions ? renderAsButtonsOptions.map((opt, i) => (
                <button
                  key={i}
                  onClick={() => handleAnswerSelect(opt)}
                  disabled={isSubmitted}
                  className={`p-6 rounded-2xl border-4 text-left text-xl font-bold transition-all min-h-[80px] shadow-sm ${
                    userAnswers[originalIndex] === opt 
                        ? 'bg-sky-100 border-sky-500 text-sky-900 transform scale-[1.02]' 
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300'
                  } ${isSubmitted ? 'opacity-60 cursor-not-allowed' : ''}`}
                >
                  {opt}
                </button>
              )) : renderAsLabeled ? labeled.options.map((o, idx) => {
                if (!o) return null; 
                const letter = String.fromCharCode(97 + idx); 
                const checked = userAnswers[originalIndex] === letter;
                return (
                  <label key={letter} className={`p-6 rounded-2xl border-4 flex items-center gap-5 text-xl font-bold transition-all cursor-pointer min-h-[80px] shadow-sm ${checked ? 'bg-sky-100 border-sky-500 text-sky-900' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'} ${isSubmitted ? 'opacity-60 cursor-not-allowed' : ''}`}>
                    <input type="radio" name={`q-${originalIndex}`} disabled={isSubmitted} checked={checked} onChange={() => handleAnswerSelect(letter)} className="w-8 h-8 text-sky-600 focus:ring-sky-500 border-slate-300" />
                    <span className="uppercase text-sky-700 text-2xl">{letter})</span><span className="leading-snug">{o}</span>
                  </label>
                );
              }) : (
                <textarea
                  value={userAnswers[originalIndex] || ''}
                  onChange={(e) => handleAnswerSelect(e.target.value)}
                  disabled={isSubmitted}
                  className="w-full col-span-2 p-6 text-2xl font-bold border-4 border-slate-200 rounded-3xl focus:border-sky-500 outline-none resize-none bg-white shadow-inner"
                  placeholder="Type your answer here..."
                  rows="4"
                />
              )}
            </div>

            {!isSubmitted && !showInstantFeedback && (
              <div className="text-center my-8">
                <button onClick={() => handleSubmitAnswer()} disabled={!userAnswers[originalIndex]} className="bg-emerald-500 text-white font-bold py-4 px-12 rounded-2xl hover:bg-emerald-400 disabled:opacity-50 text-2xl shadow-xl transition-all transform hover:-translate-y-1">
                    Submit Answer
                </button>
              </div>
            )}

            {showInstantFeedback && (
              <div className="my-6 text-center">
                {hint ? (
                    <div className="p-5 bg-amber-50 border-2 border-amber-200 text-amber-800 rounded-2xl text-xl font-bold shadow-sm">{hint}</div>
                ) : (
                    <button onClick={fetchHint} disabled={isHintLoading} className="text-sky-600 font-bold hover:text-sky-800 text-xl disabled:opacity-50">
                        {isHintLoading ? '✨ Generating Hint...' : '💡 Need a hint?'}
                    </button>
                )}
              </div>
            )}

            {feedback && (
                <div aria-live="polite" className={`p-6 rounded-2xl text-2xl font-bold mb-8 text-center shadow-md border-2 ${feedback.includes('Correct') ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                    {feedback}
                </div>
            )}

            {lastAnswerResult && !lastAnswerResult.isCorrect && showInstantFeedback && !showExplanation && (
              <div className="text-center">
                <button onClick={() => setShowExplanation(true)} className="mt-2 px-6 py-3 bg-slate-100 text-slate-700 rounded-xl text-lg font-bold hover:bg-slate-200 border-2 border-slate-300 shadow-sm transition">
                  🤖 Explain my mistake
                </button>
              </div>
            )}
            
            {showExplanation && (
              <AIExplanation question={lastAnswerResult.question} userAnswer={lastAnswerResult.userAnswer} correctAnswer={lastAnswerResult.question.answer} onClose={() => setShowExplanation(false)} />
            )}

            <div className="flex justify-between items-center mt-12 pt-8 border-t-4 border-slate-100">
              <button onClick={() => { commitElapsed(); saveProgress(false); setView('dashboard'); }} className="text-slate-500 font-bold hover:text-slate-800 text-xl px-6 py-3 bg-slate-100 rounded-xl hover:bg-slate-200 transition">
                  Exit & Save
              </button>
              
              {currentQuestionIndex < test.questions.length - 1 ? (
                <button onClick={goToNext} disabled={!isSubmitted && showInstantFeedback} className="bg-sky-600 text-white font-bold py-4 px-10 rounded-2xl hover:bg-sky-500 disabled:opacity-50 disabled:bg-slate-400 text-2xl shadow-lg transition">
                    Next Question &rarr;
                </button>
              ) : (
                <button onClick={handleFinish} disabled={!isSubmitted && showInstantFeedback} className="bg-purple-600 text-white font-bold py-4 px-12 rounded-2xl hover:bg-purple-500 disabled:opacity-50 disabled:bg-slate-400 text-2xl shadow-xl transition transform hover:-translate-y-1">
                    Finish Test 🏆
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ResultsView = ({ userData, setView, testDetails, allTests }) => {
      const { id: testId } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const progress = userData.progress?.[testId];
      
      if (!test || !progress) { setView('dashboard'); return null; }
      
      const score = progress.score || 0;
      const total = test.questions.length;
      
      return (
        <div className="p-4 sm:p-10 min-h-screen max-w-5xl mx-auto">
          <div className="bg-white border-4 border-sky-100 rounded-3xl shadow-2xl p-8 sm:p-12 text-center relative overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-sky-50 rounded-full opacity-50 transform translate-x-1/3 -translate-y-1/3"></div>
            <div className="relative z-10">
                <h2 className="text-5xl sm:text-6xl font-black text-sky-900 font-orbitron mb-8">Test Complete!</h2>
                
                <div className="inline-block bg-sky-50 border-4 border-sky-200 rounded-[3rem] p-10 mb-12 shadow-inner">
                    <p className="text-3xl text-sky-800 font-bold uppercase tracking-widest mb-4">Final Score</p>
                    <p className="text-7xl font-black text-amber-500 my-4 tracking-tighter">
                        {score} <span className="text-5xl text-sky-800 opacity-50">/ {total}</span>
                    </p>
                    <p className="text-2xl text-sky-700 font-bold bg-sky-200 inline-block px-6 py-2 rounded-full mt-4">
                        {Math.round((score/total)*100)}% Accuracy
                    </p>
                </div>

                <div className="space-y-6 text-left mt-8">
                    {test.questions.map((q, i) => {
                        const originalIndex = progress.shuffledOrder ? progress.shuffledOrder[i] : i;
                        const actualQuestion = test.questions[originalIndex];
                        const userAnswer = progress.answers[originalIndex];
                        const isCorr = isAnswerCorrect(actualQuestion, userAnswer);
                        return (
                            <div key={i} className={`p-6 rounded-3xl border-l-8 shadow-sm ${isCorr ? 'bg-emerald-50 border-emerald-500' : 'bg-red-50 border-red-500'}`}>
                                <p className="font-bold text-slate-800 mb-3 text-xl">{i+1}. {actualQuestion.question}</p>
                                <p className={`font-bold text-lg ${isCorr ? 'text-emerald-700' : 'text-red-700'}`}>Your answer: {userAnswer || 'Blank'}</p>
                                {!isCorr && <p className="font-bold text-slate-700 mt-2 text-lg">Correct answer: {actualQuestion.answer}</p>}
                            </div>
                        );
                    })}
                </div>

                <button onClick={() => setView('dashboard')} className="mt-12 w-full sm:w-auto bg-sky-600 text-white font-bold py-5 px-16 rounded-2xl hover:bg-sky-500 text-3xl shadow-xl transition transform hover:-translate-y-1">
                    Return to Dashboard
                </button>
            </div>
          </div>
        </div>
      );
    };

    const AdminView = ({ userData, setView, allTests, updateAllData, showModal, showNotification }) => {
      const handleResetAllData = () => {
        showModal({ 
            title: "Reset All Player Data?", 
            message: "Are you absolutely sure? This will delete all progress, XP, and achievements. Custom created tests will be kept.", 
            confirmText: "Reset Everything", 
            onConfirm: () => {
                const cleanUserData = { 
                    name: "Nicolas", 
                    avatar: '👨‍🚀',
                    progress: {}, 
                    level: 1, 
                    xp: 0, 
                    totalAttempts: 0, 
                    currentStreak: 0,
                    correctRunAfterWrong: 0,
                    dailyChallengeStreak: 0,
                    achievements: {},
                    badgeProgress: { geometryGuruTests: [] },
                    fullTestsCompleted: [],
                    weeklyCompletionWeeks: []
                };
                updateAllData({ allTests, userData: cleanUserData });
                showNotification({message: "Reset complete.", type: 'success'}); 
                setTimeout(() => window.location.reload(), 1500);
            }
        });
      };

      const handleDeleteTest = (testId) => {
        showModal({
            title: "Delete Test?",
            message: "Are you sure you want to permanently delete this test?",
            confirmText: "Delete",
            onConfirm: () => {
                const tests = allTests.filter(x => x.id !== testId);
                const newProgress = { ...userData.progress };
                delete newProgress[testId];
                updateAllData({ userData: { ...userData, progress: newProgress }, allTests: tests });
                showNotification({message:'Test Deleted', type:'success'});
            }
        });
      }

      return (
        <div className="p-8 min-h-screen max-w-6xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-10 gap-4">
              <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 font-orbitron">Admin Panel</h1>
              <button onClick={() => setView('dashboard')} className="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl shadow-sm hover:bg-slate-50 transition text-lg">
                  &larr; Back to Dashboard
              </button>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
              <button onClick={() => setView('createTest')} className="bg-emerald-500 text-white p-10 rounded-3xl font-bold text-3xl hover:bg-emerald-400 shadow-xl transition transform hover:-translate-y-1">
                  Create New Test 📝
              </button>
              <button onClick={() => setView('performance')} className="bg-purple-500 text-white p-10 rounded-3xl font-bold text-3xl hover:bg-purple-400 shadow-xl transition transform hover:-translate-y-1">
                  Performance Dashboard 📈
              </button>
          </div>
          
          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 mb-10 shadow-md">
              <h2 className="text-3xl font-bold mb-6 text-sky-900 font-orbitron">Data Management</h2>
              <button onClick={handleResetAllData} className="bg-red-500 text-white font-bold py-4 px-8 rounded-xl hover:bg-red-400 text-xl shadow-md transition">
                  ⚠️ Reset All Player Data
              </button>
          </div>
          
          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 shadow-md">
            <h2 className="text-3xl font-bold mb-6 text-sky-900 font-orbitron">Manage Tests</h2>
            <div className="space-y-5">
              {allTests.map(t => (
                <div key={t.id} className="bg-slate-50 p-6 rounded-2xl flex flex-wrap justify-between items-center border-2 border-slate-200 gap-4">
                  <div>
                      <h3 className="font-bold text-xl text-slate-800 mb-1">{t.title}</h3>
                      <p className="text-slate-500 font-semibold">{t.questions.length} questions</p>
                  </div>
                  <button onClick={() => handleDeleteTest(t.id)} className="bg-white border-2 border-red-200 text-red-600 font-bold py-2 px-6 rounded-xl hover:bg-red-50 transition">
                      Delete
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const CreateTestView = ({ setView, allTests, updateAllData, userData, showNotification }) => {
        const [title, setTitle] = useState(''); 
        const [subject, setSubject] = useState('Maths'); 
        const [questions, setQuestions] = useState([{ question: '', options: ['','','',''], answer: '' }]);
        
        const handleSave = () => {
            if(!title) return showNotification({message: "Title is required.", type:"error"});
            if (questions.some(q => !q.question || !q.answer)) return showNotification({message: "All questions must have text and an answer.", type:"error"});
            
            const nt = { id: `custom-${Date.now()}`, title, subject, questions, notes: '' };
            updateAllData({ userData, allTests: [...allTests, nt] });
            showNotification({message: "Test Created successfully!", type:"success"});
            setView('admin');
        };

        return (
            <div className="p-4 sm:p-10 max-w-5xl mx-auto min-h-screen">
                <div className="flex flex-wrap justify-between items-center mb-10 gap-4">
                    <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 font-orbitron">Create Test</h1>
                    <button onClick={() => setView('admin')} className="font-bold text-slate-500 hover:text-slate-800 text-xl bg-white px-6 py-3 rounded-xl border border-slate-200">Cancel</button>
                </div>
                <div className="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border-2 border-slate-100">
                    <input type="text" placeholder="Test Title" value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-5 mb-6 border-2 border-slate-200 rounded-2xl font-bold text-2xl focus:border-sky-500 outline-none" />
                    <select value={subject} onChange={e=>setSubject(e.target.value)} className="w-full p-5 mb-10 border-2 border-slate-200 rounded-2xl font-bold text-xl focus:border-sky-500 outline-none cursor-pointer">
                        <option>Maths</option><option>English</option><option>Mixed</option>
                    </select>
                    
                    {questions.map((q, i) => (
                        <div key={i} className="mb-8 p-8 bg-sky-50 rounded-3xl border-2 border-sky-100 relative">
                            <div className="absolute top-4 left-6 font-bold text-sky-800 opacity-50 uppercase tracking-widest text-sm">Question {i+1}</div>
                            <textarea placeholder="Enter question text here..." value={q.question} onChange={e=>{const n=[...questions]; n[i].question=e.target.value; setQuestions(n);}} className="w-full p-5 mt-6 mb-6 rounded-2xl border-2 border-slate-200 text-xl font-semibold outline-none focus:border-sky-500" rows="3" />
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                {q.options.map((opt, oIndex) => (
                                    <input key={oIndex} type="text" value={opt} onChange={e=>{const n=[...questions]; n[i].options[oIndex]=e.target.value; setQuestions(n);}} placeholder={`Option ${oIndex + 1}`} className="p-4 rounded-xl border-2 border-slate-200 text-lg font-semibold focus:border-sky-500 outline-none" />
                                ))}
                            </div>
                            <input type="text" placeholder="Exact Correct Answer" value={q.answer} onChange={e=>{const n=[...questions]; n[i].answer=e.target.value; setQuestions(n);}} className="w-full p-5 rounded-2xl border-4 border-emerald-200 bg-emerald-50 text-xl font-bold focus:border-emerald-500 outline-none text-emerald-900" />
                        </div>
                    ))}
                    <div className="flex flex-col sm:flex-row gap-6 mt-10">
                        <button onClick={() => setQuestions([...questions, {question:'', options:['','','',''], answer:''}])} className="flex-1 bg-slate-100 text-slate-700 font-bold py-5 rounded-2xl text-xl hover:bg-slate-200 border-2 border-slate-200 transition">Add Question</button>
                        <button onClick={handleSave} className="flex-1 bg-emerald-500 text-white font-bold py-5 rounded-2xl text-xl hover:bg-emerald-400 shadow-lg transition">Save Test</button>
                    </div>
                </div>
            </div>
        );
    };

    const PerformanceDashboardView = ({ setView, userData, allTests }) => {
      const chartRef = useRef(null); 
      const chartInstanceRef = useRef(null);
      
      useEffect(() => {
        if (!chartRef.current || !window.Chart) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        
        const completed = Object.entries(userData.progress||{}).map(([id, p]) => { 
            const t = allTests.find(x=>x.id===id); 
            return (t && Object.keys(p.answers||{}).length === t.questions.length) ? {...t, score: p.score} : null; 
        }).filter(Boolean);
        
        const maths = completed.filter(t=>t.subject==='Maths').map(t=>(t.score/t.questions.length)*100);
        const english = completed.filter(t=>t.subject==='English').map(t=>(t.score/t.questions.length)*100);
        // BUG FIX: Added Mixed tests to the chart
        const mixed = completed.filter(t=>t.subject==='Mixed').map(t=>(t.score/t.questions.length)*100);
        
        const maxLength = Math.max(maths.length, english.length, mixed.length);
        
        chartInstanceRef.current = new Chart(ctx, {
          type: 'line', 
          data: { 
              labels: Array.from({length: maxLength}, (_,i)=>`Attempt ${i+1}`), 
              datasets: [ 
                  {label: 'Maths (%)', data: maths, borderColor: '#3b82f6', tension: 0.2}, 
                  {label: 'English (%)', data: english, borderColor: '#ec4899', tension: 0.2},
                  {label: 'Mixed (%)', data: mixed, borderColor: '#8b5cf6', tension: 0.2}
              ]
          }, 
          options: { 
              scales: { y: { beginAtZero: true, max: 100 } },
              responsive: true,
              plugins: { legend: { labels: { font: { family: "'Nunito', sans-serif", size: 14 } } } }
          }
        });
      }, [userData, allTests]);
      
      return (
          <div className="p-8 max-w-5xl mx-auto min-h-screen">
              <div className="flex justify-between items-center mb-8">
                  <h1 className="text-4xl font-bold text-sky-900 font-orbitron">Performance</h1>
                  <button onClick={() => setView('admin')} className="font-bold bg-white border border-slate-200 px-6 py-3 rounded-xl text-slate-500 hover:text-slate-800 shadow-sm">Back</button>
              </div>
              <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-slate-100">
                  <canvas ref={chartRef}></canvas>
              </div>
          </div>
      );
    };

    const SettingsView = ({ userData, setView, updateUserData, showNotification }) => {
      const [name, setName] = useState(userData.name || 'Nicolas'); 
      const [avatar, setAvatar] = useState(userData.avatar || '👨‍🚀'); 
      const [dyslexiaFriendly, setDyslexiaFriendly] = useState(userData.dyslexiaFriendly || false);
      const avatars = ['👨‍🚀', '🚀', '⭐', '🎮', '🤖', '🧠', '💡', '🏆'];
      
      return (
        <div className="p-8 min-h-screen flex items-center justify-center">
          <div className="max-w-lg mx-auto w-full bg-white border-4 border-slate-100 rounded-[2rem] p-10 shadow-2xl">
            <h1 className="text-4xl font-bold font-orbitron text-sky-900 mb-8 text-center">Profile Settings</h1>
            
            <label className="block text-slate-500 font-bold mb-2 uppercase tracking-wide text-sm">Player Name</label>
            <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-5 bg-slate-50 rounded-2xl border-2 border-slate-200 mb-8 font-bold text-2xl focus:border-sky-500 outline-none transition" placeholder="Player Name" />
            
            <label className="block text-slate-500 font-bold mb-3 uppercase tracking-wide text-sm">Choose Your Avatar</label>
            <div className="grid grid-cols-4 gap-4 mb-10">
              {avatars.map(av => (
                  <button key={av} onClick={() => setAvatar(av)} className={`text-5xl p-5 rounded-2xl transition-all ${avatar === av ? 'bg-sky-100 ring-4 ring-sky-400 transform scale-110 shadow-md' : 'bg-slate-50 hover:bg-slate-100 border-2 border-slate-200'}`}>
                      {av}
                  </button>
              ))}
            </div>
            
            <label className="flex items-center justify-between p-6 border-2 border-slate-200 rounded-2xl mb-10 cursor-pointer hover:bg-slate-50 transition">
                <div>
                    <span className="block font-bold text-slate-800 text-xl">Dyslexia Friendly Font</span>
                    <span className="text-slate-500 font-semibold">Changes all text to Arial for easier reading.</span>
                </div>
                <input type="checkbox" checked={dyslexiaFriendly} onChange={() => setDyslexiaFriendly(!dyslexiaFriendly)} className="w-8 h-8 text-sky-600 focus:ring-sky-500 border-slate-300 rounded-lg" />
            </label>
            
            <div className="flex gap-4">
              <button onClick={() => setView('dashboard')} className="w-full bg-slate-200 text-slate-700 font-bold py-5 rounded-2xl hover:bg-slate-300 text-xl transition">Cancel</button>
              <button onClick={() => { updateUserData({...userData, name, avatar, dyslexiaFriendly}); showNotification({message:"Settings Saved!", type:"success"}); setView('dashboard'); }} className="w-full bg-emerald-500 text-white font-bold py-5 rounded-2xl hover:bg-emerald-400 text-xl shadow-lg transition transform hover:-translate-y-1">Save Profile</button>
            </div>
          </div>
        </div>
      );
    };

    const AchievementsView = ({ userData, setView, updateUserData, showNotification }) => {
      const [activeTab, setActiveTab] = useState('Badges');
      const unlockedTitles = achievementsList.filter(a => userData.achievements[a.id] && a.unlocksTitle);
      
      return (
        <div className="p-4 sm:p-10 min-h-screen max-w-7xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-10 gap-4">
              <h1 className="text-4xl sm:text-5xl font-bold font-orbitron text-sky-900">Achievements 🏆</h1>
              <button onClick={() => setView('dashboard')} className="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-8 rounded-xl hover:bg-slate-50 shadow-sm text-lg transition">
                  Back to Dashboard
              </button>
          </div>
          
          <div className="flex gap-4 mb-10 bg-slate-100 p-2 rounded-2xl inline-flex">
              <button onClick={()=>setActiveTab('Badges')} className={`px-8 py-4 font-bold rounded-xl text-lg transition ${activeTab==='Badges' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Badges</button>
              <button onClick={()=>setActiveTab('Titles')} className={`px-8 py-4 font-bold rounded-xl text-lg transition ${activeTab==='Titles' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Titles</button>
          </div>
          
          {activeTab === 'Badges' && (
              <div className="space-y-12">
                  {['Quick Wins', 'Medium-Term', 'Longer-Term'].map(cat => (
                      <div key={cat}>
                          <h2 className="text-3xl font-bold text-slate-800 mb-6 border-b-4 border-slate-200 pb-3 font-orbitron">{cat}</h2>
                          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                              {achievementsList.filter(a => a.category === cat).map(a => {
                                  const unl = userData.achievements[a.id];
                                  return (
                                      <div key={a.id} className={`p-6 rounded-3xl border-4 text-center transition-all flex flex-col items-center justify-center min-h-[200px] ${unl ? 'bg-white border-amber-400 shadow-xl transform hover:-translate-y-1' : 'bg-slate-50 border-slate-200 opacity-60 grayscale'}`}>
                                          <div className={`text-6xl mb-4 ${unl ? '' : 'opacity-50'}`}>🏆</div>
                                          <h3 className={`font-black text-xl mb-2 leading-tight ${unl ? 'text-amber-600' : 'text-slate-500'}`}>{a.title}</h3>
                                          <p className="text-sm font-bold text-slate-500 leading-snug">{a.description}</p>
                                      </div>
                                  )
                              })}
                          </div>
                      </div>
                  ))}
              </div>
          )}
          
          {activeTab === 'Titles' && (
              <div className="bg-white p-10 rounded-3xl shadow-xl border-4 border-slate-100">
                  <h2 className="text-3xl font-bold text-sky-900 mb-8 font-orbitron">Equip a Title</h2>
                  {unlockedTitles.length > 0 ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {unlockedTitles.map(a => (
                              <div key={a.id} className="flex flex-col sm:flex-row justify-between items-center p-6 bg-slate-50 border-2 border-slate-200 rounded-2xl gap-4 hover:border-sky-300 transition">
                                  <div className="text-center sm:text-left">
                                      <p className="font-black text-2xl text-amber-600 mb-1">{a.unlocksTitle}</p>
                                      <p className="text-slate-500 font-bold text-sm">Unlocked from: {a.title}</p>
                                  </div>
                                  <button onClick={() => { updateUserData({...userData, title: a.unlocksTitle}); showNotification({message:"Title Equipped!", type:"success"}); }} disabled={userData.title===a.unlocksTitle} className="w-full sm:w-auto bg-sky-600 text-white font-bold py-3 px-8 rounded-xl disabled:bg-slate-300 disabled:text-slate-500 shadow-md transition">
                                      {userData.title===a.unlocksTitle ? 'Equipped' : 'Equip'}
                                  </button>
                              </div>
                          ))}
                      </div>
                  ) : (
                      <div className="text-center p-12 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300">
                          <p className="text-slate-500 font-bold text-2xl">No titles unlocked yet.</p>
                          <p className="text-slate-400 font-semibold mt-2 text-lg">Keep earning badges to unlock them!</p>
                      </div>
                  )}
              </div>
          )}
        </div>
      );
    };

    function App() {
      const [appData, setAppData] = useState(null);
      const [view, setView] = useState('loading');
      const [selectedTest, setSelectedTest] = useState(null);
      const [notification, setNotification] = useState({ show: false, message: '' });
      const [modal, setModal] = useState({ show: false });
      
      const isInitialized = useRef(false);

      useEffect(() => {
        if (isInitialized.current) return;
        isInitialized.current = true;
        
        const savedData = localStorage.getItem('seagPortalData');
        let loadedData = savedData ? JSON.parse(savedData) : null;
        
        if (!loadedData) {
          loadedData = { 
            userData: { name: "Nicolas", avatar: '👨‍🚀', progress: {}, level: 1, xp: 0, totalAttempts: 0, achievements: {} }, 
            allTests: defaultTests 
          };
          safeSetLocalStorage('seagPortalData', JSON.stringify(loadedData));
        } else {
            const existingIds = loadedData.allTests.map(t => t.id);
            defaultTests.forEach(dt => { 
                if (!existingIds.includes(dt.id)) loadedData.allTests.push(dt); 
            });
            safeSetLocalStorage('seagPortalData', JSON.stringify(loadedData));
        }
        setAppData(loadedData);
        setView('dashboard');
      }, []);

      useEffect(() => {
        if (appData?.userData?.dyslexiaFriendly) {
            document.body.classList.add('dyslexia-friendly');
        } else {
            document.body.classList.remove('dyslexia-friendly');
        }
      }, [appData?.userData?.dyslexiaFriendly]);

      const updateUserData = useCallback((newUserData, options = {}) => {
        setAppData(prev => {
            const { event } = options || {};
            let mutable = { ...prev.userData, ...newUserData };
            
            if (event?.type === 'ANSWER_SUBMITTED') {
                mutable.totalAttempts = (mutable.totalAttempts || 0) + 1;
                const isCorrect = !!event.payload.correct;
                const prevWasIncorrect = !!mutable.lastAnswerWasIncorrect;
                mutable.lastAnswerWasIncorrect = !isCorrect;
                
                if (isCorrect) {
                    mutable.totalCorrectAnswers = (mutable.totalCorrectAnswers || 0) + 1;
                    mutable.currentStreak = (mutable.currentStreak || 0) + 1;
                    // BUG FIX: correctRunAfterWrong fully resetting on wrong answer
                    mutable.correctRunAfterWrong = prevWasIncorrect ? 1 : (mutable.correctRunAfterWrong || 0) + 1;
                    if (!event.payload.usedHint) mutable.noHintCorrectCount = (mutable.noHintCorrectCount || 0) + 1;
                    
                    const tags = Array.isArray(event.payload.tags) ? event.payload.tags : [];
                    mutable.correctAnswersByTag = mutable.correctAnswersByTag || {};
                    tags.forEach(t => mutable.correctAnswersByTag[t] = (mutable.correctAnswersByTag[t] || 0) + 1);
                } else {
                    mutable.currentStreak = 0; 
                    mutable.correctRunAfterWrong = 0;
                }
            }
            
            if (event?.type === 'PACK_COMPLETED' && event.payload?.mode === 'Test') {
                let xpToAdd = event.payload.score;
                mutable.xp = (mutable.xp || 0) + xpToAdd;
                let thresh = (mutable.level || 1) * 100;
                while (mutable.xp >= thresh) { 
                    mutable.xp -= thresh; 
                    mutable.level = (mutable.level || 1) + 1; 
                    thresh = mutable.level * 100; 
                }
            }
            
            const { updated } = unlockAchievements(mutable, event);
            const newData = { ...prev, userData: updated };
            safeSetLocalStorage('seagPortalData', JSON.stringify(newData));
            return newData;
        });
      }, []);

      const updateAllData = useCallback((newData) => {
          setAppData(newData); 
          safeSetLocalStorage('seagPortalData', JSON.stringify(newData));
      }, []);

      if (!appData) return <LoadingSpinner message="Loading Portal System..." />;

      return (
        <div>
          {view === 'loading' && <LoadingSpinner message="Loading Portal System..." />}
          {view === 'dashboard' && <Dashboard userData={appData.userData} setView={setView} setSelectedTest={setSelectedTest} allTests={appData.allTests} showModal={setModal} hideModal={() => setModal({show:false})} updateAllData={updateAllData} appData={appData} showNotification={setNotification} />}
          {view === 'quiz' && <QuizView userData={appData.userData} testDetails={selectedTest} setView={setView} allTests={appData.allTests} updateUserData={updateUserData} showNotification={setNotification} showModal={setModal} />}
          {view === 'results' && <ResultsView userData={appData.userData} setView={setView} testDetails={selectedTest} allTests={appData.allTests} />}
          {view === 'admin' && <AdminView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} showModal={setModal} showNotification={setNotification} />}
          {view === 'createTest' && <CreateTestView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} showNotification={setNotification} />}
          {view === 'performance' && <PerformanceDashboardView userData={appData.userData} setView={setView} allTests={appData.allTests} />}
          {view === 'settings' && <SettingsView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={setNotification} />}
          {view === 'achievements' && <AchievementsView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={setNotification} />}
          
          {notification.show && <Notification message={notification.message} type={notification.type} onDismiss={() => setNotification({ show: false })} />}
          {modal.show && <Modal title={modal.title} message={modal.message} onConfirm={modal.onConfirm} onCancel={modal.onCancel} confirmText={modal.confirmText}>{modal.children}</Modal>}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
