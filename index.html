  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ---------- Utilities ----------
    function safeSetLocalStorage(key, value) {
      try { localStorage.setItem(key, value); return true; }
      catch (e) { console.warn('localStorage write failed:', e); return false; }
    }

    // Parent PIN hashing (SHA-256 hex)
    async function sha256Hex(message) {
      const enc = new TextEncoder();
      const data = enc.encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function isHashedPin(pinStr) {
      return typeof pinStr === 'string' && pinStr.startsWith('sha256:') && pinStr.length === 7 + 64;
    }
    async function hashPin(pin) {
      if (!pin) return '';
      const hex = await sha256Hex(String(pin));
      return 'sha256:' + hex;
    }

    // --- Audio Engine ---
    const playSound = (type, enabled = true) => {
        if (!enabled) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'incorrect') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.2);
            } else if (type === 'levelup') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            }
        } catch(e) { console.log("Audio not supported"); }
    };

    // ---------- achievementsList (full) ----------
    const achievementsList = [

        { id: 'punctuationPro', title: 'Punctuation Pro', description: 'Correctly answer 25 punctuation questions.', category: 'Medium-Term', icon: '✒️', getProgress: (ud) => `${Math.min((ud.correctAnswersByTag||{}).punctuation || 0, 25)} / 25` },
        { id: 'vocabularyVirtuoso', title: 'Vocabulary Virtuoso', description: 'Correctly answer 100 vocabulary questions.', category: 'Longer-Term', icon: '🧠', getProgress: (ud) => `${Math.min((ud.correctAnswersByTag||{}).vocabulary || 0, 100)} / 100` },

        { id: 'speedDemon', title: 'Speed Demon', description: 'Finish a test in Test Mode with over half the time remaining.', category: 'Medium-Term', unlocksTitle: 'Speedster', icon: '🏎️' },

        { id: 'dedicatedDabbler', title: 'Dedicated Dabbler', description: 'Complete the Daily Challenge 7 days in a row.', category: 'Longer-Term', icon: '📆', getProgress: (ud) => `${Math.min(ud.dailyChallengeStreak || 0, 7)} / 7` },
        { id: 'marathonRunner', title: 'Marathon Runner', description: 'Complete 3 full practice tests.', category: 'Longer-Term', unlocksTitle: 'Endurance Champ', icon: '🏃', getProgress: (ud) => `${Math.min((ud.fullTestsCompleted||[]).length, 3)} / 3` },

    function xpForAchievementId(id) {
      const ach = achievementsList.find(a => a.id === id);
      if (!ach) return 0;
      switch (ach.category) { case 'Quick Wins': return 3; case 'Medium-Term': return 5; case 'Longer-Term': return 10; default: return 0; }
    }

    // ---------- Parsing & Format Helpers (reinserted) ----------
    function isoWeekString(d) {
      const date = new Date(d);
      const tmp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((tmp - yearStart) / 8640000) + 1) / 7);
      return `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    // unlockAchievements (reinserted)
    function unlockAchievements(userData, event) {
      userData.achievements = userData.achievements || {};
      userData.correctAnswersByTag = userData.correctAnswersByTag || {};
      userData.badgeProgress = userData.badgeProgress || {};
      userData.badgeProgress.geometryGuruTests = Array.isArray(userData.badgeProgress.geometryGuruTests) ? userData.badgeProgress.geometryGuruTests : [];
      userData.weeklyCompletionWeeks = Array.isArray(userData.weeklyCompletionWeeks) ? userData.weeklyCompletionWeeks : [];
      userData.fullTestsCompleted = Array.isArray(userData.fullTestsCompleted) ? userData.fullTestsCompleted : [];

      const unlockedNow = [];
      const has = (id) => !!userData.achievements[id];
      const unlock = (id) => { if (!userData.achievements[id]) { userData.achievements[id] = true; unlockedNow.push(id); } };

      const type = event?.type;
      const p = event?.payload || {};

      if (type === 'ANSWER_SUBMITTED') {
        const tagCounts = userData.correctAnswersByTag || {};
        if (!has('fractionFanatic') && (tagCounts.fractions || 0) >= 50) unlock('fractionFanatic');
        if (!has('punctuationPro') && (tagCounts.punctuation || 0) >= 25) unlock('punctuationPro');
        if (!has('vocabularyVirtuoso') && (tagCounts.vocabulary || 0) >= 100) unlock('vocabularyVirtuoso');
        if (!has('centuryClub') && (userData.totalCorrectAnswers || 0) >= 100) unlock('centuryClub');
        if (!has('comebackKid') && p.correct && (userData.correctRunAfterWrong || 0) >= 3) unlock('comebackKid');
        if (!has('firstSteps') && (userData.totalAttempts || 0) >= 5) unlock('firstSteps');
        if (!has('quickThinker') && p.correct && (p.timeToAnswer || 0) <= 20) unlock('quickThinker');
        if (!has('firstStreak') && (userData.currentStreak || 0) >= 3) unlock('firstStreak');
        if (!has('topicExplorer') && (userData.uniqueTagsToday?.tags?.length || 0) >= 2) unlock('topicExplorer');
        if (!has('mistakeFixer') && p.correct && p.wasReviewed) unlock('mistakeFixer');
        if (!has('noHintHeroMini') && (userData.noHintCorrectCount || 0) >= 5) unlock('noHintHeroMini');
        if (!has('accurateStart') && (userData.totalAttempts || 0) >= 10 && ((userData.totalCorrectAnswers || 0) / userData.totalAttempts) >= 0.7) unlock('accurateStart');
        if (!has('speedStreak') && (userData.currentStreak || 0) >= 3 && (userData.lastCorrectAnswerTimes || []).length === 3 && userData.lastCorrectAnswerTimes.every(t => t <= 30)) unlock('speedStreak');
        if (!has('consistencyStar') && (userData.loginStreak || 0) >= 2) unlock('consistencyStar');
        if (!has('varietyChamp') && p.correct && (userData.uniqueTagsToday?.tags?.length || 0) >= 3) unlock('varietyChamp');
        if (!has('noHintHeroPro') && (userData.noHintStreak || 0) >= 10) unlock('noHintHeroPro');
        if (!has('masteryBadge')) {
            const stats = userData.perTopicStats || {};
            if (Object.values(stats).some(s => s.total >= 30 && (s.correct / s.total) >= 0.9)) unlock('masteryBadge');
        }
        if (!has('reviewPro') && (userData.reviewCorrections || 0) >= 10) unlock('reviewPro');
      }

      if (type === 'PACK_COMPLETED') {
        if (p.mode === 'Test' && !has('speedDemon') && typeof p.timeLeft === 'number' && typeof p.initialTotalTime === 'number' && p.initialTotalTime > 0 && p.timeLeft >= (p.initialTotalTime / 2)) unlock('speedDemon');
        if (p.testHasGeometry && p.totalQuestions > 0 && (p.score / p.totalQuestions) >= 0.9) {
          const list = new Set(userData.badgeProgress.geometryGuruTests);
          list.add(p.finishedTestId);
          userData.badgeProgress.geometryGuruTests = Array.from(list);
          if (!has('geometryGuru') && userData.badgeProgress.geometryGuruTests.length >= 3) unlock('geometryGuru');
        }
        if (p.finishedAt) {
          const finishedDate = new Date(p.finishedAt);
          userData.weeklyDayMap = userData.weeklyDayMap || {};
          const weekKey = isoWeekString(finishedDate);
          const dayKey = finishedDate.toISOString().split('T')[0];
          const days = userData.weeklyDayMap[weekKey] || {};
          days[dayKey] = true;
          userData.weeklyDayMap[weekKey] = days;
          if (!has('weeklyWarrior') && Object.keys(days).length >= 5) unlock('weeklyWarrior');
        }
        if (!has('clutchPerformer') && p.isFullPractice && p.totalQuestions >= 10 && p.lastQuestionCorrect) unlock('clutchPerformer');

        if (p.finishedTestId && (p.finishedTestId.includes('full') || p.finishedTestId.includes('seag') || p.finishedTestId.includes('boss'))) {
          const ft = new Set(userData.fullTestsCompleted);
          ft.add(p.finishedTestId);
          userData.fullTestsCompleted = Array.from(ft);
          if (!has('marathonRunner') && userData.fullTestsCompleted.length >= 3) unlock('marathonRunner');
        }
        if (!has('solidAccuracy') && (p.totalQuestions || 0) >= 10 && ((p.score || 0) / (p.totalQuestions || 1)) >= 0.8) unlock('solidAccuracy');
        if (!has('packFinisher')) unlock('packFinisher');
        if (!has('perfectPack') && p.score === p.totalQuestions) unlock('perfectPack');
        if (!has('dedicatedDabbler') && p.isDailyChallenge && (userData.dailyChallengeStreak || 0) >= 7) unlock('dedicatedDabbler');
      }

      return { updated: userData, unlockedIds: unlockedNow };
    }

    // FormatTime
    function formatTime(ms) {
      if (ms < 0) ms = 0;
      const sec = Math.floor(ms / 1000);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }

    // Option extraction helpers
    function extractLabeledOptionsFromPrompt(prompt) {
      if (!prompt) return null;
      const s = String(prompt).replace(/\s+/g, ' ').trim();
      const firstA = /(?:^|[\s(])[Aa][\)\.\:]\s*/.exec(s);
      if (!firstA) return null;
      const stem = s.slice(0, firstA.index).trim();
      const rest = s.slice(firstA.index);
      const labelRe = /(?:^|[\s(])([A-Ea-e])[\)\.\:]\s*/g;
      let match; const spans = [];
      while ((match = labelRe.exec(rest)) !== null) { spans.push({ label: match[1].toLowerCase(), labelStart: match.index, textStart: labelRe.lastIndex }); }
      if (spans.length < 2) return null;
      const options = [];
      for (let i = 0; i < spans.length; i++) {
        const start = spans[i].textStart;
        const end = (i + 1 < spans.length) ? spans[i + 1].labelStart : rest.length;
        options.push(rest.slice(start, end).trim());
      }
      const labels = spans.map(s => s.label);
      if (options.filter(Boolean).length >= 2) return { stem: stem || s, options, labels };
      return null;
    }
    function tryParseTwoOptionsFromOr(prompt) {
      if (!prompt) return null;
      const s = String(prompt).replace(/\s+/g, ' ').trim();
      if (/(?:^|[\s(])[A-Da-d][\)\.\:]\s/.test(s)) return null;
      const parts = s.split(/\s+or\s+/i);
      if (parts.length !== 2) return null;
      const colonIdx = s.lastIndexOf(':');
      const stem = colonIdx >= 0 ? s.slice(0, colonIdx + 1).trim() : s;
      const leftSource = parts[0];
      const left = colonIdx >= 0 ? leftSource.slice(leftSource.lastIndexOf(':') + 1).trim() : leftSource.trim();
      const right = parts[1].trim();
      if (left && left.length >= 2 && right && right.length >= 2) return { stem, options: [left, right] };
      return null;
    }

    // Unicode fractions map and helpers
    const unicodeFractionMap = new Map([['½','1/2'],['⅓','1/3'],['⅔','2/3'],['¼','1/4'],['¾','3/4'],['⅕','1/5'],['⅖','2/5'],['⅗','3/5'],['⅘','4/5'],['⅙','1/6'],['⅚','5/6'],['⅛','1/8'],['⅜','3/8'],['⅝','5/8'],['⅞','7/8']]);
    function replaceUnicodeFractions(s) { let out = s; unicodeFractionMap.forEach((ascii, uni) => { out = out.replaceAll(uni, ascii); }); return out; }
    function normalizeDecimalSyntax(s) { let t = s.trim(); if (/\d/.test(t) && (t.match(/,/g)?.length === 1) && !t.includes('.')) { t = t.replace(',', '.'); } return t.replace(/(^|\s)\.(\d)/g, '$10.$2'); }
    function parseAsciiFraction(frac) { const m = frac.trim().match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/); if (!m) return null; const num = parseFloat(m[1]); const den = parseFloat(m[2]); if (!isFinite(num) || !isFinite(den) || den === 0) return null; return num / den; }
    function parseMixedFraction(s) { const m = s.trim().match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/); if (!m) return null; const w = parseFloat(m[1]); const n = parseFloat(m[2]); const d = parseFloat(m[3]); if (!isFinite(w) || !isFinite(n) || !isFinite(d) || d === 0) return null; return w + (w < 0 ? -1 : 1) * (n / d); }
    function detectPercentUnit(raw) { return /%|\bpercent\b|\bper\s*cent\b/i.test(String(raw || '')); }
    function stripPercentText(raw) { return String(raw || '').replace(/%|\bpercent\b|\bper\s*cent\b/gi, ''); }

    function unitStripForNumeric(raw) { if (raw == null) return ''; return String(raw).replace(/[£$€]/g, '').replace(/\b(cm2|cm²|m2|m²|cm|mm|m|kg|g|km|miles?|meters?|metres?|meter|metre|deg|degrees|°|hrs?|hours?|mins?|minutes?)\b/gi, '').trim(); }

    function normalizeNumericLike(raw) {
      if (raw == null) return { ok: false };
      let s = String(raw).trim();
      s = replaceUnicodeFractions(s);
      const hadPercent = detectPercentUnit(s);
      if (hadPercent) s = stripPercentText(s);
      s = normalizeDecimalSyntax(s);
      let val = parseMixedFraction(s);
      if (val == null) { const fracVal = parseAsciiFraction(s); if (fracVal != null) val = fracVal; }
      if (val == null) { const num = parseFloat(s); if (!Number.isNaN(num) && isFinite(num)) val = num; }
      if (val == null) return { ok: false };
      return { ok: true, value: val, isPercent: hadPercent };
    }

    // compareNumericAnswers (from latest, supports rounding option)
    function roundNumber(val, decimals) {
      const factor = Math.pow(10, decimals);
      return Math.round(val * factor) / factor;
    }
    function compareNumericAnswers(studentRaw, correctRaw, options = {}) {
      const { toleranceAbs = 1e-4, toleranceRel = 1e-3, percentEquivalence = 'both', rounding } = options;
      const s = normalizeNumericLike(studentRaw); const c = normalizeNumericLike(correctRaw);
      if (!s.ok || !c.ok) return { equal: false };

      // If rounding is requested, perform rounding-first equality check.
      if (rounding && Number.isFinite(rounding.decimals)) {
        const sd = rounding.decimals;
        const sv = roundNumber(s.value, sd);
        const cv = roundNumber(c.value, sd);
        if (sv === cv) return { equal: true, method: 'rounding' };
      }

      const candidates = [];
      if (s.isPercent === c.isPercent) candidates.push([s.value, c.value]);
      if ((percentEquivalence === 'both' || percentEquivalence === 'studentToPercent') && c.isPercent && !s.isPercent) candidates.push([s.value * 100, c.value]);
      if ((percentEquivalence === 'both' || percentEquivalence === 'correctToPercent') && s.isPercent && !c.isPercent) candidates.push([s.value, c.value * 100]);
      for (const [sv, cv] of candidates) {
        const diff = Math.abs(sv - cv);
        const rel = Math.abs(diff / (Math.abs(cv) > 0 ? Math.abs(cv) : 1));
        if (diff <= toleranceAbs || rel <= toleranceRel) return { equal: true, method: 'tolerance' };
      }
      return { equal: false };
    }

    function stripOuterQuotesAndEndPunct(s) { return String(s || '').replace(/^[“”"']+|[“”"']+$/g, '').replace(/[.?!]+$/g, '').trim(); }
    function stripLeadingArticles(s) { return String(s || '').replace(/^(?:an?|the)\s+/i, '').trim(); }
    const normalizeAnswer = (answer, tags = []) => {
      if (answer == null) return '';
      let s = String(answer).toLowerCase().trim().replace(/\s+/g, ' ').replace(/\b(a|an|the)\b/g, '').trim();
      return s;
    };

    // ---------- Normalization for Questions / Tests ----------
    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    function normalizeQuestion(q) {
      if (!q) return q;
      if (q._normalized) return q;
      q.question = q.question || q.text || q.prompt || q.stem || q.body || q.questionText || '';
      let raw = q.options ?? q.choices ?? [];
      const opts = [];
      if (Array.isArray(raw) && raw.length > 0) {
        if (typeof raw[0] === 'string') {
          raw.forEach((t, i) => opts.push({ id: ALPHABET[i] || String(i), text: String(t).trim() }));
        } else {
          raw.forEach((o, i) => {
            if (o == null) return;
            if (typeof o === 'string') opts.push({ id: ALPHABET[i] || String(i), text: String(o).trim() });
            else opts.push({ id: (o.id || ALPHABET[i] || String(i)), text: (o.text || o.label || String(o).trim()) });
          });
        }
      } else {
        const labeled = extractLabeledOptionsFromPrompt(q.question);
        if (labeled) labeled.options.forEach((t, i) => opts.push({ id: ALPHABET[i] || String(i), text: String(t).trim() }));
      }
      q.options = opts;
      q._isMCQ = Array.isArray(opts) && opts.length >= 2;
      let correctId = null;
      if (q.correctOptionId) correctId = String(q.correctOptionId);
      else if (q.correctAnswerLetter) correctId = String(q.correctAnswerLetter).toUpperCase();
      else if (typeof q.correctAnswer === 'number') correctId = ALPHABET[q.correctAnswer] || String(q.correctAnswer);
      else if (typeof q.answer === 'string' && /^[A-E]$/i.test(q.answer.trim())) correctId = q.answer.trim().toUpperCase();
      else if (typeof q.answer === 'string') {
        const candidate = opts.find(o => normalizeAnswer(o.text) === normalizeAnswer(q.answer));
        if (candidate) correctId = candidate.id;
      }
      q._correctOptionId = correctId;
      if (!q._isMCQ && typeof q.answer !== 'undefined') q._expectedAnswerText = q.answer;
      q._normalized = true;
      return q;
    }
    function normalizeTestPack(test) {
      if (!test) return test;
      const t = { ...test };
      t.questions = (Array.isArray(test.questions) ? test.questions : []).map(q => normalizeQuestion({ ...q }));
      t.passages = test.passages || test.materials || test.passages || [];
      return t;
    }

    // ---------- Passage helper ----------
    function getPassageForQuestion(q, test) {
      if (!q) return null;
      if (q.passageText) return String(q.passageText);
      if (q.passage) return String(q.passage);
      if (q.relatedPassageId || q.passageId) {
        const pid = q.relatedPassageId || q.passageId;
        if (test && Array.isArray(test.passages)) {
          const p = test.passages.find(x => x.id === pid || x.passageId === pid);
          if (p) return (p.text || p.passage || p).toString();
        }
      }
      const raw = String(q.question || '');
      const inlineMatch = raw.match(/^PASSAGE:\s*(?:['"])?([\s\S]*?)(?:['"])?\s*\n+/i);
      if (inlineMatch && inlineMatch[1]) return inlineMatch[1].trim();
      const quotedMatch = raw.match(/PASSAGE:\s*['"]([^'"]+)['"]/i);
      if (quotedMatch && quotedMatch[1]) return quotedMatch[1].trim();
      return null;
    }

    // ---------- Answer checking (normalized) ----------
    const isAnswerCorrectNormalized = (question, userAnswer) => {
      if (!question) return false;
      normalizeQuestion(question);
      const tags = question.tags || [];

      if (question._isMCQ) {
        if (userAnswer == null || userAnswer === '') return false;
        const u = String(userAnswer).trim();
        if (/^\d+$/.test(u)) {
          const idx = Number(u);
          const id = ALPHABET[idx] || String(idx);
          return question._correctOptionId ? id === question._correctOptionId : false;
        }
        if (/^[A-Z]$/i.test(u)) {
          return question._correctOptionId ? u.toUpperCase() === question._correctOptionId : false;
        }
        if (question.options.some(o => o.id === u)) {
          return question._correctOptionId ? u === question._correctOptionId : false;
        }
        const matched = question.options.find(o => normalizeAnswer(o.text) === normalizeAnswer(u));
        if (matched) return question._correctOptionId ? matched.id === question._correctOptionId : false;
        return false;
      }

      // numeric and text fallback
      const rounding = question.rounding || null;
      if (tags.includes('geometry') || tags.includes('percentages') || tags.includes('fractions') || tags.includes('number') || tags.includes('measures') || tags.includes('decimals')) {
        const sVal = unitStripForNumeric(userAnswer);
        const cVal = unitStripForNumeric(question.answer);
        if (compareNumericAnswers(sVal, cVal, { rounding }).equal) return true;
      }
      const sNorm = normalizeNumericLike(unitStripForNumeric(userAnswer));
      const cNorm = normalizeNumericLike(unitStripForNumeric(question.answer));
      if (sNorm.ok && cNorm.ok) {
        if (compareNumericAnswers(sNorm.value, cNorm.value, { rounding }).equal) return true;
      }
      const normalizedCorrect = normalizeAnswer(question.answer, tags);
      const normalizedUser = normalizeAnswer(userAnswer, tags);
      if (normalizedCorrect === normalizedUser) return true;
      const looseCorrect = stripLeadingArticles(stripOuterQuotesAndEndPunct(normalizedCorrect));
      const looseUser = stripLeadingArticles(stripOuterQuotesAndEndPunct(normalizedUser));
      return looseCorrect === looseUser;
    };
    const isAnswerCorrect = isAnswerCorrectNormalized;

    // ---------- Sub-Components ----------
    const LoadingSpinner = ({ message }) => (
      <div className="flex flex-col justify-center items-center h-screen bg-sky-50">
        <div className="animate-spin rounded-full h-24 w-24 border-t-4 border-b-4 border-sky-500 mb-4"></div>
        <p className="text-xl text-sky-800 font-orbitron font-bold">{message}</p>
      </div>
    );

    const NotificationManager = ({ notifications, onDismiss }) => {
      const current = notifications[0] || null;
      useEffect(() => {
        if (!current) return;
        const timer = setTimeout(() => {
            onDismiss(current.id);
        }, 3500);
        return () => clearTimeout(timer);
      }, [current?.id, onDismiss]);
      if (!current) return null;
      const bgColor = current.type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
      return (
        <div className={`notification-bar p-5 rounded-xl text-white font-bold shadow-xl text-lg transition transform ${bgColor}`}>
          {current.message}
        </div>
      );
    };

    const Modal = ({ title, message, onConfirm, onCancel, confirmText, children }) => {
      return (
        <div className="modal-backdrop">
          <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center border-4 border-sky-100">
            <h2 className="text-3xl font-bold text-sky-900 mb-4 font-orbitron">{title}</h2>
            {message && <p className="text-slate-600 font-semibold mb-8">{message}</p>}
            {children}
            <div className="flex justify-center gap-4 mt-8">
              {onCancel && <button onClick={onCancel} className="bg-slate-200 text-slate-800 font-bold py-3 px-6 rounded-xl hover:bg-slate-300">Cancel</button>}
              {onConfirm && confirmText && <button onClick={onConfirm} className={`font-bold py-3 px-6 rounded-xl text-white transition ${confirmText === 'Delete' || confirmText.includes('Reset') ? 'bg-red-500 hover:bg-red-400' : 'bg-sky-600 hover:bg-sky-500'}`}>{confirmText}</button>}
            </div>
          </div>
        </div>
      );
    };

    // Custom Mode Selector: added Speed Round quick-start
    const CustomModeSelector = ({ onStart }) => {
        const [useTimer, setUseTimer] = useState(true);
        const [useHints, setUseHints] = useState(false);
        const [shuffle, setShuffle] = useState(false);
        return (
            <div className="text-left p-4 bg-slate-50 rounded-xl mt-4 border border-slate-200">
                <h4 className="font-bold text-lg text-center mb-4 text-sky-900">Custom Settings</h4>
                <div className="space-y-4">
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Enable Timer</label><input type="checkbox" checked={useTimer} onChange={() => setUseTimer(!useTimer)} className="w-6 h-6 rounded text-sky-500" /></div>
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Enable Hints & Feedback</label><input type="checkbox" checked={useHints} onChange={() => setUseHints(!useHints)} className="w-6 h-6 rounded text-sky-500" /></div>
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Shuffle Questions</label><input type="checkbox" checked={shuffle} onChange={() => setShuffle(!shuffle)} className="w-6 h-6 rounded text-sky-500" /></div>
                </div>
                <button onClick={() => onStart({ mode: 'Custom', timer: useTimer, hints: useHints, shuffle })} className="w-full text-center p-3 mt-6 bg-purple-600 text-white hover:bg-purple-500 rounded-xl font-bold transition">Start Custom Test</button>

                <div className="mt-4 border-t pt-4">
                  <button onClick={() => onStart({ mode: 'Speed', timer: true, perQuestionTime: 60, hints: false, shuffle: true })} className="w-full text-center p-3 bg-amber-500 text-white hover:bg-amber-400 rounded-xl font-bold transition">Start Speed Round (60s per Q)</button>
                </div>
            </div>
        );
    };

    // Question Navigator with sticky behavior
    const QuestionNavigator = ({ total, current, answeredIndices, onNavigate }) => {
        return (
          <div className="sticky-navigator mb-4">
            <div className="flex flex-wrap gap-2 my-4">
                {Array.from({ length: total }, (_, i) => {
                    const isAnswered = answeredIndices.has(i);
                    const isCurrent = i === current;
                    let btnClass = 'bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50';
                    if (isCurrent) btnClass = 'bg-sky-500 text-white border-sky-600 shadow-md transform scale-110';
                    else if (isAnswered) btnClass = 'bg-sky-100 border-sky-300 text-sky-800';
                    return <button key={i} onClick={() => onNavigate(i)} className={`w-10 h-10 rounded-xl font-bold transition-all ${btnClass}`}>{i + 1}</button>;
                })}
            </div>
          </div>
        );
    };

    // ---------- AI Explanation component with "explain differently" support ----------
    const AIExplanation = ({ question, userAnswer, correctAnswer, onClose }) => {
      const [explanation, setExplanation] = useState('');
      const [loading, setLoading] = useState(true);
      const [variant, setVariant] = useState(0);

      const generate = async (variantIndex = 0) => {
        setLoading(true);
        try {
          const hasOptions = Array.isArray(question.options) && question.options.length > 0;
          const optionsText = hasOptions ? `Options: ${question.options.map((opt, i) => `${i + 1}) ${opt.text || opt}`).join(' | ')}` : '';
          const style = variantIndex === 0 ? 'Explain kindly for a 10-year-old, step-by-step.' : variantIndex === 1 ? 'Explain like you would to a friend; use a quick example.' : 'Give a short visual example and a real-world analogy.';
          const prompt = `${style} Question: ${question.question}. ${optionsText} User's answer: ${userAnswer}. Correct answer: ${correctAnswer}`;
          const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }] };
          const response = await fetch('/.netlify/functions/gemini-proxy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const data = await response.json();
          const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || data?.explanation || '';
          setExplanation(aiText.trim() || `The correct answer is ${correctAnswer}. Think about what makes this answer right.`);
        } catch (err) {
          setExplanation(`Don't worry about getting it wrong - that's how we learn! The correct answer is ${correctAnswer}.`);
        } finally { setLoading(false); }
      };

      useEffect(() => { generate(variant); }, [question, userAnswer, correctAnswer, variant]);

      if (loading) return <div className="mt-3 p-4 bg-sky-50 border border-sky-200 rounded-lg text-sky-800">Generating explanation...</div>;
      return (
        <div className="mt-3 p-4 bg-sky-50 border border-sky-200 rounded-lg">
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1"><p className="text-sky-800 text-sm">{explanation}</p></div>
            <div className="flex flex-col gap-2 ml-4">
              <button onClick={() => setVariant((v)=> (v+1)%3)} className="text-sky-600 font-bold hover:text-sky-800">🔁 Explain differently</button>
              <button onClick={onClose} className="text-sky-600 font-bold hover:text-sky-800">✕</button>
            </div>
          </div>
        </div>
      );
    };

    // ---------- Views (Dashboard, QuizView, Results, Parent, Admin, etc.) ----------
    const Dashboard = ({ userData, setView, handleSelectTest, allTests, showModal, hideModal, updateAllData, appData, showNotification }) => {
      const xpForNextLevel = (userData.level || 1) * 100;
      const xpPercent = ((userData.xp || 0) / xpForNextLevel) * 100;
      const handleAdminAccess = async () => {
          const pin = prompt("Please enter Parent PIN to access Admin Panel:");
          if (pin === null) return;
          const savedPin = userData.parentPin || "1234";
          if (isHashedPin(savedPin)) {
            const candidateHash = await hashPin(pin);
            if (candidateHash === savedPin) setView('parentDashboard');
            else alert("Incorrect PIN.");
          } else {
            // legacy plaintext: check direct then upgrade
            if (pin === savedPin) {
              // upgrade
              const newHash = await hashPin(savedPin);
              updateAllData(prev => ({ ...prev, userData: { ...prev.userData, parentPin: newHash } }));
              setView('parentDashboard');
            } else alert("Incorrect PIN.");
          }
      };

      const handleDailyChallenge = () => {
        let allQuestions = allTests.filter(t => t.id !== 'daily-challenge' && t.id !== 'mistakes-test').flatMap(t => t.questions);
        if(allQuestions.length < 5) return showNotification({message: "Not enough questions for a challenge yet!", type: "error"});
        const dailyQs = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 5);
        const challenge = { id: 'daily-challenge', title: 'Daily Challenge', subject: 'Mixed', questions: dailyQs };
        updateAllData(prev => ({ ...prev, allTests: [...prev.allTests.filter(t => t.id !== 'daily-challenge'), normalizeTestPack(challenge)] }));
        handleSelectTest('daily-challenge', true);
      };

      const handlePracticeMistakes = () => {
        const mistakes = []; const seen = new Set();
        Object.entries(userData.progress || {}).forEach(([tid, pData]) => {
          if (tid === 'mistakes-test') return;
          const test = allTests.find(t => t.id === tid);
          if (!test) return;
          Object.entries(pData.answers || {}).forEach(([qIdxStr, ua]) => {
            const qIdx = Number(qIdxStr); const q = test.questions[qIdx];
            if (q && !isAnswerCorrect(q, ua) && !seen.has(q.question)) { mistakes.push({ ...q, originalTestId: tid, originalQIndex: qIdx }); seen.add(q.question); }
          });
        });
        if (mistakes.length === 0) { showNotification({message: "No mistakes to practice. Great job!", type: "success"}); return; }
        const mistakesTest = normalizeTestPack({ id: 'mistakes-test', title: 'Practice Your Mistakes', subject: 'Mixed', questions: mistakes });
        updateAllData(prev => ({ ...prev, allTests: [...prev.allTests.filter(t => t.id !== 'mistakes-test'), mistakesTest] }));
        handleSelectTest('mistakes-test', true);
      };

      const hasMistakes = Object.values(userData.progress || {}).some(p => p.completedAt && (p.score || 0) < Object.keys(p.answers || {}).length);
      const level1Tests = allTests.filter(t => t.level === 1 && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const level2Tests = allTests.filter(t => t.level === 2 && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const level3Tests = allTests.filter(t => (t.level === 3 || t.id.includes('full') || t.id.includes('seag')) && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const uncategorizedTests = allTests.filter(t => !t.level && !t.id.includes('full') && !t.id.includes('seag') && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const bossTests = allTests.filter(t => t.isBoss);
      const overrideUnlock = !!userData.overrideUnlockAllLevels;
      const userLevel = userData.level || 1;
      const canAccessLevel2 = overrideUnlock || userLevel >= 2;
      const canAccessLevel3 = overrideUnlock || userLevel >= 3;
      const testsThisWeekData = Object.entries(userData.progress || {})
        .filter(([id, p]) => id !== 'daily-challenge' && id !== 'mistakes-test' && p.completedAt && (Date.now() - p.completedAt) < 7 * 24 * 60 * 60 * 1000)
        .map(([id, p]) => {
            const test = allTests.find(t => t.id === id);
            return { score: p.score, total: test ? test.questions.length : 0 };
        });

      const testsThisWeekCount = testsThisWeekData.length;
      let thisWeekScore = 0; let thisWeekTotal = 0;
      testsThisWeekData.forEach(t => { thisWeekScore += t.score; thisWeekTotal += t.total; });
      const thisWeekAccuracy = thisWeekTotal > 0 ? Math.round((thisWeekScore / thisWeekTotal) * 100) : 0;

      const renderTestCard = (test) => {
          const progress = userData.progress?.[test.id];
          const answered = progress ? Object.keys(progress.answers || {}).length : 0;
          const total = test.questions.length;
          const pct = total > 0 ? (answered / total) * 100 : 0;
          return (
            <div key={test.id} className="bg-white border-2 border-slate-100 rounded-3xl p-6 shadow-md hover:shadow-xl hover:border-sky-300 transition flex flex-col justify-between">
              <div>
                <h3 className="text-xl font-bold text-sky-900 mb-2 font-orbitron">{test.title}</h3>
                <p className="text-slate-500 font-bold mb-4">{test.subject} • {total} Qs</p>
                <div className="w-full bg-slate-100 rounded-full h-3 mb-2"><div className="bg-emerald-400 h-3 rounded-full" style={{ width: `${pct}%` }}></div></div>
                <p className="text-sm font-bold text-slate-400 mb-6">{answered} / {total} answered</p>
              </div>
              <button onClick={() => handleSelectTest(test.id)} className="w-full bg-sky-600 text-white font-bold py-3 rounded-xl hover:bg-sky-500 shadow-md text-lg transition">{answered > 0 && answered < total ? 'Continue Test' : 'Start Test'}</button>
            </div>
          );
      };

      return (
        <div className="p-4 sm:p-10 max-w-7xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
            <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 flex items-center font-orbitron">
              <span className="text-6xl mr-4">{userData.avatar || '👨‍🚀'}</span>
              Welcome, {userData.name}!
            </h1>
            <div className="flex gap-3">
              <button onClick={() => setView('settings')} className="bg-white border-2 border-slate-200 text-slate-600 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-slate-50 transition">Profile</button>
              <button onClick={() => setView('achievements')} className="bg-yellow-400 text-yellow-900 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-yellow-300 transition">Achievements</button>
              <button onClick={handleAdminAccess} className="bg-slate-200 text-slate-700 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-slate-300 transition">⚙️ Parents</button>
            </div>
          </div>

          <div className="bg-white border-2 border-sky-100 rounded-3xl p-6 mb-10 shadow-lg">
            <div className="flex justify-between items-center mb-3 font-orbitron">
              <span className="font-bold text-sky-700 text-2xl">Level {userData.level || 1} {userData.title && <span className="ml-3 text-lg bg-amber-100 text-amber-800 px-4 py-1 rounded-full font-sans">{userData.title}</span>}</span>
              <span className="text-lg text-slate-500 font-bold">{userData.xp || 0} / {xpForNextLevel} XP</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-6 border border-slate-200 overflow-hidden">
              <div className="bg-gradient-to-r from-sky-400 to-indigo-500 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(100, Math.max(0, xpPercent))}%` }}></div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition flex flex-col">
              <div className="flex justify-between items-start mb-4">
                <h2 className="text-3xl font-bold font-orbitron">Daily Challenge</h2>
                <div className="text-center bg-white/20 px-4 py-2 rounded-xl">
                  <div className="text-2xl mb-1">🔥</div>
                  <div className="font-bold">{userData.dailyChallengeStreak || 0} Day</div>
                </div>
              </div>
              <p className="text-xl opacity-90 mb-8 font-semibold">A quick 5-question warmup!</p>
              <div className="mt-auto">
                  {userData.dailyChallenge?.completedToday ? (
                    <div className="w-full bg-white/20 text-center font-bold py-4 rounded-xl text-xl">Complete! See you tomorrow.</div>
                  ) : (
                    <button onClick={handleDailyChallenge} className="w-full bg-white text-purple-700 font-bold py-4 px-6 rounded-xl hover:bg-slate-100 shadow-lg text-xl transition">Start Challenge</button>
                  )}
              </div>
            </div>
            <div className="bg-gradient-to-br from-amber-400 to-orange-500 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition flex flex-col">
              <h2 className="text-3xl font-bold mb-2 font-orbitron">Review Mistakes</h2>
              <p className="opacity-90 text-lg mb-6">Turn past errors into strengths.</p>
              <div className="relative group mt-auto">
                  <button onClick={handlePracticeMistakes} disabled={!hasMistakes} className="w-full bg-white text-orange-600 font-bold py-4 px-6 rounded-xl hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg text-xl transition">Practice Mistakes</button>
                  {!hasMistakes && <p className="absolute text-center w-full mt-2 text-sm font-bold opacity-80">You don't have any mistakes yet!</p>}
              </div>
            </div>
            <div className="bg-gradient-to-br from-emerald-400 to-teal-500 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition flex flex-col">
              <h2 className="text-3xl font-bold mb-2 font-orbitron">This Week</h2>
              <p className="opacity-90 text-lg mb-6">Your progress over the last 7 days.</p>
              <div className="flex justify-between items-center bg-white/20 p-4 rounded-xl mt-auto">
                  <div className="text-center"><p className="text-sm uppercase tracking-wider font-bold opacity-80">Tests</p><p className="text-3xl font-black">{testsThisWeekCount}</p></div>
                  <div className="text-center"><p className="text-sm uppercase tracking-wider font-bold opacity-80">Accuracy</p><p className="text-3xl font-black">{thisWeekAccuracy}%</p></div>
              </div>
            </div>
          </div>

          {/* LEARNING JOURNEY MAP */}
          <div className="space-y-16 pl-4 md:pl-8 border-l-8 border-sky-200">
              <div className="relative">
                <div className="absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 bg-emerald-500 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md">1</div>
                  <div className="ml-8 md:ml-12">
                    <h2 className="text-3xl font-bold text-emerald-700 mb-2 font-orbitron">Level 1: Confidence Builder</h2>
                    <p className="text-lg text-slate-500 font-semibold mb-6">Early P6 • Shorter, topic-focused questions.</p>
                    {level1Tests.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{level1Tests.map(renderTestCard)}</div>
                    ) : <div className="bg-slate-50 border-2 border-dashed border-slate-200 p-8 rounded-3xl text-center"><p className="text-slate-500 font-bold">No tests loaded yet. Import tests via Admin → Import JSON.</p></div>}
                  </div>
              </div>

              <div className="relative">
                  <div className={`absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md ${canAccessLevel2 ? 'bg-amber-500' : 'bg-slate-300'}`}>{canAccessLevel2 ? '2' : '🔒'}</div>
                  <div className="ml-8 md:ml-12">
                    <h2 className={`text-3xl font-bold mb-2 font-orbitron ${canAccessLevel2 ? 'text-amber-700' : 'text-slate-400'}`}>Level 2: Skill Development</h2>
                    <p className="text-lg text-slate-500 font-semibold mb-6">Mid P6 • Mixed curriculum & 5-option MCQs.</p>
                    {canAccessLevel2 ? (
                    level2Tests.length > 0 ? <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{level2Tests.map(renderTestCard)}</div> : <div className="bg-slate-50 border-2 border-dashed border-slate-200 p-8 rounded-3xl text-center"><p className="text-slate-500 font-bold">No tests loaded yet. Import tests via Admin → Import JSON.</p></div>
                    ) : (
                    <div className="bg-slate-50 border-2 border-slate-200 p-8 rounded-3xl text-center opacity-60"><p className="text-slate-500 font-bold text-xl">Reach Level 2 to unlock these challenges!</p></div>
                    )}
                  </div>
              </div>

              <div className="relative">
                  <div className={`absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md ${canAccessLevel3 ? 'bg-red-500' : 'bg-slate-300'}`}>{canAccessLevel3 ? '3' : '🔒'}</div>
                  <div className="ml-8 md:ml-12">
                    <h2 className={`text-3xl font-bold mb-2 font-orbitron ${canAccessLevel3 ? 'text-red-700' : 'text-slate-400'}`}>Level 3: Exam Standard</h2>
                    <p className="text-lg text-slate-500 font-semibold mb-6">End P6 / P7 • Full SEAG timing & mock papers.</p>
                    {canAccessLevel3 ? (
                    level3Tests.length > 0 ? <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{level3Tests.map(renderTestCard)}</div> : <div className="bg-slate-50 border-2 border-dashed border-slate-200 p-8 rounded-3xl text-center"><p className="text-slate-500 font-bold">No tests loaded yet. Import tests via Admin → Import JSON.</p></div>
                    ) : (
                    <div className="bg-slate-50 border-2 border-slate-200 p-8 rounded-3xl text-center opacity-60"><p className="text-slate-500 font-bold text-xl">Reach Level 3 to unlock mock exams!</p></div>
                    )}
                  </div>
              </div>

              {canAccessLevel3 && bossTests.length > 0 && (
                <div className="relative mt-16 p-8 border-4 border-red-500 bg-red-50 rounded-3xl shadow-2xl">
                    <div className="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-red-600 text-white font-bold px-6 py-2 rounded-full font-orbitron text-xl shadow-md animate-pulse">ELITE STAGE</div>
                    <h2 className="text-4xl font-black text-red-700 text-center mb-6 font-orbitron">Boss Challenges</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {bossTests.map(test => {
                    const p = userData.progress?.[test.id];
                    const ans = p ? Object.keys(p.answers||{}).length : 0;
                    const tot = test.questions.length;
                    return (
                    <div key={test.id} className="bg-white border-4 border-red-200 rounded-2xl p-6 shadow-md text-center">
                    <h3 className="text-2xl font-bold text-red-900 mb-2 font-orbitron">{test.title}</h3>
                    <p className="text-slate-600 font-bold mb-4">{tot} Extra Hard Questions</p>
                    <button onClick={() => handleSelectTest(test.id)} className="bg-red-600 text-white font-black py-3 px-8 rounded-xl hover:bg-red-500 shadow-md w-full">{ans>0&&ans<tot?'Continue':'Fight Boss'}</button>
                    </div>
                    );
                    })}
                    </div>
                  </div>
              )}

              {uncategorizedTests.length > 0 && (
                  <div className="relative">
                    <div className="absolute -left-[2.1rem] md:-left-[2.6rem] top-0 w-12 h-12 md:w-14 md:h-14 bg-slate-400 rounded-full border-4 border-white flex items-center justify-center text-white font-bold text-xl md:text-2xl shadow-md">?</div>
                    <div className="ml-8 md:ml-12">
                    <h2 className="text-3xl font-bold text-slate-600 mb-2 font-orbitron">Extra Practice</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {uncategorizedTests.map(renderTestCard)}
                    </div>
                    </div>
                  </div>
              )}
          </div>

          <div className="fixed bottom-6 right-6 flex flex-col gap-3">
            <button onClick={() => setView('shop')} className="bg-white border rounded-full p-4 shadow-lg">🏬 Shop</button>
            <button onClick={() => setView('breathe')} className="bg-white border rounded-full p-4 shadow-lg">🧘 Breathe</button>
          </div>
        </div>
      );
    };

    // ---------- QuizView updated with Speed mode and passage modal ----------
    const QuizView = ({ userData, testDetails, setView, allTests, updateUserData, showNotification, showModal }) => {
      const { id: testId, settings } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const existingProgress = userData?.progress?.[testId] || {};

      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(existingProgress?.lastQuestionIndex || 0);
      const [userAnswers, setUserAnswers] = useState(existingProgress?.answers || {});
      const [submittedAnswers, setSubmittedAnswers] = useState(existingProgress?.submittedAnswers || {});
      const [streak, setStreak] = useState(existingProgress?.streak || 0);
      const [hint, setHint] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [lastAnswerResult, setLastAnswerResult] = useState(null);
      const [shuffledOrder, setShuffledOrder] = useState(null);
      const [showPassage, setShowPassage] = useState(false);

      const timerEnabled = settings.mode === 'Test' || (settings.mode === 'Custom' && settings.timer) || settings.mode === 'Speed';
      const timeLimitMsTotal = settings.mode === 'Test' ? (test && test.isBoss ? 20 * 60 * 1000 : 45 * 60 * 1000) : 0;
      const perQuestionTimeMs = settings.mode === 'Speed' ? ((settings.perQuestionTime || 60) * 1000) : 0;

      const questionStartTimeRef = useRef(Date.now());
      const accumulatedElapsedMsRef = useRef(existingProgress?.accumulatedElapsedMs || 0);
      const [displayTime, setDisplayTime] = useState(timeLimitMsTotal > 0 ? timeLimitMsTotal : (existingProgress?.accumulatedElapsedMs || 0));
      const [flash, setFlash] = useState(null);
      const [feedback, setFeedback] = useState(null);

      // shuffle handling
      useEffect(() => {
        if (!test) return;
        if (settings.shuffle && !existingProgress.shuffledOrder) {
            const indices = Array.from(Array(test.questions.length).keys());
            for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
            setShuffledOrder(indices);
            updateUserData(prev => ({ progress: { ...prev.progress, [testId]: { ...(prev.progress?.[testId] || {}), shuffledOrder: indices, settings } } }), { event: { type: 'NO_OP' } });
        } else if (existingProgress.shuffledOrder) {
            setShuffledOrder(existingProgress.shuffledOrder);
        }
      }, [test]);

      // Timer handling (supports total test timer and per-question Speed mode)
      useEffect(() => {
        if (!timerEnabled) return;
        // set initial display time
        if (settings.mode === 'Speed') {
          // set per-question countdown
          setDisplayTime(perQuestionTimeMs);
          questionStartTimeRef.current = Date.now();
        } else {
          setDisplayTime(timeLimitMsTotal > 0 ? Math.max(0, timeLimitMsTotal - accumulatedElapsedMsRef.current) : accumulatedElapsedMsRef.current);
        }
        const interval = setInterval(() => {
            const now = Date.now();
            const elapsedSinceStart = now - questionStartTimeRef.current;
            if (settings.mode === 'Speed') {
              const remain = Math.max(0, perQuestionTimeMs - elapsedSinceStart);
              setDisplayTime(remain);
              // auto-submit when 0
              if (remain <= 50) {
                // if not submitted for the current question, auto-submit blank/answer
                if (!submittedAnswers[currentQuestionIndex]) {
                  if (userAnswers[currentQuestionIndex] !== undefined && userAnswers[currentQuestionIndex] !== '') handleSubmitAnswer(userAnswers[currentQuestionIndex]);
                  else handleSubmitAnswer('');
                }
              }
            } else {
              const elapsed = accumulatedElapsedMsRef.current + (now - questionStartTimeRef.current);
              setDisplayTime(timeLimitMsTotal > 0 ? Math.max(0, timeLimitMsTotal - elapsed) : elapsed);
            }
        }, 250);
        return () => clearInterval(interval);
      }, [timerEnabled, perQuestionTimeMs, settings.mode, currentQuestionIndex, submittedAnswers, userAnswers]);

      const commitElapsed = () => { const now = Date.now(); const delta = now - questionStartTimeRef.current; accumulatedElapsedMsRef.current += delta; questionStartTimeRef.current = now; return delta; };

      const calculateScore = () => { return Object.entries(userAnswers).reduce((acc, [idx, ua]) => acc + (isAnswerCorrect(test.questions[idx], ua) ? 1 : 0), 0); };

      const saveProgress = (isFinished = false, overrideIndex) => {
        const score = calculateScore();
        const currentElapsed = accumulatedElapsedMsRef.current + (Date.now() - questionStartTimeRef.current);
        // IMPORTANT: store only metadata and answers (do NOT embed the questions themselves)
        const pEntry = { answers: userAnswers, lastQuestionIndex: typeof overrideIndex === 'number' ? overrideIndex : currentQuestionIndex, score, accumulatedElapsedMs: currentElapsed, streak, settings, submittedAnswers, ...(shuffledOrder && { shuffledOrder }), ...(isFinished ? { completedAt: Date.now() } : {}) };
        updateUserData(prev => ({ progress: { ...prev.progress, [testId]: pEntry } }), {
            event: isFinished ? { type: 'PACK_COMPLETED', payload: { finishedTestId: testId, totalQuestions: test.questions.length, score, mode: settings.mode, initialTotalTime: timeLimitMsTotal, timeLeft: timeLimitMsTotal > 0 ? Math.max(0, timeLimitMsTotal - currentElapsed) : 0, testHasGeometry: test.questions.some(q => (q.tags || []).includes('geometry')), lastQuestionCorrect: isAnswerCorrect(test.questions[(shuffledOrder ? shuffledOrder[test.questions.length - 1] : (test.questions.length - 1))], userAnswers[(shuffledOrder ? shuffledOrder[test.questions.length - 1] : (test.questions.length - 1))]), isFullPractice: testId.includes('full') || testId.includes('seag') || testId.includes('boss'), isDailyChallenge: testId === 'daily-challenge', finishedAt: Date.now() } } : undefined
        });
      };

      const originalIndex = shuffledOrder ? shuffledOrder[currentQuestionIndex] : currentQuestionIndex;
      const showInstantFeedback = settings.mode === 'Practice' || (settings.mode === 'Custom' && settings.hints);
      const navigateToQuestion = (idx) => { if (!test) return; if (idx >= 0 && idx < test.questions.length) { commitElapsed(); setFeedback(null); setHint(null); setShowExplanation(false); setLastAnswerResult(null); setCurrentQuestionIndex(idx); questionStartTimeRef.current = Date.now(); saveProgress(false, idx); } };
      const goToNext = () => navigateToQuestion(currentQuestionIndex + 1);

      const handleAnswerSelect = (answer, isTextarea = false) => {
        if (submittedAnswers[currentQuestionIndex]) return;
        setUserAnswers(prev => ({ ...prev, [originalIndex]: answer }));

        if (showInstantFeedback && !submittedAnswers[currentQuestionIndex] && !isTextarea) {
            setTimeout(() => handleSubmitAnswer(answer), 0);
        }
      };

      const handleSubmitAnswer = (ansOverride) => {
        if (!test) return;
        const answer = typeof ansOverride !== 'undefined' ? ansOverride : userAnswers[originalIndex];
        if (answer === undefined || answer === null) return;
        setSubmittedAnswers(prev => ({ ...prev, [currentQuestionIndex]: true }));
        const deltaMs = commitElapsed();
        const question = test.questions[originalIndex];
        const isCorrect = isAnswerCorrect(question, answer);

        setLastAnswerResult({ isCorrect, userAnswer: answer, question });
        updateUserData({}, { event: { type: 'ANSWER_SUBMITTED', payload: { correct: isCorrect, timeToAnswer: deltaMs/1000, usedHint: !!hint, tags: question.tags || [], wasReviewed: testId === 'mistakes-test', mode: settings.mode, testId } }});

        setStreak(isCorrect ? streak + 1 : 0);
        playSound(isCorrect ? 'correct' : 'incorrect', userData.soundEnabled !== false);
        // micro-feedback
        if (showInstantFeedback) {
            setFlash(isCorrect ? 'correct' : 'incorrect');
            let feedbackMsg = isCorrect ? "Correct! Great job!" : `Not quite. The correct answer is: ${question._isMCQ && question._correctOptionId ? (question.options.find(o => o.id === question._correctOptionId)?.text || question.answer) : question.answer}`;
            setFeedback(feedbackMsg);
            setTimeout(() => setFlash(null), 800);
        } else {
            if (currentQuestionIndex < test.questions.length - 1) setTimeout(goToNext, 300);
        }
        // Save progress after answer
        saveProgress(false);
      };

      const handleFinish = () => {
        commitElapsed();
        saveProgress(true);
        // award stars based on score (simple formula)
        const score = calculateScore();
        const total = test.questions.length || 1;
        const starsEarned = Math.max(0, Math.round((score / total) * 5));
        updateUserData(prev => ({ stars: (prev.stars || 0) + starsEarned }), { event: { type: 'NO_OP' }});
        if (testId === 'mistakes-test') {
          showNotification({ message: `Mistakes reviewed! You earned ${starsEarned} ★`, type: "success" });
          setView('dashboard');
        } else {
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          setView('results');
        }
      };

      const handleExit = () => {
        if (settings.mode === 'Test') {
            showModal({ title: "Exit Test?", message: "Your timer will keep running in the background if you leave now.", confirmText: "Exit", onConfirm: () => { commitElapsed(); saveProgress(false); setView('dashboard'); } });
        } else { commitElapsed(); saveProgress(false); setView('dashboard'); }
      }

      const fetchHint = () => { setHint("Try re-reading the question carefully and break it into steps."); };

      if (!test || (settings.shuffle && !shuffledOrder)) return <LoadingSpinner message="Loading Test..." />;

      const currentQ = test.questions[originalIndex];
      normalizeQuestion(currentQ);
      const isSubmitted = !!submittedAnswers[currentQuestionIndex];
      const passageText = getPassageForQuestion(currentQ, test);
      const optObjs = Array.isArray(currentQ.options) && currentQ.options.length ? currentQ.options : null;
      const isFreeResponse = !optObjs;
      const answeredSet = new Set(Object.keys(submittedAnswers).map(Number));

      return (
        <div className={`min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center transition-colors duration-300 ${flash ? `flash-${flash}` : ''}`}>
          <div className="bg-white border-2 border-slate-100 rounded-3xl shadow-xl p-6 sm:p-10 w-full max-w-4xl relative">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl sm:text-3xl font-bold text-sky-900 font-orbitron">{test.title}</h2>
              {streak >= 1 && <span className={`font-bold text-orange-500 ${streak >= 3 ? 'text-2xl animate-pulse' : 'text-lg'}`}>🔥 {streak} Streak!</span>}
              {timerEnabled && <div className={`text-xl font-orbitron px-4 py-2 rounded-xl font-bold border-2 flex items-center gap-2 ${timeLimitMsTotal > 0 && displayTime < 30000 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>{settings.mode === 'Speed' ? '⏱️ ' : (timeLimitMsTotal > 0 ? '⏱️ ' : '')}{settings.mode === 'Speed' ? `${Math.ceil(displayTime/1000)}s` : formatTime(displayTime)}</div>}
            </div>

            <QuestionNavigator total={test.questions.length} current={currentQuestionIndex} answeredIndices={answeredSet} onNavigate={navigateToQuestion} />

            <div className="mb-6 bg-sky-50 rounded-2xl p-6 border border-sky-100 shadow-sm min-h-[8rem]">
              <div className="flex justify-between items-start">
                <div>
                  <p className="text-slate-500 font-bold mb-2 uppercase tracking-wide text-sm">Question {currentQuestionIndex + 1} of {test.questions.length}</p>
                  <p className="text-2xl text-slate-800 whitespace-pre-wrap font-semibold leading-relaxed">{currentQ.question}</p>
                </div>
                {passageText && (
                  <div className="ml-4">
                    <button onClick={() => setShowPassage(true)} className="bg-white border-2 border-slate-200 px-4 py-2 rounded-xl font-bold hover:bg-slate-50">Read passage</button>
                  </div>
                )}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              {optObjs ? optObjs.map((opt, i) => {
                const optId = opt.id;
                const optText = opt.text;
                const checked = userAnswers[originalIndex] === optId;
                return (
                  <button key={optId} onClick={() => handleAnswerSelect(optId, false)} disabled={isSubmitted} className={`p-5 rounded-2xl border-2 text-left text-xl font-bold transition-all min-h-[70px] ${checked ? 'bg-sky-100 border-sky-500 text-sky-900 shadow-md transform scale-[1.02]' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300'} ${isSubmitted ? 'opacity-60 cursor-not-allowed' : ''}`}>
                    <div className="flex items-start gap-4"><div className="uppercase text-sky-700 font-bold mr-2">{optId})</div><div className="text-left">{optText}</div></div>
                  </button>
                );
              }) : (
                <textarea value={userAnswers[originalIndex] || ''} onChange={(e) => handleAnswerSelect(e.target.value, true)} disabled={isSubmitted} className="w-full col-span-2 p-5 text-xl font-bold border-2 border-slate-200 rounded-2xl focus:border-sky-500 outline-none resize-none bg-white" placeholder="Type your answer here..." rows="4" />
              )}
            </div>

            {!isSubmitted && (!showInstantFeedback || isFreeResponse) && (
              <div className="text-center my-6">
                <button onClick={() => handleSubmitAnswer()} disabled={typeof userAnswers[originalIndex] === 'undefined' || userAnswers[originalIndex] === ''} className="bg-emerald-500 text-white font-bold py-3 px-10 rounded-xl hover:bg-emerald-400 disabled:opacity-50 text-xl shadow-lg transition transform hover:-translate-y-0.5">Submit Answer</button>
              </div>
            )}

            {showInstantFeedback && (
              <div className="my-4 text-center">
                {hint ? <div className="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-lg font-semibold">{hint}</div> : <button onClick={fetchHint} className="text-sky-600 font-bold hover:text-sky-800 text-lg">💡 Need a hint?</button>}
              </div>
            )}

            {feedback && <div aria-live="polite" className={`p-5 rounded-xl text-xl font-bold mb-6 text-center shadow-sm border ${feedback.includes('Correct') ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>{feedback}</div>}

            {lastAnswerResult && !lastAnswerResult.isCorrect && showInstantFeedback && !showExplanation && (
              <div className="text-center">
                <button onClick={() => setShowExplanation(true)} className="mt-2 px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-200 border border-slate-300 transition">🤖 Explain my mistake</button>
              </div>
            )}
            {showExplanation && <AIExplanation question={lastAnswerResult.question} userAnswer={lastAnswerResult.userAnswer} correctAnswer={lastAnswerResult.question._isMCQ && lastAnswerResult.question._correctOptionId ? (lastAnswerResult.question.options.find(o=>o.id===lastAnswerResult.question._correctOptionId)?.text || lastAnswerResult.question.answer) : lastAnswerResult.question.answer} onClose={() => setShowExplanation(false)} />}

            <div className="flex justify-between items-center mt-10 pt-6 border-t-2 border-slate-100">
              <button onClick={handleExit} className="text-slate-500 font-bold hover:text-slate-800 text-lg px-4 py-2 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Exit & Save</button>
              {currentQuestionIndex < test.questions.length - 1 ? (
                <button onClick={goToNext} disabled={!isSubmitted && showInstantFeedback} className="bg-sky-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-sky-500 disabled:opacity-50 text-xl shadow-md transition">Next Question →</button>
              ) : (
                <button onClick={handleFinish} disabled={!isSubmitted && showInstantFeedback} className="bg-purple-600 text-white font-bold py-3 px-10 rounded-xl hover:bg-purple-500 disabled:opacity-50 text-xl shadow-md transition transform hover:-translate-y-1">Finish Test 🏆</button>
              )}
            </div>
          </div>

          {/* Passage Modal */}
          {showPassage && (
            <div className="modal-backdrop">
              <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-3xl text-left border-4 border-sky-100 max-h-[80vh] overflow-auto">
                <div className="flex justify-between items-start mb-4">
                  <h3 className="text-2xl font-bold font-orbitron text-sky-900">Passage</h3>
                  <button onClick={() => setShowPassage(false)} className="text-sky-600 font-bold hover:text-sky-800">✕</button>
                </div>
                <div className="prose prose-lg text-slate-800 whitespace-pre-wrap">
                  {passageText}
                </div>
                <div className="flex justify-end mt-6">
                  <button onClick={() => setShowPassage(false)} className="bg-slate-100 px-4 py-2 rounded-xl font-bold hover:bg-slate-200">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ---------- ResultsView ----------
    const ResultsView = ({ userData, setView, testDetails, allTests, updateUserData, handleSelectTest }) => {
      const { id: testId } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const progress = userData.progress?.[testId];
      if (!test || !progress) { setView('dashboard'); return null; }

      const score = progress.score || 0;
      const total = test.questions.length;
      const pct = total > 0 ? Math.round((score/total)*100) : 0;

      let band = null;
      if (total >= 10) {
          if (pct >= 85) band = "Band 1";
          else if (pct >= 75) band = "Band 2";
          else if (pct >= 65) band = "Band 3";
          else if (pct >= 55) band = "Band 4";
          else if (pct >= 45) band = "Band 5";
          else band = "Band 6";
      }
      const handleTryAgain = () => {
          updateUserData(prev => {
              const newProgress = { ...prev.progress };
              delete newProgress[testId];
              return { progress: newProgress };
          }, { event: { type: 'NO_OP' } });
          setView('dashboard');
          setTimeout(() => handleSelectTest(testId), 50);
      };
      return (
        <div className="p-8 min-h-screen">
          <div className="max-w-4xl mx-auto bg-white border-2 border-slate-100 rounded-3xl shadow-xl p-10 text-center relative overflow-hidden">
            <h2 className="text-5xl font-bold text-sky-900 font-orbitron mb-6 relative z-10">Test Complete!</h2>
            <div className="inline-block bg-sky-50 border-2 border-sky-200 rounded-3xl p-8 mb-6 relative z-10 shadow-inner">
                <p className="text-3xl text-sky-800 font-bold">You scored</p>
                <p className="text-6xl font-black text-amber-500 my-4">{score} <span className="text-4xl text-sky-800 opacity-50">/ {total}</span></p>
                <p className="text-xl text-sky-700 font-bold bg-white px-4 py-1 rounded-full inline-block">{pct}% Accuracy</p>
            </div>

            {band && (
                <div className="mb-10 bg-purple-100 border-2 border-purple-300 rounded-2xl p-6 text-purple-900 shadow-sm inline-block max-w-lg mx-auto relative z-10">
                    <h3 className="text-2xl font-bold font-orbitron mb-2">Estimated SEAG Band</h3>
                    <p className="text-4xl font-black">{band}</p>
                    <p className="text-sm font-semibold mt-2 opacity-80">{total < 40 ? "*(Based on a partial paper)*" : "This is a rough estimate based on standard past paper curves."}</p>
                </div>
            )}

            <div className="space-y-4 text-left mt-8 relative z-10">
                {(progress.shuffledOrder || Array.from(test.questions.keys())).map((originalIndex, displayIndex) => {
                    const actualQuestion = test.questions[originalIndex];
                    const userAnswer = progress.answers[originalIndex];
                    const isCorr = isAnswerCorrect(actualQuestion, userAnswer);
                    return (
                    <div key={displayIndex} className={`p-5 rounded-2xl border-l-8 shadow-sm ${isCorr ? 'bg-emerald-50 border-emerald-500' : 'bg-red-50 border-red-500'}`}>
                    <p className="font-bold text-slate-800 mb-2">{displayIndex+1}. {actualQuestion.question}</p>
                    <p className={`font-semibold ${isCorr ? 'text-emerald-700' : 'text-red-700'}`}>Your answer: {userAnswer || 'Blank'}</p>
                    {!isCorr && <p className="font-bold text-slate-700 mt-1">Correct answer: {actualQuestion.answer}</p>}
                    </div>
                    );
                })}
            </div>

            <div className="mt-10 flex flex-col sm:flex-row gap-4 justify-center relative z-10">
                <button onClick={handleTryAgain} className="w-full sm:w-auto bg-slate-200 text-slate-700 font-bold py-4 px-10 rounded-2xl hover:bg-slate-300 text-xl shadow-md transition">Try Again</button>
                <button onClick={() => setView('dashboard')} className="w-full sm:w-auto bg-sky-600 text-white font-bold py-4 px-12 rounded-2xl hover:bg-sky-500 text-2xl shadow-lg transition transform hover:-translate-y-1">Return to Dashboard</button>
            </div>
          </div>
        </div>
      );
    };

    // ---------- Parent Dashboard (with Print Report) ----------
    const ParentDashboardView = ({ userData, setView, allTests, updateAllData }) => {
      const completedTests = Object.entries(userData.progress||{}).map(([id, p]) => { const t = allTests.find(x=>x.id===id); return (t && Object.keys(p.answers||{}).length === t.questions.length) ? {...t, score: p.score, date: p.completedAt, mode: p.settings?.mode} : null; }).filter(Boolean).sort((a,b) => b.date - a.date);

      let totalQs = 0; let totalCorr = 0;
      completedTests.forEach(t => { totalQs += t.questions.length; totalCorr += t.score; });
      const overallAcc = totalQs > 0 ? Math.round((totalCorr / totalQs) * 100) : 0;
      const overrideOn = !!userData?.overrideUnlockAllLevels;

      const printReport = () => {
        const w = window.open('', '_blank', 'noopener');
        const date = new Date().toLocaleString();
        let html = `<html><head><title>Progress Report - ${userData.name}</title><style>body{font-family:Arial, sans-serif;padding:20px;color:#0f172a} .header{display:flex;justify-content:space-between;align-items:center} .card{border:1px solid #e6eef8;padding:12px;margin:8px 0;border-radius:10px}</style></head><body><div class="header"><h1>Progress Report: ${userData.name}</h1><div>${date}</div></div><p><strong>Overall Accuracy:</strong> ${overallAcc}%</p><p><strong>Total Attempts:</strong> ${userData.totalAttempts || 0}</p><hr/>`;
        html += `<h2>Recent Tests</h2>`;
        if (completedTests.length > 0) {
          completedTests.slice(0,20).forEach(t => {
            html += `<div class="card"><strong>${t.title}</strong><div>Score: ${t.score} / ${t.questions.length} (${Math.round((t.score/t.questions.length)*100)}%)</div><div>Date: ${t.date ? new Date(t.date).toLocaleString() : 'Unknown'}</div></div>`;
          });
        } else {
          html += `<p>No tests completed yet.</p>`;
        }
        html += `<hr/><p>Generated by SEAG Portal</p></body></html>`;
        w.document.write(html);
        w.document.close();
        setTimeout(() => { w.print(); }, 500);
      };

      return (
        <div className="p-4 sm:p-8 max-w-5xl mx-auto min-h-screen">
            <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
                <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 font-orbitron">Parent Dashboard</h1>

                <div className="flex items-center gap-4 flex-wrap">
                <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-slate-200">
                <button onClick={() => { updateAllData(prev => ({ ...prev, userData: { ...prev.userData, overrideUnlockAllLevels: !overrideOn } })); }} className={`font-bold py-2 px-4 rounded-xl ${overrideOn ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-700'}`}>
                {overrideOn ? 'Disable: Unlock All' : 'Unlock All Levels'}
                </button>
                <span className="text-slate-500 text-sm font-semibold hidden sm:inline">{overrideOn ? 'All levels unlocked' : 'Levels respect progress'}</span>
                </div>

                <button onClick={() => setView('admin')} className="font-bold bg-white border-2 border-slate-200 px-6 py-3 rounded-xl text-slate-600 hover:bg-slate-50 shadow-sm transition">Manage Tests & Data</button>
                <button onClick={() => setView('dashboard')} className="font-bold bg-sky-600 text-white px-6 py-3 rounded-xl hover:bg-sky-500 shadow-sm transition">Exit to Student View</button>
                </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div className="bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-100 text-center"><p className="text-slate-500 font-bold uppercase tracking-wider mb-2">Total Attempts</p><p className="text-5xl font-black text-sky-600">{userData.totalAttempts || 0}</p></div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-100 text-center"><p className="text-slate-500 font-bold uppercase tracking-wider mb-2">Overall Accuracy</p><p className="text-5xl font-black text-emerald-500">{overallAcc}%</p></div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-100 text-center"><p className="text-slate-500 font-bold uppercase tracking-wider mb-2">Current Level</p><p className="text-5xl font-black text-amber-500">{userData.level || 1}</p></div>
            </div>

            <div className="bg-white rounded-3xl p-8 mb-8 shadow-md border-2 border-slate-100">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-sky-900 font-orbitron">Recent Test History</h2>
                  <div className="flex gap-3">
                    <button onClick={printReport} className="bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl hover:bg-indigo-500">Print Progress Report</button>
                    <button onClick={() => setView('dashboard')} className="bg-slate-100 px-3 rounded-xl">Back</button>
                  </div>
                </div>
                {completedTests.length > 0 ? (
                    <div className="space-y-4">
                    {completedTests.slice(0, 10).map(t => (
                    <div key={t.id + t.date} className="flex justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-200 gap-4">
                    <div><p className="font-bold text-lg text-slate-800">{t.title}</p><p className="text-sm text-slate-500 font-semibold">{t.date ? new Date(t.date).toLocaleDateString() : 'Unknown'} • {t.mode || 'Unknown Mode'}</p></div>
                    <div className="font-black text-2xl text-sky-700">{Math.round((t.score/t.questions.length)*100)}%</div>
                    </div>
                    ))}
                    </div>
                    ) : <p className="text-slate-500 font-bold text-lg">No tests completed yet.</p>}
            </div>
        </div>
      )
    };

    // ---------- Admin / Create test / Performance view ----------
    const AdminView = ({ userData, setView, allTests, updateAllData, showModal, showNotification }) => {
      const handleResetAllData = () => {
        showModal({
            title: "Reset All Player Data?",
            message: "Are you sure? This deletes ALL progress, XP, stats, and achievements but keeps tests.",
            confirmText: "Reset Everything",
            onConfirm: () => {
                const clean = {
                    name: userData.name || "Nicolas", avatar: userData.avatar || '👨‍🚀',
                    parentPin: userData.parentPin || "1234", soundEnabled: userData.soundEnabled, dyslexiaFriendly: userData.dyslexiaFriendly, dyslexiaPaper: userData.dyslexiaPaper || 'default', overrideUnlockAllLevels: userData.overrideUnlockAllLevels,
                    progress: {}, level: 1, xp: 0, totalAttempts: 0, currentStreak: 0, correctRunAfterWrong: 0, dailyChallengeStreak: 0,
                    achievements: {}, badgeProgress: { geometryGuruTests: [] }, fullTestsCompleted: [], weeklyCompletionWeeks: [],
                    lastLoginDate: new Date().toDateString(), loginStreak: 1, perTopicStats: {}, reviewCorrections: 0, noHintStreak: 0,
                    noHintCorrectCount: 0, lastCorrectAnswerTimes: [], totalCorrectAnswers: 0, uniqueTagsToday: { date: new Date().toDateString(), tags: [] }, stars: 0
                };
                updateAllData(prev => ({ ...prev, userData: clean }));
                showNotification({message: "Reset complete.", type: 'success'});
                setTimeout(() => window.location.reload(), 1000);
            }
        });
      };

      const handleDeleteTest = (testId) => {
        showModal({
            title: "Delete Test?",
            message: "Are you sure you want to permanently delete this test?",
            confirmText: "Delete",
            onConfirm: () => {
                const tests = allTests.filter(x => x.id !== testId);

                updateAllData(prev => {
                    const newProgress = { ...prev.userData.progress };
