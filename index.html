                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Enable Timer</label><input type="checkbox" checked={useTimer} onChange={() => setUseTimer(!useTimer)} className="w-6 h-6 rounded text-sky-500" /></div>
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Enable Hints & Feedback</label><input type="checkbox" checked={useHints} onChange={() => setUseHints(!useHints)} className="w-6 h-6 rounded text-sky-500" /></div>
                    <div className="flex items-center justify-between"><label className="font-semibold text-slate-700">Shuffle Questions</label><input type="checkbox" checked={shuffle} onChange={() => setShuffle(!shuffle)} className="w-6 h-6 rounded text-sky-500" /></div>
                </div>
                <button onClick={() => onStart({ mode: 'Custom', timer: useTimer, hints: useHints, shuffle })} className="w-full text-center p-3 mt-6 bg-purple-600 text-white hover:bg-purple-500 rounded-xl font-bold transition">Start Custom Test</button>
            </div>
        );
    }

    const QuestionNavigator = ({ total, current, answeredIndices, onNavigate }) => {
        return (
            <div className="flex flex-wrap gap-2 my-4">
                {Array.from({ length: total }, (_, i) => {
                    const isAnswered = answeredIndices.has(i);
                    const isCurrent = i === current;
                    let btnClass = 'bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50';
                    if (isCurrent) btnClass = 'bg-sky-500 text-white border-sky-600 shadow-md transform scale-110';
                    else if (isAnswered) btnClass = 'bg-sky-100 border-sky-300 text-sky-800';
                    return <button key={i} onClick={() => onNavigate(i)} className={`w-10 h-10 rounded-xl font-bold transition-all ${btnClass}`}>{i + 1}</button>;
                })}
            </div>
        );
    }

    // --- MAIN VIEWS ---
    const Dashboard = ({ userData, setView, handleSelectTest, allTests, showModal, hideModal, updateAllData, appData, showNotification }) => {
      const xpForNextLevel = (userData.level || 1) * 100;
      const xpPercent = ((userData.xp || 0) / xpForNextLevel) * 100;

      const handleAdminAccess = () => {
          let pinInput = '';
          showModal({
              title: "Parent Access",
              message: "Please enter Parent PIN:",
              children: (
                  <input type="password" autoFocus className="w-full p-4 border-2 border-slate-200 rounded-xl text-center text-2xl font-bold tracking-widest mt-4" onChange={e => pinInput = e.target.value} />
              ),
              confirmText: "Unlock",
              onConfirm: async () => {
                  const savedPin = userData.parentPin || "1234";
                  if (isHashedPin(savedPin)) {
                      const candidateHash = await hashPin(pinInput);
                      if (candidateHash === savedPin) setView('parentDashboard');
                      else showNotification({message: "Incorrect PIN.", type: "error"});
                  } else {
                      if (pinInput === savedPin) {
                          const newHash = await hashPin(savedPin);
                          updateAllData(prev => ({ ...prev, userData: { ...prev.userData, parentPin: newHash } }));
                          setView('parentDashboard');
                      } else showNotification({message: "Incorrect PIN.", type: "error"});
                  }
              },
              onCancel: () => {}
          });
      };

      const handleDailyChallenge = () => {
        let allQuestions = allTests.filter(t => t.id !== 'daily-challenge' && t.id !== 'mistakes-test').flatMap(t => t.questions);
        if(allQuestions.length < 5) return showNotification({message: "Not enough questions for a challenge yet!", type: "error"});
        const dailyQs = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 5);
        const challenge = { id: 'daily-challenge', title: 'Wandering Merchant', subject: 'Mixed', questions: dailyQs };
        updateAllData(prev => ({ ...prev, allTests: [...prev.allTests.filter(t => t.id !== 'daily-challenge'), normalizeTestPack(challenge)] }));
        handleSelectTest('daily-challenge', true); 
      };

      const handlePracticeMistakes = () => {
        const mistakes = []; const seen = new Set();
        Object.entries(userData.progress || {}).forEach(([tid, pData]) => {
          if (tid === 'mistakes-test') return;
          const test = allTests.find(t => t.id === tid);
          if (!test) return;
          Object.entries(pData.answers || {}).forEach(([qIdxStr, ua]) => {
            const qIdx = Number(qIdxStr); const q = test.questions[qIdx];
            if (q && !isAnswerCorrect(q, ua) && !seen.has(q.question)) { mistakes.push({ ...q, originalTestId: tid, originalQIndex: qIdx }); seen.add(q.question); }
          });
        });
        if (mistakes.length === 0) { showNotification({message: "No mistakes to practice. Great job!", type: "success"}); return; }
        const mistakesTest = normalizeTestPack({ id: 'mistakes-test', title: 'The Healing Spring', subject: 'Mixed', questions: mistakes });
        updateAllData(prev => ({ ...prev, allTests: [...prev.allTests.filter(t => t.id !== 'mistakes-test'), mistakesTest] }));
        handleSelectTest('mistakes-test', true);
      };
      
      const hasMistakes = Object.values(userData.progress || {}).some(p => p.completedAt && (p.score || 0) < Object.keys(p.answers || {}).length);

      const level1Tests = allTests.filter(t => t.level === 1 && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const level2Tests = allTests.filter(t => t.level === 2 && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const level3Tests = allTests.filter(t => (t.level === 3 || (!t.level && (t.id.includes('full') || t.id.includes('seag')))) && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const uncategorizedTests = allTests.filter(t => !t.level && !t.id.includes('full') && !t.id.includes('seag') && !t.isBoss && t.id !== 'daily-challenge' && t.id !== 'mistakes-test');
      const bossTests = allTests.filter(t => t.isBoss);

      const orderedCoreTests = [...level1Tests, ...level2Tests, ...level3Tests, ...uncategorizedTests];

      const firstIncompleteIdx = orderedCoreTests.findIndex(t => {
          const p = userData.progress?.[t.id];
          return !p || !p.completedAt;
      });

      const overrideUnlock = !!userData.overrideUnlockAllLevels;
      const userLevel = userData.level || 1;
      
      const allLevel1Complete = level1Tests.length > 0 && level1Tests.every(t => userData.progress?.[t.id]?.completedAt);
      const allLevel2Complete = level2Tests.length > 0 && level2Tests.every(t => userData.progress?.[t.id]?.completedAt);
      const allLevel3Complete = level3Tests.length > 0 && level3Tests.every(t => userData.progress?.[t.id]?.completedAt);

      const canAccessLevel2 = overrideUnlock || userLevel >= 2 || allLevel1Complete;
      const canAccessLevel3 = overrideUnlock || userLevel >= 3 || allLevel2Complete;

      const testsThisWeekData = Object.entries(userData.progress || {})
        .filter(([id, p]) => id !== 'daily-challenge' && id !== 'mistakes-test' && p.completedAt && (Date.now() - p.completedAt) < 7 * 24 * 60 * 60 * 1000)
        .map(([id, p]) => {
            const test = allTests.find(t => t.id === id);
            return { score: p.score, total: test ? test.questions.length : 0 };
        });
      
      const testsThisWeekCount = testsThisWeekData.length;
      let thisWeekScore = 0; let thisWeekTotal = 0;
      testsThisWeekData.forEach(t => { thisWeekScore += t.score; thisWeekTotal += t.total; });
      const thisWeekAccuracy = thisWeekTotal > 0 ? Math.round((thisWeekScore / thisWeekTotal) * 100) : 0;

      const getGlobalIndex = (testId) => orderedCoreTests.findIndex(t => t.id === testId);

      // --- SAGA MAP NODE RENDERING ---
      const renderMapNode = (test, globalIndex) => {
          const progress = userData.progress?.[test.id];
          const isCompleted = !!progress?.completedAt;
          const isUnlocked = overrideUnlock || globalIndex <= firstIncompleteIdx || firstIncompleteIdx === -1;
          const isActive = overrideUnlock ? (!isCompleted) : (globalIndex === firstIncompleteIdx);

          const emoji = test.subject === 'Maths' ? '🧮' : (test.subject === 'English' ? '📖' : '⚔️');

          const offsetBase = [-60, 60, -90, 90, -40, 40];
          const xOffset = offsetBase[globalIndex % offsetBase.length];

          return (
            <div key={test.id} className="relative z-10 my-8 flex flex-col items-center" style={{ transform: `translateX(${xOffset}px)` }}>
               {isActive && isUnlocked && (
                  <div className="absolute -top-12 animate-bounce bg-white text-amber-600 font-black px-4 py-2 rounded-xl shadow-lg border-2 border-amber-200 whitespace-nowrap z-20">
                     START QUEST 👇
                     <div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-b-2 border-r-2 border-amber-200 rotate-45"></div>
                  </div>
               )}
               <button 
                  onClick={() => isUnlocked ? handleSelectTest(test.id) : null}
                  disabled={!isUnlocked}
                  className={`relative w-24 h-24 rounded-full flex items-center justify-center text-4xl shadow-xl transition-all duration-200 border-b-[8px] active:border-b-0 active:translate-y-[8px] outline-none ${
                    isActive ? 'bg-amber-400 border-amber-600 ring-4 ring-amber-200' :
                    isCompleted ? 'bg-emerald-400 border-emerald-600' :
                    isUnlocked ? 'bg-sky-400 border-sky-600 hover:bg-sky-300' :
                    'bg-slate-300 border-slate-400 cursor-not-allowed opacity-80'
                  }`}
               >
                  {isUnlocked ? emoji : '🔒'}
                  {isCompleted && (
                      <div className="absolute -bottom-2 -right-2 bg-white rounded-full p-1 shadow-md text-xl border-2 border-slate-100">
                          ⭐
                      </div>
                  )}
               </button>
               <div className="absolute top-full mt-3 w-48 text-center">
                  <div className="bg-white/90 px-4 py-2 rounded-xl shadow-sm border border-slate-200 text-sm font-bold text-slate-700 font-orbitron">
                    {test.title}
                  </div>
               </div>
            </div>
          );
      };

      return (
        <div className="p-4 sm:p-10 max-w-7xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
            <div>
              <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 flex items-center font-orbitron">
                <span className="text-6xl mr-4">{userData.avatar || '👨‍🚀'}</span> 
                Hero {userData.name}!
              </h1>
              <p className="text-xl text-sky-700 font-semibold mt-2">The realm needs your wisdom. Journey through the lands to unlock the Citadel!</p>
            </div>
            <div className="flex gap-3 mt-4 sm:mt-0">
              <button onClick={() => setView('settings')} className="bg-white border-2 border-slate-200 text-slate-600 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-slate-50 transition">Profile</button>
              <button onClick={() => setView('achievements')} className="bg-yellow-400 text-yellow-900 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-yellow-300 transition">Achievements</button>
              <button onClick={handleAdminAccess} className="bg-slate-200 text-slate-700 font-bold py-2 px-5 rounded-xl shadow-sm hover:bg-slate-300 transition">⚙️ Parents</button>
            </div>
          </div>
          
          <div className="bg-white border-2 border-sky-100 rounded-3xl p-6 mb-10 shadow-lg">
            <div className="flex justify-between items-center mb-3 font-orbitron">
              <span className="font-bold text-sky-700 text-2xl">Level {userData.level || 1} {userData.title && <span className="ml-3 text-lg bg-amber-100 text-amber-800 px-4 py-1 rounded-full font-sans">{userData.title}</span>}</span>
              <span className="text-lg text-slate-500 font-bold">{userData.xp || 0} / {xpForNextLevel} XP</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-6 border border-slate-200 overflow-hidden">
              <div className="bg-gradient-to-r from-sky-400 to-indigo-500 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(100, Math.max(0, xpPercent))}%` }}></div>
            </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            <div className="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition flex flex-col cursor-pointer" onClick={handleDailyChallenge}>
              <div className="flex justify-between items-start mb-4">
                <h2 className="text-3xl font-bold font-orbitron">Wandering Merchant</h2>
                <div className="text-center bg-white/20 px-4 py-2 rounded-xl">
                  <div className="text-2xl mb-1">📜</div>
                </div>
              </div>
              <p className="text-xl opacity-90 mb-8 font-semibold">A quick 5-question quest!</p>
              <div className="mt-auto">
                  {userData.dailyChallenge?.completedToday ? (
                    <div className="w-full bg-white/20 text-center font-bold py-4 rounded-xl text-xl">Quest Complete!</div>
                  ) : (
                    <button className="w-full bg-white text-emerald-700 font-bold py-4 px-6 rounded-xl hover:bg-slate-100 shadow-lg text-xl transition pointer-events-none">Visit Merchant</button>
                  )}
              </div>
            </div>

            <div className="bg-gradient-to-br from-cyan-500 to-blue-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition flex flex-col cursor-pointer" onClick={!hasMistakes ? null : handlePracticeMistakes}>
              <div className="flex justify-between items-start mb-4">
                <h2 className="text-3xl font-bold font-orbitron">The Healing Spring</h2>
                <div className="text-center bg-white/20 px-4 py-2 rounded-xl">
                  <div className="text-2xl mb-1">🧪</div>
                </div>
              </div>
              <p className="text-xl opacity-90 mb-8 font-semibold">Turn past errors into strength.</p>
              <div className="relative group mt-auto">
                  <button disabled={!hasMistakes} className="w-full bg-white text-blue-600 font-bold py-4 px-6 rounded-xl hover:bg-slate-100 disabled:opacity-50 shadow-lg text-xl transition pointer-events-none">Enter Spring</button>
                  {!hasMistakes && <p className="absolute text-center w-full mt-2 text-sm font-bold opacity-80">You are fully healed!</p>}
              </div>
            </div>

            <div className="bg-gradient-to-br from-amber-500 to-orange-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden transform hover:-translate-y-1 transition flex flex-col">
              <div className="flex justify-between items-start mb-4">
                <h2 className="text-3xl font-bold font-orbitron">Adventurer's Log</h2>
                <div className="text-center bg-white/20 px-4 py-2 rounded-xl">
                  <div className="text-2xl mb-1">🗺️</div>
                </div>
              </div>
              <p className="text-xl opacity-90 mb-6 font-semibold">Your deeds over the last 7 days.</p>
              <div className="flex justify-between items-center bg-white/20 p-4 rounded-xl mt-auto">
                  <div className="text-center"><p className="text-sm uppercase tracking-wider font-bold opacity-80">Quests</p><p className="text-3xl font-black">{testsThisWeekCount}</p></div>
                  <div className="text-center"><p className="text-sm uppercase tracking-wider font-bold opacity-80">Accuracy</p><p className="text-3xl font-black">{thisWeekAccuracy}%</p></div>
              </div>
            </div>
          </div>
          
          {/* THE NEW SAGA MAP UI */}
          <div className="relative max-w-lg mx-auto py-10 flex flex-col items-center">
              
              {/* Background Path Line */}
              <div className="absolute top-0 bottom-0 w-6 bg-slate-200 rounded-full shadow-inner opacity-60"></div>

              {/* ZONE 1 */}
              <div className="relative z-10 bg-emerald-100 border-4 border-emerald-500 text-emerald-800 font-black px-8 py-3 rounded-full text-2xl shadow-lg my-6 font-orbitron">
                  🍄 Whispering Woods
              </div>
              
              {level1Tests.length > 0 ? (
                  level1Tests.map(t => renderMapNode(t, getGlobalIndex(t.id)))
              ) : (
                  <div className="relative z-10 bg-white p-6 rounded-2xl border-2 border-slate-200 font-bold text-slate-500 text-center my-6">No quests loaded.</div>
              )}

              {/* ZONE 2 */}
              <div className={`relative z-10 border-4 font-black px-8 py-3 rounded-full text-2xl shadow-lg mt-20 mb-6 font-orbitron ${canAccessLevel2 ? 'bg-purple-100 border-purple-500 text-purple-800' : 'bg-slate-200 border-slate-400 text-slate-500'}`}>
                  {canAccessLevel2 ? '💎 Crystal Caverns' : '🔒 Zone Locked'}
              </div>
              
              {canAccessLevel2 ? (
                  level2Tests.length > 0 ? level2Tests.map(t => renderMapNode(t, getGlobalIndex(t.id))) : <div className="relative z-10 bg-white p-6 rounded-2xl border-2 border-slate-200 font-bold text-slate-500 text-center my-6">No quests loaded.</div>
              ) : (
                  <div className="relative z-10 bg-white p-8 rounded-3xl border-4 border-slate-200 text-center my-6 opacity-80">
                      <p className="text-slate-500 font-bold text-xl">Reach Level 2 (or clear the Woods) to unlock!</p>
                  </div>
              )}

              {/* ZONE 3 */}
              <div className={`relative z-10 border-4 font-black px-8 py-3 rounded-full text-2xl shadow-lg mt-20 mb-6 font-orbitron ${canAccessLevel3 ? 'bg-sky-100 border-sky-500 text-sky-800' : 'bg-slate-200 border-slate-400 text-slate-500'}`}>
                  {canAccessLevel3 ? '🏰 Sky Citadel' : '🔒 Zone Locked'}
              </div>
              
              {canAccessLevel3 ? (
                  level3Tests.length > 0 ? level3Tests.map(t => renderMapNode(t, getGlobalIndex(t.id))) : <div className="relative z-10 bg-white p-6 rounded-2xl border-2 border-slate-200 font-bold text-slate-500 text-center my-6">No quests loaded.</div>
              ) : (
                  <div className="relative z-10 bg-white p-8 rounded-3xl border-4 border-slate-200 text-center my-6 opacity-80">
                      <p className="text-slate-500 font-bold text-xl">Reach Level 3 to enter the Citadel!</p>
                  </div>
              )}

              {/* BOSS STAGE */}
              {canAccessLevel3 && bossTests.length > 0 && (
                  <>
                      <div className="relative z-10 bg-red-100 border-4 border-red-600 text-red-900 font-black px-8 py-3 rounded-full text-2xl shadow-[0_0_20px_rgba(220,38,38,0.5)] mt-20 mb-6 font-orbitron">
                          🐉 Dragon's Lair (Boss)
                      </div>
                      {bossTests.map(t => renderMapNode(t, getGlobalIndex(t.id)))}
                  </>
              )}
          </div>
        </div>
      );
    };

    const QuizView = ({ userData, testDetails, setView, allTests, updateUserData, showNotification, showModal }) => {
      const { id: testId, settings } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const existingProgress = userData?.progress?.[testId] || {};
      
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(existingProgress?.lastQuestionIndex || 0);
      const [userAnswers, setUserAnswers] = useState(existingProgress?.answers || {});
      const [submittedAnswers, setSubmittedAnswers] = useState(existingProgress?.submittedAnswers || {});
      const [streak, setStreak] = useState(existingProgress?.streak || 0);
      const [hint, setHint] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [lastAnswerResult, setLastAnswerResult] = useState(null);
      const [shuffledOrder, setShuffledOrder] = useState(null);
      const [showPassage, setShowPassage] = useState(false);

      const timerEnabled = settings.mode === 'Test' || (settings.mode === 'Custom' && settings.timer);
      const timeLimitMs = settings.mode === 'Test' ? (test.isBoss ? 20 * 60 * 1000 : 45 * 60 * 1000) : 0; 
      
      const questionStartTimeRef = useRef(Date.now());
      const accumulatedElapsedMsRef = useRef(existingProgress?.accumulatedElapsedMs || 0);
      const [displayTime, setDisplayTime] = useState(timeLimitMs > 0 ? timeLimitMs : (existingProgress?.accumulatedElapsedMs || 0));

      const [flash, setFlash] = useState(null);
      const [feedback, setFeedback] = useState(null);

      // GUARARD CLAUSE TO PREVENT FATAL RENDER BUG
      if (!test || !test.questions || test.questions.length === 0 || (settings.shuffle && !shuffledOrder)) {
          return <LoadingSpinner message="Preparing Quest..." />;
      }

      useEffect(() => {
        if (settings.shuffle && !existingProgress.shuffledOrder) {
            const indices = Array.from(test.questions.keys());
            for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
            setShuffledOrder(indices);
            updateUserData(prev => ({ progress: { ...prev.progress, [testId]: { ...(prev.progress?.[testId] || {}), shuffledOrder: indices, settings } } }), { event: { type: 'NO_OP' } }); 
        } else if (existingProgress.shuffledOrder) { 
            setShuffledOrder(existingProgress.shuffledOrder); 
        }
      }, []); 

      useEffect(() => {
        if (!timerEnabled) return;
        setDisplayTime(timeLimitMs > 0 ? Math.max(0, timeLimitMs - accumulatedElapsedMsRef.current) : accumulatedElapsedMsRef.current);
        const interval = setInterval(() => {
            const now = Date.now();
            const elapsed = accumulatedElapsedMsRef.current + (now - questionStartTimeRef.current);
            setDisplayTime(timeLimitMs > 0 ? Math.max(0, timeLimitMs - elapsed) : elapsed);
        }, 1000);
        return () => clearInterval(interval);
      }, [timerEnabled, timeLimitMs]);

      const commitElapsed = () => { const now = Date.now(); const delta = now - questionStartTimeRef.current; accumulatedElapsedMsRef.current += delta; questionStartTimeRef.current = now; return delta; };
      const calculateScore = () => { return Object.entries(userAnswers).reduce((acc, [idx, ua]) => acc + (isAnswerCorrect(test.questions[idx], ua) ? 1 : 0), 0); };

      const saveProgress = (isFinished = false, overrideIndex) => {
        const score = calculateScore();
        const currentElapsed = accumulatedElapsedMsRef.current + (Date.now() - questionStartTimeRef.current);
        const pEntry = { answers: userAnswers, lastQuestionIndex: typeof overrideIndex === 'number' ? overrideIndex : currentQuestionIndex, score, accumulatedElapsedMs: currentElapsed, streak, settings, submittedAnswers, ...(shuffledOrder && { shuffledOrder }), ...(isFinished ? { completedAt: Date.now() } : {}) };
        const lastOrigIdx = shuffledOrder ? shuffledOrder[test.questions.length - 1] : (test.questions.length - 1);
        
        updateUserData(prev => ({ progress: { ...prev.progress, [testId]: pEntry } }), {
            event: isFinished ? { type: 'PACK_COMPLETED', payload: { finishedTestId: testId, totalQuestions: test.questions.length, score, mode: settings.mode, initialTotalTime: timeLimitMs, timeLeft: timeLimitMs > 0 ? Math.max(0, timeLimitMs - currentElapsed) : 0, testHasGeometry: test.questions.some(q => (q.tags || []).includes('geometry')), lastQuestionCorrect: isAnswerCorrect(test.questions[lastOrigIdx], userAnswers[lastOrigIdx]), isFullPractice: testId.includes('full') || testId.includes('seag') || testId.includes('boss'), isDailyChallenge: testId === 'daily-challenge', finishedAt: Date.now() } } : undefined
        });
      };

      const originalIndex = shuffledOrder ? shuffledOrder[currentQuestionIndex] : currentQuestionIndex;
      const showInstantFeedback = settings.mode === 'Practice' || (settings.mode === 'Custom' && settings.hints);

      const navigateToQuestion = (idx) => { if (idx >= 0 && idx < test.questions.length) { commitElapsed(); setFeedback(null); setHint(null); setShowExplanation(false); setLastAnswerResult(null); setCurrentQuestionIndex(idx); saveProgress(false, idx); } };
      const goToNext = () => navigateToQuestion(currentQuestionIndex + 1);

      const handleAnswerSelect = (answer, isTextarea = false) => {
        if (submittedAnswers[currentQuestionIndex]) return;
        setUserAnswers(prev => ({ ...prev, [originalIndex]: answer }));
        
        if (showInstantFeedback && !submittedAnswers[currentQuestionIndex] && !isTextarea) {
            setTimeout(() => handleSubmitAnswer(answer), 0);
        }
      };

      const handleSubmitAnswer = (ansOverride) => {
        const answer = ansOverride || userAnswers[originalIndex];
        if (answer === undefined || answer === null || answer === '') return;
        setSubmittedAnswers(prev => ({ ...prev, [currentQuestionIndex]: true }));
        const deltaMs = commitElapsed();
        
        const question = test.questions[originalIndex];
        const isCorrect = isAnswerCorrect(question, answer);
        
        setLastAnswerResult({ isCorrect, userAnswer: answer, question });
        updateUserData({}, { event: { type: 'ANSWER_SUBMITTED', payload: { correct: isCorrect, timeToAnswer: deltaMs/1000, usedHint: !!hint, tags: question.tags || [], wasReviewed: testId === 'mistakes-test', mode: settings.mode, testId } }});
        
        setStreak(isCorrect ? streak + 1 : 0);
        playSound(isCorrect ? 'correct' : 'incorrect', userData.soundEnabled !== false);

        if (showInstantFeedback) {
            setFlash(isCorrect ? 'correct' : 'incorrect');
            setFeedback(isCorrect ? "Correct! Great job!" : `Not quite. The correct answer is: ${question._isMCQ && question._correctOptionId ? (question.options.find(o => o.id === question._correctOptionId)?.text || question.answer) : question.answer}`);
            setTimeout(() => setFlash(null), 800);
        } else {
            if (currentQuestionIndex < test.questions.length - 1) setTimeout(goToNext, 300);
        }
        saveProgress(false);
      };

      const handleFinish = () => {
        commitElapsed();
        if (testId === 'mistakes-test') {
          saveProgress(true);
          showNotification({ message: `Mistakes reviewed! Great work.`, type: "success" });
          setView('dashboard');
        } else {
          saveProgress(true);
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          setView('results');
        }
      };

      const handleExit = () => {
        if (settings.mode === 'Test') {
            showModal({ title: "Exit Quest?", message: "Your timer will keep running in the background if you leave now.", confirmText: "Exit", onConfirm: () => { commitElapsed(); saveProgress(false); setView('dashboard'); } });
        } else { commitElapsed(); saveProgress(false); setView('dashboard'); }
      }

      const fetchHint = () => { setHint("Try re-reading the question carefully and break it into steps."); };

      const currentQ = test.questions[originalIndex];
      if (!currentQ) return <LoadingSpinner message="Loading Question..." />;

      const isSubmitted = !!submittedAnswers[currentQuestionIndex];
      const passageText = getPassageForQuestion(currentQ, test);
      
      const optObjs = Array.isArray(currentQ.options) && currentQ.options.length ? currentQ.options : null;
      const isFreeResponse = !optObjs;
      const answeredSet = new Set(Object.keys(submittedAnswers).map(Number));

      return (
        <div className={`min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center transition-colors duration-300 ${flash ? `flash-${flash}` : ''}`}>
          <div className="bg-white border-4 border-slate-100 rounded-3xl shadow-2xl p-6 sm:p-12 w-full max-w-4xl relative">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl sm:text-3xl font-bold text-sky-900 font-orbitron">{test.title}</h2>
              {streak >= 1 && <span className={`font-bold text-orange-500 ${streak >= 3 ? 'text-2xl animate-pulse' : 'text-lg'}`}>🔥 {streak} Streak!</span>}
              {timerEnabled && <div className={`text-xl font-orbitron px-4 py-2 rounded-xl font-bold border-2 flex items-center gap-2 ${timeLimitMs > 0 && displayTime < 300000 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>{test.isBoss && <span className="text-xs uppercase bg-red-200 px-2 rounded font-bold text-red-800">BOSS TIMER</span>}{timeLimitMs > 0 ? '⏱️ ' : ''}{formatTime(displayTime)}</div>}
            </div>
            
            <QuestionNavigator total={test.questions.length} current={currentQuestionIndex} answeredIndices={answeredSet} onNavigate={navigateToQuestion} />
            
            <div className="mb-8 bg-sky-50 rounded-3xl p-8 border-2 border-sky-100 shadow-sm min-h-[10rem] flex flex-col justify-center">
              <div className="flex justify-between items-start">
                  <div>
                    <p className="text-slate-400 font-bold mb-3 uppercase tracking-wider text-sm">Question {currentQuestionIndex + 1} of {test.questions.length}</p>
                    <p className="text-2xl text-slate-800 whitespace-pre-wrap font-bold leading-relaxed">{currentQ.question}</p>
                  </div>
                  {passageText && (
                      <button onClick={() => setShowPassage(true)} className="ml-4 bg-white border-2 border-slate-200 px-4 py-2 rounded-xl font-bold hover:bg-slate-50 whitespace-nowrap">📖 Read Passage</button>
                  )}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
              {optObjs ? optObjs.map((opt, i) => {
                const checked = userAnswers[originalIndex] === opt.id;
                return (
                  <button key={opt.id} onClick={() => handleAnswerSelect(opt.id, false)} disabled={isSubmitted} className={`p-6 rounded-2xl border-4 text-left text-xl font-bold transition-all min-h-[80px] shadow-sm ${checked ? 'bg-sky-100 border-sky-500 text-sky-900 transform scale-[1.02]' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300'} ${isSubmitted ? 'opacity-60 cursor-not-allowed' : ''}`}>
                    <div className="flex items-start gap-4">
                        <div className="uppercase text-sky-700 font-bold mr-2">{opt.id})</div>
                        <div className="text-left leading-snug">{opt.text}</div>
                    </div>
                  </button>
                )
              }) : (
                <textarea value={userAnswers[originalIndex] || ''} onChange={(e) => handleAnswerSelect(e.target.value, true)} disabled={isSubmitted} className="w-full col-span-2 p-6 text-2xl font-bold border-4 border-slate-200 rounded-3xl focus:border-sky-500 outline-none resize-none bg-white shadow-inner" placeholder="Type your answer here..." rows="4" />
              )}
            </div>

            {!isSubmitted && (!showInstantFeedback || isFreeResponse) && (
              <div className="text-center my-8">
                <button onClick={() => handleSubmitAnswer()} disabled={typeof userAnswers[originalIndex] === 'undefined' || userAnswers[originalIndex] === ''} className="bg-emerald-500 text-white font-bold py-4 px-12 rounded-2xl hover:bg-emerald-400 disabled:opacity-50 text-2xl shadow-xl transition-all transform hover:-translate-y-1">Submit Answer</button>
              </div>
            )}

            {showInstantFeedback && (
              <div className="my-6 text-center">
                {hint ? <div className="p-5 bg-amber-50 border-2 border-amber-200 text-amber-800 rounded-2xl text-xl font-bold shadow-sm">{hint}</div> : <button onClick={fetchHint} className="text-sky-600 font-bold hover:text-sky-800 text-xl">💡 Need a hint?</button>}
              </div>
            )}

            {feedback && <div aria-live="polite" className={`p-6 rounded-2xl text-2xl font-bold mb-8 text-center shadow-md border-2 ${feedback.includes('Correct') ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>{feedback}</div>}
            
            {lastAnswerResult && !lastAnswerResult.isCorrect && showInstantFeedback && !showExplanation && (
              <div className="text-center">
                <button onClick={() => setShowExplanation(true)} className="mt-2 px-6 py-3 bg-slate-100 text-slate-700 rounded-xl text-lg font-bold hover:bg-slate-200 border-2 border-slate-300 shadow-sm transition">🤖 Explain my mistake</button>
              </div>
            )}
            {showExplanation && <AIExplanation question={lastAnswerResult.question} userAnswer={lastAnswerResult.userAnswer} correctAnswer={lastAnswerResult.question._isMCQ && lastAnswerResult.question._correctOptionId ? (lastAnswerResult.question.options.find(o=>o.id===lastAnswerResult.question._correctOptionId)?.text || lastAnswerResult.question.answer) : lastAnswerResult.question.answer} onClose={() => setShowExplanation(false)} />}

            <div className="flex justify-between items-center mt-12 pt-8 border-t-4 border-slate-100">
              <button onClick={handleExit} className="text-slate-500 font-bold hover:text-slate-800 text-xl px-6 py-3 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Exit Quest</button>
              {currentQuestionIndex < test.questions.length - 1 ? (
                <button onClick={goToNext} disabled={!isSubmitted && showInstantFeedback} className="bg-sky-600 text-white font-bold py-4 px-10 rounded-2xl hover:bg-sky-500 disabled:opacity-50 disabled:bg-slate-400 text-2xl shadow-lg transition">Next Question &rarr;</button>
              ) : (
                <button onClick={handleFinish} disabled={!isSubmitted && showInstantFeedback} className="bg-purple-600 text-white font-bold py-4 px-12 rounded-2xl hover:bg-purple-500 disabled:opacity-50 disabled:bg-slate-400 text-2xl shadow-xl transition transform hover:-translate-y-1">Finish Quest 🏆</button>
              )}
            </div>
          </div>

          {showPassage && (
            <div className="modal-backdrop">
              <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-3xl text-left border-4 border-sky-100 max-h-[80vh] overflow-auto">
                <div className="flex justify-between items-start mb-6">
                  <h3 className="text-3xl font-bold font-orbitron text-sky-900">Passage</h3>
                  <button onClick={() => setShowPassage(false)} className="text-sky-600 text-2xl font-bold hover:text-sky-800">✕</button>
                </div>
                <div className="prose prose-xl text-slate-800 whitespace-pre-wrap font-semibold">
                  {passageText}
                </div>
                <div className="flex justify-end mt-8">
                  <button onClick={() => setShowPassage(false)} className="bg-slate-100 px-6 py-3 rounded-xl font-bold hover:bg-slate-200 text-xl">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const ResultsView = ({ userData, setView, testDetails, allTests, updateUserData, handleSelectTest }) => {
      useEffect(() => {
          if (!testDetails || !allTests.find(t => t.id === testDetails.id) || !userData.progress?.[testDetails.id]) {
              setView('dashboard');
          }
      }, [testDetails, allTests, userData, setView]);

      if (!testDetails) return null;
      const { id: testId } = testDetails;
      const test = allTests.find(t => t.id === testId);
      const progress = userData.progress?.[testId];
      if (!test || !progress) return null;
      
      const score = progress.score || 0;
      const total = test.questions.length;
      const pct = total > 0 ? Math.round((score/total)*100) : 0;
      
      let band = null;
      if (total >= 10) {
          if (pct >= 85) band = "Band 1";
          else if (pct >= 75) band = "Band 2";
          else if (pct >= 65) band = "Band 3";
          else if (pct >= 55) band = "Band 4";
          else if (pct >= 45) band = "Band 5";
          else band = "Band 6";
      }

      const handleTryAgain = () => {
          updateUserData(prev => {
              const newProgress = { ...prev.progress };
              delete newProgress[testId];
              return { progress: newProgress };
          }, { event: { type: 'NO_OP' } });
          setView('dashboard');
          setTimeout(() => handleSelectTest(testId), 100);
      };

      return (
        <div className="p-4 sm:p-8 min-h-screen">
          <div className="max-w-4xl mx-auto bg-white border-4 border-sky-100 rounded-3xl shadow-2xl p-8 sm:p-12 text-center relative overflow-hidden">
            <h2 className="text-5xl sm:text-6xl font-black text-sky-900 font-orbitron mb-8 relative z-10">Quest Complete!</h2>
            <div className="inline-block bg-sky-50 border-4 border-sky-200 rounded-[3rem] p-10 mb-12 relative z-10 shadow-inner">
                <p className="text-3xl text-sky-800 font-bold uppercase tracking-widest mb-4">Final Score</p>
                <p className="text-7xl font-black text-amber-500 my-4 tracking-tighter">{score} <span className="text-5xl text-sky-800 opacity-50">/ {total}</span></p>
                <p className="text-2xl text-sky-700 font-bold bg-white px-6 py-2 rounded-full inline-block mt-4">{pct}% Accuracy</p>
            </div>
            
            {band && (
                <div className="mb-10 bg-purple-100 border-4 border-purple-300 rounded-3xl p-8 text-purple-900 shadow-md inline-block max-w-lg mx-auto relative z-10">
                    <h3 className="text-3xl font-bold font-orbitron mb-2">Estimated SEAG Band</h3>
                    <p className="text-5xl font-black my-4">{band}</p>
                    <p className="text-sm font-semibold mt-2 opacity-80">{total < 40 ? "*(Based on a partial paper)*" : "This is a rough estimate based on standard past paper curves."}</p>
                </div>
            )}

            <div className="space-y-6 text-left mt-8 relative z-10">
                {(progress.shuffledOrder || Array.from(test.questions.keys())).map((originalIndex, displayIndex) => {
                    const actualQuestion = test.questions[originalIndex];
                    const userAnswer = progress.answers[originalIndex];
                    const isCorr = isAnswerCorrect(actualQuestion, userAnswer);
                    
                    let displayAns = userAnswer || 'Blank';
                    if (actualQuestion._isMCQ && actualQuestion.options) {
                        const opt = actualQuestion.options.find(o => o.id === userAnswer);
                        if (opt) displayAns = `${opt.id}) ${opt.text}`;
                    }
                    let correctAns = actualQuestion.answer;
                    if (actualQuestion._isMCQ && actualQuestion._correctOptionId) {
                        const opt = actualQuestion.options.find(o => o.id === actualQuestion._correctOptionId);
                        if (opt) correctAns = `${opt.id}) ${opt.text}`;
                    }

                    return (
                        <div key={displayIndex} className={`p-6 rounded-3xl border-l-8 shadow-sm ${isCorr ? 'bg-emerald-50 border-emerald-500' : 'bg-red-50 border-red-500'}`}>
                            <p className="font-bold text-slate-800 mb-3 text-xl">{displayIndex+1}. {actualQuestion.question}</p>
                            <p className={`font-bold text-lg ${isCorr ? 'text-emerald-700' : 'text-red-700'}`}>Your answer: {displayAns}</p>
                            {!isCorr && <p className="font-bold text-slate-700 mt-2 text-lg">Correct answer: {correctAns}</p>}
                        </div>
                    );
                })}
            </div>
            
            <div className="mt-12 flex flex-col sm:flex-row gap-4 justify-center relative z-10">
                <button onClick={handleTryAgain} className="w-full sm:w-auto bg-slate-100 text-slate-700 font-bold py-5 px-10 rounded-2xl hover:bg-slate-200 text-2xl shadow-sm transition border-2 border-slate-200">Try Again</button>
                <button onClick={() => setView('dashboard')} className="w-full sm:w-auto bg-sky-600 text-white font-bold py-5 px-16 rounded-2xl hover:bg-sky-500 text-3xl shadow-xl transition transform hover:-translate-y-1">Return to Map</button>
            </div>
          </div>
        </div>
      );
    };

    const ParentDashboardView = ({ userData, setView, allTests, updateAllData }) => {
        const completedTests = Object.entries(userData.progress||{}).map(([id, p]) => { const t = allTests.find(x=>x.id===id); return (t && Object.keys(p.answers||{}).length === t.questions.length) ? {...t, score: p.score, date: p.completedAt, mode: p.settings?.mode} : null; }).filter(Boolean).sort((a,b) => b.date - a.date);
        
        let totalQs = 0; let totalCorr = 0;
        completedTests.forEach(t => { totalQs += t.questions.length; totalCorr += t.score; });
        const overallAcc = totalQs > 0 ? Math.round((totalCorr / totalQs) * 100) : 0;
        const overrideOn = !!userData?.overrideUnlockAllLevels;

        return (
            <div className="p-4 sm:p-8 max-w-5xl mx-auto min-h-screen">
                <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
                    <h1 className="text-4xl sm:text-5xl font-bold text-sky-900 font-orbitron">Parent Dashboard</h1>
                    
                    <div className="flex items-center gap-4 flex-wrap">
                        <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm">
                          <button onClick={() => { updateAllData(prev => ({ ...prev, userData: { ...prev.userData, overrideUnlockAllLevels: !overrideOn } })); }} className={`font-bold py-2 px-4 rounded-xl ${overrideOn ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            {overrideOn ? 'Disable: Unlock All' : 'Unlock All Levels'}
                          </button>
                          <span className="text-slate-500 text-sm font-semibold hidden sm:inline">{overrideOn ? 'All levels unlocked' : 'Levels respect progress'}</span>
                        </div>
                        
                        <button onClick={() => setView('admin')} className="font-bold bg-white border-2 border-slate-200 px-6 py-3 rounded-xl text-slate-600 hover:bg-slate-50 shadow-sm transition">Manage Tests & Data</button>
                        <button onClick={() => setView('dashboard')} className="font-bold bg-sky-600 text-white px-6 py-3 rounded-xl hover:bg-sky-500 shadow-sm transition">Exit to Student View</button>
                    </div>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 text-center"><p className="text-slate-500 font-bold uppercase tracking-wider mb-2">Total Attempts</p><p className="text-5xl font-black text-sky-600">{userData.totalAttempts || 0}</p></div>
                    <div className="bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 text-center"><p className="text-slate-500 font-bold uppercase tracking-wider mb-2">Overall Accuracy</p><p className="text-5xl font-black text-emerald-500">{overallAcc}%</p></div>
                    <div className="bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 text-center"><p className="text-slate-500 font-bold uppercase tracking-wider mb-2">Current Level</p><p className="text-5xl font-black text-amber-500">{userData.level || 1}</p></div>
                </div>

                <div className="bg-white rounded-3xl p-8 shadow-xl border-2 border-slate-100">
                    <h2 className="text-2xl font-bold text-sky-900 mb-6 font-orbitron">Recent Test History</h2>
                    {completedTests.length > 0 ? (
                        <div className="space-y-4">
                            {completedTests.slice(0, 10).map(t => (
                                <div key={t.id + t.date} className="flex justify-between items-center bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                    <div><p className="font-bold text-xl text-slate-800 mb-1">{t.title}</p><p className="text-sm text-slate-500 font-bold uppercase tracking-wide">{new Date(t.date).toLocaleDateString()} • {t.mode || 'Unknown Mode'}</p></div>
                                    <div className="font-black text-3xl text-sky-700">{Math.round((t.score/t.questions.length)*100)}%</div>
                                </div>
                            ))}
                        </div>
                    ) : <p className="text-slate-500 font-bold text-lg">No tests completed yet.</p>}
                </div>
            </div>
        )
    };

    const AdminView = ({ userData, setView, allTests, updateAllData, showModal, showNotification }) => {
      
      const handleResetAllData = () => {
        showModal({ 
            title: "Reset All Player Data?", 
            message: "Are you sure? This deletes ALL progress, XP, stats, and achievements but keeps tests.", 
            confirmText: "Reset Everything", 
            onConfirm: () => {
                const clean = { 
                    name: userData.name || "Nicolas", avatar: userData.avatar || '👨‍🚀', parentPin: userData.parentPin || "1234", soundEnabled: userData.soundEnabled, dyslexiaFriendly: userData.dyslexiaFriendly, overrideUnlockAllLevels: userData.overrideUnlockAllLevels,
                    progress: {}, level: 1, xp: 0, totalAttempts: 0, currentStreak: 0, correctRunAfterWrong: 0, dailyChallengeStreak: 0, 
                    achievements: {}, badgeProgress: { geometryGuruTests: [] }, fullTestsCompleted: [], weeklyCompletionWeeks: [], 
                    lastLoginDate: new Date().toDateString(), loginStreak: 1, perTopicStats: {}, reviewCorrections: 0, noHintStreak: 0, 
                    noHintCorrectCount: 0, lastCorrectAnswerTimes: [], totalCorrectAnswers: 0, uniqueTagsToday: { date: new Date().toDateString(), tags: [] } 
                };
                updateAllData(prev => ({ ...prev, userData: clean }));
                showNotification({message: "Reset complete.", type: 'success'}); 
                setTimeout(() => window.location.reload(), 1000);
            }
        });
      };

      const handleDeleteTest = (testId) => {
        showModal({
            title: "Delete Test?",
            message: "Are you sure you want to permanently delete this test?",
            confirmText: "Delete",
            onConfirm: () => {
                const tests = allTests.filter(x => x.id !== testId);
                
                updateAllData(prev => {
                    const newProgress = { ...prev.userData.progress };
                    delete newProgress[testId];
                    const newDeleted = prev.deletedDefaultTests || [];
                    if (defaultTests.some(dt => dt.id === testId)) {
                        newDeleted.push(testId);
                    }
                    return { ...prev, userData: { ...prev.userData, progress: newProgress }, allTests: tests, deletedDefaultTests: newDeleted };
                });
                showNotification({message:'Test Deleted', type:'success'});
            }
        });
      }

      const handleImportTestPacks = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const importedData = JSON.parse(e.target.result);
                const testsToImport = Array.isArray(importedData) ? importedData : [importedData];
                if (!testsToImport[0].id || !testsToImport[0].questions) throw new Error("Invalid format.");
                
                updateAllData(prev => {
                    const newAllTests = [...prev.allTests];
                    let added = 0; let updated = 0;
                    testsToImport.forEach(newTest => {
                        const existingIndex = newAllTests.findIndex(t => t.id === newTest.id);
                        if (existingIndex >= 0) { newAllTests[existingIndex] = normalizeTestPack(newTest); updated++; } 
                        else { newAllTests.push(normalizeTestPack(newTest)); added++; }
                    });
                    setTimeout(() => showNotification({ message: `Success! Added ${added} new tests, updated ${updated}.`, type: 'success' }), 0);
                    return { ...prev, allTests: newAllTests };
                });
                
            } catch (error) { showNotification({ message: `Import failed: ${error.message}`, type: 'error' }); } 
            finally { event.target.value = ""; }
        };
        reader.readAsText(file);
      };

      return (
        <div className="p-4 sm:p-8 min-h-screen max-w-5xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
              <h1 className="text-4xl font-bold text-sky-900 font-orbitron">Manage Data</h1>
              <button onClick={() => setView('parentDashboard')} className="bg-white border-2 border-slate-200 font-bold py-2 px-6 rounded-xl shadow-sm hover:bg-slate-50 transition text-lg">Back to Parents Area</button>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
              <button onClick={() => setView('createTest')} className="bg-emerald-500 text-white p-8 rounded-3xl font-bold text-2xl hover:bg-emerald-400 shadow-lg transition transform hover:-translate-y-1">Create New Test 📝</button>
              <button onClick={() => setView('performance')} className="bg-purple-500 text-white p-8 rounded-3xl font-bold text-2xl hover:bg-purple-400 shadow-lg transition transform hover:-translate-y-1">Performance Charts 📈</button>
          </div>
          
          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 mb-8 shadow-md">
              <h2 className="text-2xl font-bold mb-6 text-sky-900 font-orbitron">Data Import & Reset</h2>
              <div className="flex flex-wrap gap-4">
                  <input type="file" accept=".json" id="import-test-pack" className="hidden" onChange={handleImportTestPacks} />
                  <label htmlFor="import-test-pack" className="bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-indigo-500 cursor-pointer shadow-md transition text-lg">📥 Import JSON Tests</label>
                  <button onClick={handleResetAllData} className="bg-red-500 text-white font-bold py-3 px-6 rounded-xl hover:bg-red-400 text-lg shadow-md transition">⚠️ Reset All Player Data</button>
              </div>
          </div>
          
          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 shadow-md">
            <h2 className="text-2xl font-bold mb-6 text-sky-900 font-orbitron">Manage Existing Tests</h2>
            <div className="space-y-4">
              {allTests.map(t => (
                <div key={t.id} className="bg-slate-50 p-5 rounded-2xl flex flex-wrap justify-between items-center border border-slate-200 gap-4">
                  <div>
                      <h3 className="font-bold text-lg text-slate-800">{t.title}</h3>
                      <p className="text-slate-500 font-semibold">{t.subject} {t.level ? `• Level ${t.level}` : ''} • {t.questions.length} questions</p>
                  </div>
                  <button onClick={() => handleDeleteTest(t.id)} className="bg-white border-2 border-red-200 text-red-600 font-bold px-6 py-2 rounded-xl hover:bg-red-50 transition">Delete</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const CreateTestView = ({ setView, allTests, updateAllData, userData, showNotification }) => {
        const [title, setTitle] = useState(''); const [subject, setSubject] = useState('Maths'); const [level, setLevel] = useState(1); 
        const [questions, setQuestions] = useState([{ question: '', options: ['','','','',''], answer: '' }]); 
        
        const handleSave = () => {
            if(!title) return showNotification({message: "Title required", type:"error"});
            if(questions.some(q => !q.question || !q.answer)) return showNotification({message: "All questions must have text and an answer.", type: "error"});
            
            const nt = { id: `custom-${Date.now()}`, title, subject, level: Number(level), questions, notes: '' };
            updateAllData(prev => ({ ...prev, allTests: [...prev.allTests, normalizeTestPack(nt)] }));
            showNotification({message: "Test Created!", type:"success"});
            setView('admin');
        };
        
        return (
            <div className="p-4 sm:p-10 max-w-4xl mx-auto min-h-screen">
                <div className="flex flex-wrap justify-between items-center mb-8 gap-4"><h1 className="text-4xl font-bold text-sky-900 font-orbitron">Create Test</h1><button onClick={() => setView('admin')} className="font-bold text-slate-500 hover:text-slate-800 bg-white border border-slate-200 px-6 py-2 rounded-xl">Cancel</button></div>
                <div className="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border-2 border-slate-100">
                    <input type="text" placeholder="Test Title" value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-5 mb-6 border-2 border-slate-200 rounded-2xl font-bold text-2xl focus:border-sky-500 outline-none" />
                    <div className="flex flex-wrap gap-4 mb-8">
                        <select value={subject} onChange={e=>setSubject(e.target.value)} className="flex-1 p-4 border-2 border-slate-200 rounded-xl font-bold text-xl outline-none focus:border-sky-500"><option>Maths</option><option>English</option><option>Mixed</option></select>
                        <select value={level} onChange={e=>setLevel(e.target.value)} className="flex-1 p-4 border-2 border-slate-200 rounded-xl font-bold text-xl outline-none focus:border-sky-500"><option value={1}>Level 1</option><option value={2}>Level 2</option><option value={3}>Level 3</option></select>
                    </div>
                    {questions.map((q, i) => (
                        <div key={i} className="mb-8 p-6 bg-sky-50 rounded-3xl border-2 border-sky-100 relative">
                            <span className="absolute -top-3 left-4 bg-sky-200 text-sky-800 px-3 py-1 rounded-full font-bold text-sm">Q {i+1}</span>
                            <textarea placeholder="Question Text" value={q.question} onChange={e=>{const n=[...questions]; n[i].question=e.target.value; setQuestions(n);}} className="w-full p-5 mt-6 mb-4 rounded-2xl border-2 border-slate-200 text-xl font-semibold outline-none focus:border-sky-500" rows="3" />
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                                {q.options.map((opt, oIndex) => (
                                    <input key={oIndex} type="text" value={opt} onChange={e=>{const n=[...questions]; n[i].options[oIndex]=e.target.value; setQuestions(n);}} placeholder={`Option ${oIndex + 1}`} className={`p-3 rounded-lg border border-slate-200 font-semibold outline-none focus:border-sky-500 ${oIndex === 4 ? 'sm:col-span-2' : ''}`} />
                                ))}
                            </div>
                            <input type="text" placeholder="Exact Correct Answer (option text or letter A..E)" value={q.answer} onChange={e=>{const n=[...questions]; n[i].answer=e.target.value; setQuestions(n);}} className="w-full p-4 rounded-xl border-2 border-emerald-300 bg-emerald-50 font-bold text-lg outline-none focus:border-emerald-500" />
                        </div>
                    ))}
                    <div className="flex flex-col sm:flex-row gap-6 mt-10">
                        <button onClick={() => setQuestions([...questions, {question:'', options:['','','','',''], answer:''}])} className="flex-1 bg-slate-100 text-slate-700 font-bold py-5 rounded-2xl text-xl hover:bg-slate-200 border-2 border-slate-200 transition">Add Question</button>
                        <button onClick={handleSave} className="flex-1 bg-emerald-500 text-white font-bold py-5 rounded-2xl text-xl hover:bg-emerald-400 shadow-lg transition">Save Test</button>
                    </div>
                </div>
            </div>
        );
    };

    const PerformanceDashboardView = ({ setView, userData, allTests }) => {
      const chartRef = useRef(null); const chartInstanceRef = useRef(null);
      
      const completed = Object.entries(userData.progress||{}).map(([id, p]) => { const t = allTests.find(x=>x.id===id); return (t && Object.keys(p.answers||{}).length === t.questions.length) ? {...t, score: p.score, completedAt: p.completedAt || 0} : null; }).filter(Boolean).sort((a,b) => a.completedAt - b.completedAt);
      
      useEffect(() => {
        if (!chartRef.current || !window.Chart) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        
        if (completed.length === 0) return;

        const maths = completed.filter(t=>t.subject==='Maths').map(t=>(t.score/t.questions.length)*100);
        const english = completed.filter(t=>t.subject==='English').map(t=>(t.score/t.questions.length)*100);
        const mixed = completed.filter(t=>t.subject==='Mixed').map(t=>(t.score/t.questions.length)*100);
        const maxLength = Math.max(maths.length, english.length, mixed.length);
        
        chartInstanceRef.current = new Chart(ctx, {
          type: 'line', 
          data: { 
              labels: Array.from({length: maxLength}, (_,i)=>`Attempt ${i+1}`), 
              datasets: [ 
                  {label: 'Maths (%)', data: maths, borderColor: '#3b82f6', tension: 0.2, pointRadius: 6, pointHoverRadius: 8}, 
                  {label: 'English (%)', data: english, borderColor: '#ec4899', tension: 0.2, pointRadius: 6, pointHoverRadius: 8},
                  {label: 'Mixed (%)', data: mixed, borderColor: '#8b5cf6', tension: 0.2, pointRadius: 6, pointHoverRadius: 8}
              ]
          }, 
          options: { scales: { y: { beginAtZero: true, max: 100 } }, responsive: true }
        });
      }, [userData, allTests, completed]);

      return (
          <div className="p-8 max-w-5xl mx-auto min-h-screen">
              <div className="flex justify-between items-center mb-8"><h1 className="text-4xl font-bold text-sky-900 font-orbitron">Performance Charts</h1><button onClick={() => setView('admin')} className="font-bold bg-white border border-slate-200 px-6 py-3 rounded-xl text-slate-500 hover:text-slate-800 shadow-sm">Back</button></div>
              <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-slate-100">
                  {completed.length > 0 ? <canvas ref={chartRef}></canvas> : <p className="text-center font-bold text-slate-500 text-xl py-10">No data yet. Complete a test to see your progress!</p>}
              </div>
          </div>
      );
    };

      const [avatar, setAvatar] = useState(userData.avatar || '👨‍🚀');

      const [soundEnabled, setSoundEnabled] = useState(userData.soundEnabled !== false);
