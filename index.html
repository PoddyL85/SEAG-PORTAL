                    delete newProgress[testId];
                    return { ...prev, userData: { ...prev.userData, progress: newProgress }, allTests: tests };
                });
                showNotification({message:'Test Deleted', type:'success'});
            }
        });
      }

      const handleImportTestPacks = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const importedData = JSON.parse(e.target.result);
                const testsToImport = Array.isArray(importedData) ? importedData : [importedData];
                const normalized = testsToImport.map(t => normalizeTestPack(t));
                if (!normalized[0].id || !normalized[0].questions) throw new Error("Invalid format.");

                updateAllData(prev => {
                    const newAllTests = [...prev.allTests];
                    let added = 0; let updated = 0;
                    normalized.forEach(newTest => {
                    const existingIndex = newAllTests.findIndex(t => t.id === newTest.id);
                    if (existingIndex >= 0) { newAllTests[existingIndex] = newTest; updated++; }
                    else { newAllTests.push(newTest); added++; }
                    });
                    setTimeout(() => showNotification({ message: `Success! Added ${added} new tests, updated ${updated}.`, type: 'success' }), 0);
                    return { ...prev, allTests: newAllTests };
                });
            } catch (error) { showNotification({ message: `Import failed: ${error.message}`, type: 'error' }); }
            finally { event.target.value = ""; }
        };
        reader.readAsText(file);
      };

      return (
        <div className="p-4 sm:p-8 min-h-screen max-w-5xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-8 gap-4">
              <h1 className="text-4xl font-bold text-sky-900 font-orbitron">Manage Data</h1>
              <button onClick={() => setView('parentDashboard')} className="bg-white border-2 border-slate-200 font-bold py-2 px-6 rounded-xl shadow-sm hover:bg-slate-50 transition text-lg">Back to Parents Area</button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
              <button onClick={() => setView('createTest')} className="bg-emerald-500 text-white p-8 rounded-3xl font-bold text-2xl hover:bg-emerald-400 shadow-lg transition transform hover:-translate-y-1">Create New Test 📝</button>
              <button onClick={() => setView('performance')} className="bg-purple-500 text-white p-8 rounded-3xl font-bold text-2xl hover:bg-purple-400 shadow-lg transition transform hover:-translate-y-1">Performance Charts 📈</button>
          </div>

          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 mb-8 shadow-md">
              <h2 className="text-2xl font-bold mb-6 text-sky-900 font-orbitron">Data Import & Reset</h2>
              <div className="flex flex-wrap gap-4">
                <input type="file" accept=".json" id="import-test-pack" className="hidden" onChange={handleImportTestPacks} />
                <label htmlFor="import-test-pack" className="bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl cursor-pointer hover:bg-indigo-500 shadow-md transition text-lg">📥 Import JSON Tests</label>
                <button onClick={handleResetAllData} className="bg-red-500 text-white font-bold py-3 px-6 rounded-xl hover:bg-red-400 text-lg shadow-md transition">⚠️ Reset All Player Data</button>
              </div>
          </div>

          <div className="bg-white border-2 border-slate-100 rounded-3xl p-8 shadow-md">
            <h2 className="text-2xl font-bold mb-6 text-sky-900 font-orbitron">Manage Existing Tests</h2>
            <div className="space-y-4">
              {allTests.map(t => (
                <div key={t.id} className="bg-slate-50 p-5 rounded-2xl flex flex-wrap justify-between items-center border border-slate-200 gap-4">
                  <div>
                    <h3 className="font-bold text-lg text-slate-800">{t.title}</h3>
                    <p className="text-slate-500 font-semibold">{t.subject} {t.level ? `• Level ${t.level}` : ''} • {t.questions.length} questions</p>
                  </div>
                  <button onClick={() => handleDeleteTest(t.id)} className="bg-white border-2 border-red-200 text-red-600 font-bold px-6 py-2 rounded-xl hover:bg-red-50 transition">Delete</button>
                </div>
              ))}
              {allTests.length === 0 && <div className="text-center p-8 text-slate-500 font-bold">No tests imported yet. Use "Import JSON Tests" above to add your test packs.</div>}
            </div>
          </div>
        </div>
      );
    };

    const CreateTestView = ({ setView, allTests, updateAllData, userData, showNotification }) => {
        const [title, setTitle] = useState(''); const [subject, setSubject] = useState('Maths'); const [level, setLevel] = useState(1);
        const [questions, setQuestions] = useState([{ question: '', options: ['','','','',''], answer: '' }]);

        const handleSave = () => {
            if(!title) return showNotification({message: "Title required", type:"error"});
            if(questions.some(q => !q.question || !q.answer)) return showNotification({message: "All questions must have text and an answer.", type: "error"});

            const nt = { id: `custom-${Date.now()}`, title, subject, level: Number(level), questions, notes: '' };
            const normalized = normalizeTestPack(nt);
            updateAllData(prev => ({ ...prev, allTests: [...prev.allTests, normalized] }));
            showNotification({message: "Test Created!", type:"success"});
            setView('admin');
        };

        return (
            <div className="p-4 sm:p-10 max-w-4xl mx-auto min-h-screen">
                <div className="flex flex-wrap justify-between items-center mb-8 gap-4"><h1 className="text-3xl font-bold text-sky-900 font-orbitron">Create Test</h1><button onClick={() => setView('admin')} className="font-bold text-slate-500 hover:text-slate-800 bg-white border border-slate-200 px-6 py-2 rounded-xl">Cancel</button></div>
                <div className="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border-2 border-slate-100">
                    <input type="text" placeholder="Test Title" value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-5 mb-6 border-2 border-slate-200 rounded-2xl font-bold text-2xl focus:border-sky-500 outline-none" />
                    <div className="flex flex-wrap gap-4 mb-8">
                    <select value={subject} onChange={e=>setSubject(e.target.value)} className="flex-1 p-4 border-2 border-slate-200 rounded-xl font-bold text-xl outline-none focus:border-sky-500"><option>Maths</option><option>English</option><option>Mixed</option></select>
                    <select value={level} onChange={e=>setLevel(e.target.value)} className="flex-1 p-4 border-2 border-slate-200 rounded-xl font-bold text-xl outline-none focus:border-sky-500"><option value={1}>Level 1</option><option value={2}>Level 2</option><option value={3}>Level 3</option></select>
                    </div>
                    {questions.map((q, i) => (
                    <div key={i} className="mb-8 p-6 bg-sky-50 rounded-3xl border-2 border-sky-100 relative">
                    <span className="absolute -top-3 left-4 bg-sky-200 text-sky-800 px-3 py-1 rounded-full font-bold text-sm">Q {i+1}</span>
                    <textarea placeholder="Question Text" value={q.question} onChange={e=>{const n=[...questions]; n[i].question=e.target.value; setQuestions(n);}} className="w-full p-5 mt-6 mb-4 rounded-2xl border-2 border-slate-200 text-xl font-semibold outline-none focus:border-sky-500" rows="3" />
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    {q.options.map((opt, oIndex) => (
                    <input key={oIndex} type="text" value={opt} onChange={e=>{const n=[...questions]; n[i].options[oIndex]=e.target.value; setQuestions(n);}} placeholder={`Option ${oIndex + 1}`} className={`p-3 rounded-lg border border-slate-200 font-semibold outline-none focus:border-sky-500 ${oIndex === 4 ? 'sm:col-span-2' : ''}`} />
                    ))}
                    </div>
                    <input type="text" placeholder="Exact Correct Answer (option text or letter A..E)" value={q.answer} onChange={e=>{const n=[...questions]; n[i].answer=e.target.value; setQuestions(n);}} className="w-full p-4 rounded-xl border-2 border-emerald-300 bg-emerald-50 font-bold text-lg outline-none focus:border-emerald-500" />
                    </div>
                    ))}
                    <div className="flex flex-col sm:flex-row gap-6 mt-10">
                    <button onClick={() => setQuestions([...questions, {question:'', options:['','','','',''], answer:''}])} className="flex-1 bg-slate-100 text-slate-700 font-bold py-5 rounded-2xl text-xl hover:bg-slate-200 border-2 border-slate-200 transition">Add Question</button>
                    <button onClick={handleSave} className="flex-1 bg-emerald-500 text-white font-bold py-5 rounded-2xl text-xl hover:bg-emerald-400 shadow-lg transition">Save Test</button>
                    </div>
                </div>
            </div>
        );
    };

    const PerformanceDashboardView = ({ setView, userData, allTests }) => {
      const chartRef = useRef(null); const chartInstanceRef = useRef(null);

      const completed = Object.entries(userData.progress||{}).map(([id, p]) => { const t = allTests.find(x=>x.id===id); return (t && Object.keys(p.answers||{}).length === t.questions.length) ? {...t, score: p.score} : null; }).filter(Boolean);

      useEffect(() => {
        if (!chartRef.current || !window.Chart) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        if (completed.length === 0) return;
        const maths = completed.filter(t=>t.subject==='Maths').map(t=>(t.score/t.questions.length)*100);
        const english = completed.filter(t=>t.subject==='English').map(t=>(t.score/t.questions.length)*100);
        const mixed = completed.filter(t=>t.subject==='Mixed').map(t=>(t.score/t.questions.length)*100);
        const maxLength = Math.max(maths.length, english.length, mixed.length);

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
              labels: Array.from({length: maxLength}, (_,i)=>`Attempt ${i+1}`),
              datasets: [
                  {label: 'Maths (%)', data: maths, borderColor: '#3b82f6', tension: 0.2, pointRadius: 6, pointHoverRadius: 8},
                  {label: 'English (%)', data: english, borderColor: '#ec4899', tension: 0.2, pointRadius: 6, pointHoverRadius: 8},
                  {label: 'Mixed (%)', data: mixed, borderColor: '#8b5cf6', tension: 0.2, pointRadius: 6, pointHoverRadius: 8}
              ]
          },
          options: { scales: { y: { beginAtZero: true, max: 100 } }, responsive: true }
        });
      }, [userData, allTests, completed]);

      return (
          <div className="p-8 max-w-5xl mx-auto min-h-screen">
              <div className="flex justify-between items-center mb-8"><h1 className="text-4xl font-bold text-sky-900 font-orbitron">Performance Charts</h1><button onClick={() => setView('admin')} className="font-bold bg-white border border-slate-200 px-6 py-3 rounded-xl text-slate-500 hover:text-slate-800 shadow-sm">Back</button></div>
              <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-slate-100">
                  {completed.length > 0 ? <canvas ref={chartRef}></canvas> : <p className="text-center font-bold text-slate-500 text-xl py-10">No data yet. Complete a test to see your progress!</p>}
              </div>
          </div>
      );
    };

    // ---------- Settings with dyslexia paper option & hashed PIN save ----------
    const SettingsView = ({ userData, setView, updateUserData, showNotification }) => {
      const [name, setName] = useState(userData.name || 'Nicolas');
      const [avatar, setAvatar] = useState(userData.avatar || '👨‍🚀');
      const [dyslexiaFriendly, setDyslexiaFriendly] = useState(userData.dyslexiaFriendly || false);
      const [dyslexiaPaper, setDyslexiaPaper] = useState(userData.dyslexiaPaper || 'default');
      const [soundEnabled, setSoundEnabled] = useState(userData.soundEnabled !== false);
      const [parentPin, setParentPin] = useState(userData.parentPin || "1234");
      const avatars = ['👨‍🚀', '🚀', '⭐', '🎮', '🤖', '🧠', '💡', '🏆'];

      const saveSettings = async () => {
        // Hash the PIN if not hashed
        let pinToStore = parentPin || '';
        if (!isHashedPin(pinToStore)) {
          try { pinToStore = await hashPin(pinToStore); } catch(e) { console.warn('hash failed', e); }
        }
        updateUserData(prev => ({ name, avatar, dyslexiaFriendly, dyslexiaPaper, soundEnabled, parentPin: pinToStore, stars: prev.stars || 0 }));
        showNotification({message:"Settings Saved!", type:"success"});
        setView('dashboard');
      };

      return (
        <div className="p-4 sm:p-8 min-h-screen flex items-center justify-center">
          <div className="max-w-lg mx-auto w-full bg-white border-4 border-slate-100 rounded-[2rem] p-8 sm:p-10 shadow-2xl">
            <h1 className="text-3xl sm:text-4xl font-bold font-orbitron text-sky-900 mb-8 text-center">Profile Settings</h1>

            <label className="block text-slate-500 font-bold mb-2 uppercase text-sm">Player Name</label>
            <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-5 bg-slate-50 rounded-2xl border-2 border-slate-200 mb-6 font-bold text-xl outline-none focus:border-sky-500 transition" placeholder="Player Name" />
            <label className="block text-slate-500 font-bold mb-2 uppercase text-sm">Choose Your Avatar</label>
            <div className="grid grid-cols-4 gap-3 mb-8">
              {avatars.map(av => <button key={av} onClick={() => setAvatar(av)} className={`text-4xl p-3 rounded-2xl transition-all ${avatar === av ? 'bg-sky-100 ring-4 ring-sky-400 transform scale-110 shadow-md' : 'bg-slate-50 hover:bg-slate-100 border-2 border-slate-200'}`}>{av}</button>)}
            </div>

            <label className="flex items-center justify-between p-5 border-2 border-slate-200 rounded-2xl mb-4 cursor-pointer hover:bg-slate-50 transition">
                <div><span className="block font-bold text-slate-800 text-lg">Dyslexia Friendly Font</span><span className="text-slate-500 font-semibold text-sm">Uses Open Sans / Arial for all text.</span></div>
                <input type="checkbox" checked={dyslexiaFriendly} onChange={() => setDyslexiaFriendly(!dyslexiaFriendly)} className="w-7 h-7 text-sky-600 focus:ring-sky-500 border-slate-300 rounded-lg" />
            </label>

            <label className="block text-slate-500 font-bold mb-2 uppercase text-sm">Dyslexia Paper Color</label>
            <div className="flex gap-3 mb-6">
              <button onClick={() => setDyslexiaPaper('default')} className={`p-3 rounded-xl border ${dyslexiaPaper==='default'?'bg-slate-100':'bg-white'}`}>Default</button>
              <button onClick={() => setDyslexiaPaper('cream')} className={`p-3 rounded-xl border ${dyslexiaPaper==='cream'?'bg-amber-50':'bg-white'}`}>Cream</button>
              <button onClick={() => setDyslexiaPaper('blue')} className={`p-3 rounded-xl border ${dyslexiaPaper==='blue'?'bg-blue-50':'bg-white'}`}>Light Blue</button>
            </div>

            <label className="flex items-center justify-between p-5 border-2 border-slate-200 rounded-2xl mb-8 cursor-pointer hover:bg-slate-50 transition">
                <div><span className="block font-bold text-slate-800 text-lg">Sound Effects</span><span className="text-slate-500 font-semibold text-sm">Chimes and celebrations.</span></div>
                <input type="checkbox" checked={soundEnabled} onChange={() => setSoundEnabled(!soundEnabled)} className="w-7 h-7 text-sky-600" />
            </label>

            <div className="pt-6 border-t-2 border-slate-100 mb-8">
                <label className="block text-slate-500 font-bold mb-2 uppercase text-sm">Parent Admin PIN (stored securely)</label>
                <input type="text" value={parentPin} onChange={e => setParentPin(e.target.value)} className="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-200 font-bold text-xl outline-none focus:border-purple-500 text-center" placeholder="1234" />
            </div>
            <div className="flex gap-4">
              <button onClick={() => setView('dashboard')} className="w-full bg-slate-200 text-slate-700 font-bold py-4 rounded-xl hover:bg-slate-300 text-lg transition">Cancel</button>
              <button onClick={saveSettings} className="w-full bg-emerald-500 text-white font-bold py-4 rounded-xl hover:bg-emerald-400 text-lg shadow-lg transition transform hover:-translate-y-1">Save Profile</button>
            </div>
          </div>
        </div>
      );
    };

    // ---------- Achievements (view) ----------
    const AchievementsView = ({ userData, setView, updateUserData, showNotification }) => {
      const [activeTab, setActiveTab] = useState('Badges');
      const unlockedTitles = achievementsList.filter(a => userData.achievements[a.id] && a.unlocksTitle);
      return (
        <div className="p-4 sm:p-10 min-h-screen max-w-7xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-10 gap-4">
              <h1 className="text-4xl sm:text-5xl font-bold font-orbitron text-sky-900">Achievements 🏆</h1>
              <button onClick={() => setView('dashboard')} className="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-8 rounded-xl hover:bg-slate-50 shadow-sm text-lg transition">Back to Dashboard</button>
          </div>
          <div className="flex gap-4 mb-10 bg-slate-100 p-2 rounded-2xl inline-flex">
              <button onClick={()=>setActiveTab('Badges')} className={`px-8 py-4 font-bold rounded-xl text-lg transition ${activeTab==='Badges' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Badges</button>
              <button onClick={()=>setActiveTab('Titles')} className={`px-8 py-4 font-bold rounded-xl text-lg transition ${activeTab==='Titles' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Titles</button>
          </div>
          {activeTab === 'Badges' && (
              <div className="space-y-12">
                  {['Quick Wins', 'Medium-Term', 'Longer-Term'].map(cat => (
                    <div key={cat}>
                    <h2 className="text-3xl font-bold text-slate-800 mb-6 border-b-4 border-slate-200 pb-3 font-orbitron">{cat}</h2>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    {achievementsList.filter(a => a.category === cat).map(a => {
                    const unl = userData.achievements[a.id];
                    return (
                    <div key={a.id} className={`p-6 rounded-3xl border-4 text-center transition-all flex flex-col items-center justify-center min-h-[200px] relative ${unl ? 'bg-white border-amber-400 shadow-xl transform hover:-translate-y-1' : 'bg-slate-50 border-slate-200 opacity-60 grayscale'}`}>
                    <div className={`text-6xl mb-4 ${unl ? '' : 'opacity-50'}`}>{a.icon || '🏆'}</div>
                    <h3 className={`font-black text-xl mb-2 leading-tight ${unl ? 'text-amber-600' : 'text-slate-500'}`}>{a.title}</h3>
                    <p className="text-sm font-bold text-slate-500 leading-snug">{a.description}</p>
                    {!unl && a.getProgress && (
                    <div className="absolute bottom-3 text-xs font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">{a.getProgress(userData)}</div>
                    )}
                    </div>
                    )
                    })}
                    </div>
                    </div>
                  ))}
              </div>
          )}
          {activeTab === 'Titles' && (
              <div className="bg-white p-10 rounded-3xl shadow-xl border-4 border-slate-100">
                  <h2 className="text-3xl font-bold text-sky-900 mb-8 font-orbitron">Equip a Title</h2>
                  {unlockedTitles.length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {unlockedTitles.map(a => (
                    <div key={a.id} className="flex flex-col sm:flex-row justify-between items-center p-6 bg-slate-50 border-2 border-slate-200 rounded-2xl gap-4 hover:border-sky-300 transition">
                    <div className="text-center sm:text-left">
                    <p className="font-black text-2xl text-amber-600 mb-1">{a.unlocksTitle}</p>
                    <p className="text-slate-500 font-bold text-sm">Unlocked from: {a.title}</p>
                    </div>
                    <button onClick={() => { updateUserData(prev => ({...prev, title: a.unlocksTitle})); showNotification({message:"Title Equipped!", type:"success"}); }} disabled={userData.title===a.unlocksTitle} className="w-full sm:w-auto bg-sky-600 text-white font-bold py-3 px-8 rounded-xl disabled:bg-slate-300 disabled:text-slate-500 shadow-md transition">
                    {userData.title===a.unlocksTitle ? 'Equipped' : 'Equip'}
                    </button>
                    </div>
                    ))}
                    </div>
                  ) : (
                    <div className="text-center p-12 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300">
                    <p className="text-slate-500 font-bold text-2xl">No titles unlocked yet.</p>
                    <p className="text-slate-400 font-semibold mt-2 text-lg">Keep earning badges to unlock them!</p>
                    </div>
                  )}
              </div>
          )}
        </div>
      );
    };

    // ---------- Simple Shop ----------
    const ShopView = ({ userData, setView, updateUserData, showNotification }) => {
      const items = [
        { id: 'hat-1', title: 'Cool Hat', price: 5, avatar: '🎩' },
        { id: 'rocket-skin-1', title: 'Blue Rocket', price: 8, avatar: '🚀' },
        { id: 'star-border', title: 'Star Border', price: 10, avatar: '✨' },
      ];
      const buy = (it) => {
        const stars = userData.stars || 0;
        if (stars < it.price) { showNotification({ message: "Not enough Stars.", type: 'error' }); return; }
        updateUserData(prev => ({ stars: (prev.stars || 0) - it.price, avatar: it.avatar }), { event: { type: 'NO_OP' }});
        showNotification({ message: `Bought ${it.title}!`, type: 'success' });
        setTimeout(() => setView('dashboard'), 600);
      };
      return (
        <div className="p-8 max-w-4xl mx-auto">
          <div className="flex justify-between items-center mb-6">
            <h1 className="text-3xl font-bold font-orbitron">Shop</h1>
            <div className="text-right">
              <div className="text-sm text-slate-500">Stars</div>
              <div className="text-2xl font-black text-amber-500">{userData.stars || 0} ★</div>
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {items.map(it => (
              <div key={it.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                <div className="text-5xl mb-4">{it.avatar}</div>
                <div className="font-bold text-lg mb-2">{it.title}</div>
                <div className="text-amber-500 font-black text-2xl mb-4">{it.price} ★</div>
                <button onClick={() => buy(it)} className="bg-emerald-500 text-white px-4 py-2 rounded-xl font-bold">Buy</button>
              </div>
            ))}
          </div>
          <div className="mt-6">
            <button onClick={() => setView('dashboard')} className="bg-slate-100 px-4 py-2 rounded-xl">Back</button>
          </div>
        </div>
      );
    };

    // ---------- Breathe module ----------
    const BreatheView = ({ setView }) => {
      const [phase, setPhase] = useState(0);
      const [count, setCount] = useState(4);
      const intervalRef = useRef(null);
      useEffect(() => {
        setPhase(0); setCount(4);
        intervalRef.current = setInterval(() => {
          setPhase(p => (p + 1) % 3);
          setCount(c => c === 1 ? 4 : c - 1);
        }, 4000);
        return () => clearInterval(intervalRef.current);
      }, []);
      return (
        <div className="p-8 min-h-screen flex items-center justify-center">
          <div className="bg-white rounded-3xl p-10 shadow-xl text-center max-w-xl">
            <h2 className="text-3xl font-bold mb-4 font-orbitron">Morning Breathe</h2>
            <p className="text-slate-600 mb-6">A 90-second guided breathing exercise to calm exam nerves.</p>
            <div className="mb-6">
              <div className="w-40 h-40 rounded-full mx-auto flex items-center justify-center bg-sky-50 border-4 border-sky-100">
                <div className="text-5xl">{phase===0 ? '🌬️' : phase===1 ? '😮' : '😌'}</div>
              </div>
            </div>
            <div className="text-xl font-bold mb-4">{phase === 0 ? 'Breathe in...' : phase === 1 ? 'Hold' : 'Breathe out...'}</div>
            <button onClick={() => setView('dashboard')} className="bg-sky-600 text-white px-6 py-3 rounded-xl font-bold">Done</button>
          </div>
        </div>
      );
    };

    // ---------- App ----------
    function App() {
      const [appData, setAppData] = useState(null);
      const [view, setView] = useState('loading');
      const [selectedTest, setSelectedTest] = useState(null);
      const [notificationQueue, setNotificationQueue] = useState([]);
      const [modal, setModal] = useState({ show: false });

      const isInitialized = useRef(false);
      const showNotification = useCallback(({ message, type = 'success' }) => {
        setNotificationQueue(prev => [...prev, { message, type, id: Date.now() + Math.random() }]);
      }, []);
      const dismissNotification = useCallback((idToRemove) => { setNotificationQueue(prev => prev.filter(n => n.id !== idToRemove)); }, []);
      const hideModal = useCallback(() => setModal({ show: false }), []);

      const showModalWrapper = useCallback(({ title, message, onConfirm, onCancel, confirmText, children }) => {
        setModal({
          show: true, title, message,
          onConfirm: onConfirm ? () => { onConfirm(); hideModal(); } : null,
          onCancel: onCancel ? () => { onCancel(); hideModal(); } : hideModal,
          confirmText, children
        });
      }, [hideModal]);

      const handleSelectTest = useCallback((testId, skipModal = false) => {
        if (!appData) return;
        const test = appData.allTests.find(t => t.id === testId);
        if (!test) { showNotification({ message: 'Test not found. Import it via Admin → Import JSON.', type: 'error' }); return; }
        const progress = appData.userData.progress?.[testId];
        const answered = progress ? Object.keys(progress.answers || {}).length : 0;

        if (progress && answered > 0 && answered < test.questions.length) {
            setSelectedTest({ id: testId, settings: progress.settings || { mode: 'Practice', shuffle: false } });
            setView('quiz');
            return;
        }
        if (skipModal) {
            setSelectedTest({ id: testId, settings: { mode: 'Practice', shuffle: true } });
            setView('quiz');
            return;
        }
        showModalWrapper({
          title: "Choose Your Mode",
          children: (
            <div className="space-y-4">
              <button onClick={() => { setSelectedTest({ id: testId, settings: { mode: 'Practice', shuffle: false } }); setView('quiz'); hideModal(); }} className="w-full text-left p-6 bg-sky-100 hover:bg-sky-200 rounded-2xl border-2 border-sky-300 transition"><h3 className="font-bold text-sky-900 text-xl">Practice Mode</h3><p className="text-sky-700 mt-2">No timer, hints enabled, live feedback.</p></button>
              <button onClick={() => { setSelectedTest({ id: testId, settings: { mode: 'Test', shuffle: false } }); setView('quiz'); hideModal(); }} className="w-full text-left p-6 bg-amber-100 hover:bg-amber-200 rounded-2xl border-2 border-amber-300 transition"><h3 className="font-bold text-amber-900 text-xl">Test Mode</h3><p className="text-amber-700 mt-2">Timer countdown runs, no hints, results at the end.</p></button>
              <CustomModeSelector onStart={(settings) => { setSelectedTest({ id: testId, settings }); setView('quiz'); hideModal(); }} />
            </div>
          ), onCancel: hideModal
        });
      }, [appData, showModalWrapper, hideModal, showNotification]);

      useEffect(() => {
        if (isInitialized.current) return;
        isInitialized.current = true;

        // Load saved or seed default
        const savedData = localStorage.getItem('seagPortalData');
        let loadedData = savedData ? JSON.parse(savedData) : null;

        if (!loadedData || !loadedData.userData) {
          loadedData = {
            schemaVersion: 1,
            userData: { name: "Nicolas", avatar: '👨‍🚀', progress: {}, level: 1, xp: 0, totalAttempts: 0, currentStreak: 0, correctRunAfterWrong: 0, achievements: {}, parentPin: "1234", lastLoginDate: new Date().toDateString(), loginStreak: 1, perTopicStats: {}, reviewCorrections: 0, noHintStreak: 0, noHintCorrectCount: 0, lastCorrectAnswerTimes: [], totalCorrectAnswers: 0, uniqueTagsToday: { date: new Date().toDateString(), tags: [] }, stars: 0, dyslexiaFriendly: false, dyslexiaPaper: 'default' },
            allTests: [], // <-- no embedded tests: empty until import
            deletedDefaultTests: []
          };
          safeSetLocalStorage('seagPortalData', JSON.stringify(loadedData));
        } else {
            // ensure tests are normalized and keep previously imported tests
            loadedData.allTests = (loadedData.allTests || []).map(normalizeTestPack);
            // upgrade plain PIN to hashed form if needed
            if (loadedData.userData && loadedData.userData.parentPin && !isHashedPin(loadedData.userData.parentPin)) {
              (async () => {
                try {
                  const h = await hashPin(loadedData.userData.parentPin);
                  loadedData.userData.parentPin = h;
                  safeSetLocalStorage('seagPortalData', JSON.stringify(loadedData));
                } catch(e) { console.warn('Could not hash stored PIN', e); }
              })();
            }
        }

        const todayStr = new Date().toDateString();
        const lastLogin = loadedData.userData.lastLoginDate;

        if (lastLogin !== todayStr) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          if (lastLogin === yesterday.toDateString()) {
              loadedData.userData.loginStreak = (loadedData.userData.loginStreak || 0) + 1;
          } else {
              loadedData.userData.loginStreak = 1;
          }
          loadedData.userData.lastLoginDate = todayStr;
        }
        if (loadedData.userData.dailyChallenge?.date !== todayStr) {
            loadedData.userData.dailyChallenge = { ...loadedData.userData.dailyChallenge, completedToday: false };
        }
        setAppData(loadedData);
        setView('dashboard');
      }, []);

      // apply dyslexia classes
      useEffect(() => {
        if (!appData) return;
        if (appData.userData?.dyslexiaFriendly) document.body.classList.add('dyslexia-friendly'); else document.body.classList.remove('dyslexia-friendly');
        document.body.classList.remove('dyslexia-cream', 'dyslexia-blue');
        if (appData.userData?.dyslexiaPaper === 'cream') document.body.classList.add('dyslexia-cream');
        if (appData.userData?.dyslexiaPaper === 'blue') document.body.classList.add('dyslexia-blue');
      }, [appData?.userData?.dyslexiaFriendly, appData?.userData?.dyslexiaPaper, appData]);

      // updateUserData - centralized user updates and event handling (micro-XP, achievements, stars)
      const updateUserData = useCallback((updater, options = {}) => {
        setAppData(prev => {
            if (!prev) return prev;
            const { event } = options || {};
            const partialData = typeof updater === 'function' ? updater(prev.userData) : updater;
            let mutable = { ...prev.userData, ...partialData };

            let leveledUp = false;
            let newLevel = mutable.level || 1;
            let pendingNotifications = [];

            if (event?.type === 'ANSWER_SUBMITTED') {
                mutable.totalAttempts = (mutable.totalAttempts || 0) + 1;
                const isCorrect = !!event.payload.correct;
                const prevWasIncorrect = !!mutable.lastAnswerWasIncorrect;
                mutable.lastAnswerWasIncorrect = !isCorrect;

                if (isCorrect) {
                    mutable.totalCorrectAnswers = (mutable.totalCorrectAnswers || 0) + 1;
                    mutable.currentStreak = (mutable.currentStreak || 0) + 1;
                    mutable.correctRunAfterWrong = prevWasIncorrect ? 1 : (mutable.correctRunAfterWrong || 0) + 1;

                    if (!event.payload.usedHint) {
                      mutable.noHintCorrectCount = (mutable.noHintCorrectCount || 0) + 1;
                      mutable.noHintStreak = (mutable.noHintStreak || 0) + 1;
                    }

                    const timeToAns = event.payload.timeToAnswer || 0;
                    mutable.lastCorrectAnswerTimes = [...(mutable.lastCorrectAnswerTimes || []), timeToAns].slice(-3);

                    if (event.payload.wasReviewed) {
                      mutable.reviewCorrections = (mutable.reviewCorrections || 0) + 1;
                    }

                    // micro XP: short burst for fast correct answers
                    if (timeToAns <= 20) {
                      mutable.xp = (mutable.xp || 0) + 2;
                      pendingNotifications.push(`⚡ Fast Correct! +2 XP`);
                    }

                    // streak small bonuses
                    if (mutable.currentStreak > 0 && mutable.currentStreak % 5 === 0) {
                      mutable.xp = (mutable.xp || 0) + 10;
                      pendingNotifications.push(`🔥 ${mutable.currentStreak} Streak Bonus! +10 XP`);
                    }
                } else {
                    mutable.currentStreak = 0;
                    mutable.correctRunAfterWrong = 0;
                    mutable.noHintStreak = 0;
                }

                mutable.perTopicStats = mutable.perTopicStats || {};
                const tags = Array.isArray(event.payload.tags) ? event.payload.tags : [];

                mutable.correctAnswersByTag = mutable.correctAnswersByTag || {};
                tags.forEach(t => {
                    mutable.correctAnswersByTag[t] = (mutable.correctAnswersByTag[t] || 0) + (event.payload.correct ? 1 : 0);

                    const s = mutable.perTopicStats[t] || { total: 0, correct: 0 };
                    s.total += 1;
                    if (event.payload.correct) s.correct += 1;
                    mutable.perTopicStats[t] = s;
                });
                const todayStr = new Date().toDateString();
                if (mutable.uniqueTagsToday?.date !== todayStr) mutable.uniqueTagsToday = { date: todayStr, tags: [] };
                if (tags.length > 0) {
                    const mergedTags = new Set([...mutable.uniqueTagsToday.tags, ...tags]);
                    mutable.uniqueTagsToday.tags = Array.from(mergedTags);
                }
            }

            if (event?.type === 'PACK_COMPLETED') {
                if (event.payload.isDailyChallenge) {
                    if (!mutable.dailyChallenge?.completedToday) {
                      mutable.dailyChallengeStreak = (mutable.dailyChallengeStreak || 0) + 1;
                    }
                    mutable.dailyChallenge = { completedToday: true, date: new Date().toDateString() };
                }
                let xpMultiplier = 1;
                if (event.payload.mode === 'Practice') xpMultiplier = 0.5;
                if (event.payload.isDailyChallenge) xpMultiplier = 1.5;
                let xpToAdd = Math.floor(event.payload.score * xpMultiplier);
                mutable.xp = (mutable.xp || 0) + xpToAdd;

                // award Stars on completion
                const totalQ = event.payload.totalQuestions || 1;
                const stars = Math.round((event.payload.score / Math.max(1, totalQ)) * 5);
                mutable.stars = (mutable.stars || 0) + stars;

                let thresh = (mutable.level || 1) * 100;
                while (mutable.xp >= thresh) {
                    mutable.xp -= thresh;
                    mutable.level = (mutable.level || 1) + 1;
                    newLevel = mutable.level;
                    thresh = mutable.level * 100;
                    leveledUp = true;
                }
            }

            const { updated, unlockedIds } = unlockAchievements(mutable, event);
            const newData = { ...prev, userData: updated, schemaVersion: 1 };
            safeSetLocalStorage('seagPortalData', JSON.stringify(newData));
            setTimeout(() => {
                pendingNotifications.forEach(msg => showNotification({ message: msg, type: 'success' }));
                if (leveledUp) {
                    playSound('levelup', updated.soundEnabled !== false);
                    confetti({ particleCount: 300, spread: 100, origin: { y: 0.3 } });
                    showModalWrapper({ title: "🎉 LEVEL UP! 🎉", message: `Amazing job! You are now Level ${newLevel}! Keep up the great work.`, confirmText: "Awesome!" });
                }
                if (unlockedIds.length > 0) {
                    const newBadges = unlockedIds.map(id => achievementsList.find(a => a.id === id)?.title).join(', ');
                    showNotification({ message: `🏆 Achievement Unlocked: ${newBadges}`, type: 'success' });
                }
            }, 0);
            return newData;
        });
      }, [showModalWrapper, showNotification]);

      const updateAllData = useCallback((updater) => {
          setAppData(prev => {
              if(!prev) return prev;
              const newData = typeof updater === 'function' ? updater(prev) : updater;
              // ensure tests normalized before saving
              newData.allTests = (newData.allTests || []).map(normalizeTestPack);
              safeSetLocalStorage('seagPortalData', JSON.stringify(newData));
              return newData;
          });
      }, []);

      if (!appData) return <LoadingSpinner message="Loading Portal System..." />;

      return (
        <div>
          {view === 'loading' && <LoadingSpinner message="Loading Portal System..." />}
          {view === 'dashboard' && <Dashboard userData={appData.userData} setView={setView} handleSelectTest={handleSelectTest} allTests={appData.allTests} showModal={showModalWrapper} hideModal={hideModal} updateAllData={updateAllData} appData={appData} showNotification={showNotification} />}
          {view === 'quiz' && <QuizView userData={appData.userData} testDetails={selectedTest} setView={setView} allTests={appData.allTests} updateUserData={updateUserData} showNotification={showNotification} showModal={showModalWrapper} />}
          {view === 'results' && <ResultsView userData={appData.userData} setView={setView} testDetails={selectedTest} allTests={appData.allTests} updateUserData={updateUserData} handleSelectTest={handleSelectTest} />}
          {view === 'admin' && <AdminView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} showModal={showModalWrapper} showNotification={showNotification} />}
          {view === 'parentDashboard' && <ParentDashboardView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} />}
          {view === 'createTest' && <CreateTestView userData={appData.userData} setView={setView} allTests={appData.allTests} updateAllData={updateAllData} showNotification={showNotification} />}
          {view === 'performance' && <PerformanceDashboardView userData={appData.userData} setView={setView} allTests={appData.allTests} />}
          {view === 'settings' && <SettingsView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={showNotification} />}
          {view === 'achievements' && <AchievementsView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={showNotification} />}
          {view === 'shop' && <ShopView userData={appData.userData} setView={setView} updateUserData={updateUserData} showNotification={showNotification} />}
          {view === 'breathe' && <BreatheView setView={setView} />}

          <NotificationManager notifications={notificationQueue} onDismiss={dismissNotification} />
          {modal.show && <Modal title={modal.title} message={modal.message} onConfirm={modal.onConfirm} onCancel={modal.onCancel} confirmText={modal.confirmText}>{modal.children}</Modal>}
        </div>
      );
    }

    // ---------- Render ----------
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

  </script>
</body>
</html>
